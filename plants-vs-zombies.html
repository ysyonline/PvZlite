// ============ 波次 ============
// 波次生成：用队列逐个放出，不是一次性全刷
let spawnQueue=[];      // 待生成的僵尸队列
let spawnTimer=0;       // 生成倒计时
let waveInterval=0;     // 波次间隔倒计时
let waveActive=false;   // 当前是否在生成中
let waveDrainedT=0;     // 上一波最后一只放出的时刻（清场门槛/兜底计时的基准，2026-09-16）
// v1.3-M4 FIX-01 v2（口径修订 2026-09-19 20:52）：教学关（'1-1'/'1-2'；T-104b 前为数字关号 1–2，1-based）全波次出怪串行门（用户裁决：
// 教学关降并发）。规则：上一只入场僵尸还活着且距其入场 <10s → 跳过本次放出（不耗队列、不算波进度）；
// 死了 → 立即放行；≥10s → 放行兜底防僵死。非教学关（levelKey∉{'1-1','1-2'}）不适用，节奏逐字节原样。
let spawnGateZ=null;    // 最近入场的僵尸引用（killZombie 会置 dead，引用仍可判活）
let spawnGateT=-1e9;    // 最近入场的 gt 时刻
// 大波预警：active=横幅显示中，t=剩余秒数，last=已预警过的波次号，
// pending=倒计时已结束但还在等场上清空（横幅此时已隐藏，只等刷怪时机，2026-09-16 拆分）
let warn={active:false,t:0,last:0,pending:false};

function newWave(n){
  const cfg=level.waves[n-1];
  if(!cfg)return;
  const mult=DIFFS[DIFF].mult, speed=DIFFS[DIFF].speed;
  const STATS={
    normal:[180,16],
    cone:[340,15],
    fast:[140,45],
    bucket:[560,12]
  };
  // 把关卡配置的 spawns 展开成待生成列表，再打乱顺序
  const list=[];
  for(const [type,cnt] of cfg.spawns){
    for(let i=0;i<cnt;i++)list.push(type);
  }
  for(let i=list.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [list[i],list[j]]=[list[j],list[i]];
  }
  spawnQueue=[];
  for(const type of list){
    const s=STATS[type];
    spawnQueue.push({
      type,row:Math.floor(Math.random()*ROWS),
      hp:s[0]*mult,maxHp:s[0]*mult,
      spd:s[1]*speed*R(0.92,1.08),
      eating:false,eatAnim:0,walk:R(0,10),dead:false
    });
  }
  spawnTimer=0;
  waveInterval=cfg.interval;
  waveActive=true;
  waveDrainedT=gt;      // 兜底计时基准：本波开始放怪的时刻
  SFX.wave();
}

// 从队列中逐个放出僵尸
function processSpawnQueue(dt){
  if(!waveActive||spawnQueue.length===0)return;
  // v1.3-M4 FIX-01 v2：教学关全波次出怪串行门（gating=levelKey∈{'1-1','1-2'}；其余关走原路径逐字节原样）。
  // 门开条件：无前一只（spawnGateZ=null）/ 前一只已死（killZombie 置 dead，引用仍在）/ 距前一只入场 ≥10s（兜底防僵死）。
  // 门没开 → 本帧 return：队列不耗、不算波进度，下一帧重查（前一只死后下一帧即放行，符合「死了立即放行」）。
  // 门内不走 spawnTimer 节奏（10s 门距本身即节奏；避免旧倒计时把「死亡放行」拖过 10s）。
  if(levelKey==='1-1'||levelKey==='1-2'){
    if(spawnGateZ!==null&&!spawnGateZ.dead&&gt-spawnGateT<10)return;
    spawnGateZ=spawnQueue[0];spawnGateT=gt;   // 记本帧入场者，作为门内下一只的基准
  }else{
    spawnTimer-=dt;
    if(spawnTimer>0)return;
    // 间隔下限 2.5s（2026-09-16 放宽：原 1.5s 并发太密），队列剩得多时再 +0.5s/只 喘息
    spawnTimer=Math.max(2.5,waveInterval)+(spawnQueue.length>6?0.5:0);
  }
  // 并发数量
  const n=Math.min(spawnQueue.length, spawnQueue[0].concurrent||1);
  for(let i=0;i<n;i++){
    const z=spawnQueue.shift();
    z.x=canvas.width-40+R(0,60)+i*70;
    zombies.push(z);
  }
  if(spawnQueue.length===0){waveActive=false;waveDrainedT=gt}   // 队列放完 → 记时刻（供清场门槛/兜底用）
}

// ============ 更新 ============
function update(dt){
  // F-04：震动/闪光计时递减已迁至 loop() 无条件段（v1.6 bug1）——见 loop 内迁移点注释。
  // 旧实现留在这里 ⇒ end 态不跑 update ⇒ 结算屏抖动/闪光永不衰减（bug1 根因）。
  if(testMode&&state==='play')sun=9999;   // 测试模式阳光锁：种植物扣掉的下一帧立即回满
  // effects：阳光 + 粒子统一处理
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];
      if(e.kind==='sun'){
        if(e.y<e.targetY){
          e.y=Math.min(e.targetY,e.y+e.fall*dt*60);
          e.x+=Math.sin(e.t*3)*30*dt;
        }else{
          e.stayT=(e.stayT||0)+dt;
          if(e.stayT>8)e.dead=true;
        }
        e.t+=dt;
      }else if(e.kind==='particle'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=400*dt;e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='corpse-part'){   // F-02 死亡零件（蓝图 §3）：重力 900 比粒子重，体现厚重感
      e.vy+=900*dt;
      e.x+=e.vx*dt;
      e.y+=e.vy*dt;
      e.rot+=e.omega*dt;
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='shockwave'){   // F-03 冲击波环（蓝图 §4）
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='boom'){
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='coin'){   // 死亡爆币·装饰飞币（2026-09-21 验收）：抛物线+地面反弹一次+自转
      e.vy+=760*dt;              // 重力（比 corpse-part 900 略轻，硬币飘感）
      e.x+=e.vx*dt;
      e.y+=e.vy*dt;
      e.rot+=e.omega*dt;
      e.life-=dt;
      // 地面反弹一次（落点=生成 y + 26px 内随机地面线）：vy 反转衰减，vx 摩擦
      if(!e.bounced&&e.vy>0&&e.y>=e.groundY){
        e.bounced=true;
        e.y=e.groundY;
        e.vy*=-R(0.35,0.5);e.vx*=0.6;e.omega*=0.5;
      }
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='coin-flash'){   // 死亡爆币·爆点金光：径向光晕炸开消散
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }
  }
  effects=effects.filter(e=>!e.dead);

  // 卡片冷却递减（关键修复：之前漏了这一步，导致种过一次后卡片永久灰）
  // B2：冷却归零当帧报"就绪"（§B2 · P0）——卡片由灰转彩原本完全无声，玩家经常错过
  for(const c of CARDS){
    if(cardCD[c.type]>0){
      cardCD[c.type]=Math.max(0,cardCD[c.type]-dt);
      if(cardCD[c.type]===0)SFX.cardReady(c.type);
    }
  }

  for(const p of plants)updatePlant(p,dt);
  processSpawnQueue(dt);
  updateProjectiles(dt);
  updateZombies(dt);
  updatePointDrops(dt);   // v1.4 T-04：积分掉落物生命周期（与 effects 独立）
  checkWave(dt);
}

// ============ v1.6 第4刀：投掷类公用抛物解算器（D1）============
// 从 v1.3 cabbage 内联解算抽取（原 updatePlant cabbage 分支，几何逐行等价迁移）。
// 口径（不动）：同行、z.x > pos.x-10 的**最左**僵尸为目标；发射点 = 植物格右缘 (pos.x+30, pos.y)；
//   命中基线 zy 随目标地面列抬升（ADR-005：zy=GRID_Y+row*CELL_H+CELL_H/2−liftX(target.x)）；
//   按目标速度做提前量预测（eating 视为静止目标）解算垂向初速 vy0。
// ★ 等价红线：cabbage 改为调用本函数后必须与原内联逻辑逐帧等价（dmg 20 / cd 2.0 / 仅 SFX.melonThrow）。
//   弹体一律带 vy/g 字段 ⇒ updateProjectiles 以「字段存在性」判定抛物积分（红线 D3，勿用 type 白名单）。
// spec = {dmg, type, splash, splashRatio?, splashGrid?, chill?, butter?}：附加效果字段按需透传，缺省不写入（字段存在性语义）。
//   splashGrid（v1.8 同格锁）：置真时溅射判定收窄为「落点同一格」（cabbage/corn 专用）；melon/icemelon 不带此字段，走旧 55px 跨格带状判定。
// 返回：true=已 push 弹体；false=无目标（调用方据此决定是否播抛掷音效，与原 cabbage 的 if(target) 同构）。
function fireArcProjectile(p,pos,spec){
  let target=null;
  for(const z of zombies){
    if(z.dead||z.row!==p.row||z.x<=pos.x-10)continue;
    if(!target||z.x<target.x)target=z;
  }
  if(!target)return false;
  const sx=pos.x+30, sy=pos.y;                              // 发射点 = 植物格右缘
  const zy=GRID_Y+p.row*CELL_H+CELL_H/2-liftX(target.x);    // 本行基线（随目标地面列抬升；发射 y 不动，见 ADR-005）
  const tSpd=target.eating?0:target.spd;                    // 啃食中视为静止目标
  const t0=Math.max(50,target.x-sx)/CABBAGE_VX;             // 初估飞行时间
  const lead=target.x-tSpd*t0;                              // 预测僵尸飞行后位置（提前量修正）
  const d=Math.max(50,lead-sx), t=d/CABBAGE_VX;             // 修正后水平距离/飞行时间
  const vy0=(zy-sy-0.5*CABBAGE_G*t*t)/t;                    // 抛物解算垂向初速
  const pr={x:sx,y:sy,vx:CABBAGE_VX,vy:vy0,g:CABBAGE_G,dmg:spec.dmg,row:p.row,type:spec.type,splash:spec.splash,dead:false};
  if(spec.splashRatio!==undefined)pr.splashRatio=spec.splashRatio;   // 溅射伤害系数（缺省走 updateProjectiles 的 0.55 兜底）
  if(spec.splashGrid)pr.splashGrid=true;   // v1.8 同格锁：溅射判定收窄为落点同格（cabbage/corn 专用；melon/icemelon 不带此字段走旧带状判定）
  if(spec.chill)pr.chill=true;                             // v1.5 S5：icemelon 全命中减速标记
  if(spec.butter)pr.butter=true;                           // v1.6：corn 黄油弹标记（发射时掷定）
  projectiles.push(pr);
  return true;
}

function updatePlant(p,dt){
  if(p.cd>0)p.cd-=dt;
  // P2-A（code-review-todo 2026-09-20）：种植动画时间轴由 draw 侧移入 update——渲染层回归纯读。
  // 双收益：①update 吃 sdt（=dt*gameSpeed）→ 4x 倍速下动画同步加速（旧读 lastDt 不加速，感受割裂）
  // ②update 受 !paused 门控 → 暂停时动画冻结（旧 render 恒跑，暂停动画照播完）。
  // 尘土触发（P0 语义：t 跨 0.35 一次性 + 盆格 -lift + §G 上限守卫）一并挪入，副作用归 update 侧。
  if(!p.plantDone && p.plantT < 620){
    p.plantT += dt*1000;
    if(p.plantT >= 220 && !p.dirtDone){   // 220ms = 620*0.35（A→C 交界，与 draw 侧 t 阈值等价）
      p.dirtDone = true;
      if(effects.length < 500){
        const dpos=gridToPos(p.col,p.row);
        const lift=onPot(p)?POT_LIFT:0;
        for(let i=0;i<8;i++) effects.push({kind:'particle',x:dpos.x,y:dpos.y-lift+18,
          vx:R(-30,30),vy:R(-80,-40),life:R(0.3,0.5),color:'#8b6528',size:R(2,4),dead:false});
      }
    }
    if(p.plantT >= 620){ p.plantT=620; p.plantDone=true; }
  }
  const pos=gridToPos(p.col,p.row);
  if(p.type==='sunflower'){
    p.sunT-=dt;
    if(p.sunT<=0){
      p.sunT=20;
      effects.push({kind:'sun',x:pos.x+R(-10,10),y:pos.y-8,targetY:pos.y+CELL_H*0.35,fall:22,value:25,t:0,dead:false});
      SFX.sunDrop();   // B3：阳光生成提示音（§B3 · P0）
    }
  }else if(p.type==='pea'||p.type==='double'){
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=p.type==='double'?1.5:1.6;
      const dmg=p.type==='double'?18:20;
      // v1.3-M4 FIX-01：直线弹发射时快照「行 flat 基线（不含 lift）+ 偏移」，贴坡重算交给 updateProjectiles 每帧做。
      // 老关 flatY==pos.y 且 liftX≡0 ⇒ 行为零变化；投掷类抛物分支（下方）不经过此路径，不动（红线）。
      // v1.6 第4刀：投掷类统一真抛物——melon/corn/icemelon 已迁出本直线分支（v1.5 决议1 就投掷类失效），
      //   各自走 fireArcProjectile 抛物解算器（与 cabbage 同制）；本组仅剩 pea/double 直线弹。
      const flatY=GRID_Y+p.row*CELL_H+CELL_H/2;
      // v1.6 bug2：斜坡列（level.roof && col<ROOF_COLS）直射弹标记 slopeWall——撞本格斜壁即消失、不命中任何僵尸。
      // 判别口径与渲染层一致（L2013 `level.roof&&c<ROOF_COLS`）；平台列 col≥5 与老关（liftX≡0 但 col<5 不成立）⇒ sw=false ⇒ 逐字节等价今日。
      // ★ 不可用 liftX(pos.x)>0 判定「斜坡」——平台列 col5–8 的 liftX 也恒为 60（见 liftX 定义），会误伤平台列。
      // swx/lift0：发射点 x 与其坡面抬升快照；固定飞行 y 与撞壁判据共用同一参考（自洽几何，见 updateProjectiles 撞壁注释）。
      const sw=level.roof&&p.col<ROOF_COLS, swx=pos.x+30, swl=liftX(swx);
      if(p.type==='double'){
        projectiles.push({x:pos.x+30,y:sw?flatY-swl-14:pos.y-14,flatY:flatY,yOff:14,vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false,slopeWall:sw,x0:swx,xt:GRID_X+ROOF_COLS*CELL_W,lift0:swl});
        projectiles.push({x:pos.x+30,y:sw?flatY-swl-4:pos.y-4, flatY:flatY,yOff:4, vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false,slopeWall:sw,x0:swx,xt:GRID_X+ROOF_COLS*CELL_W,lift0:swl});
      }else{
        projectiles.push({x:pos.x+30,y:sw?flatY-swl-8:pos.y-8, flatY:flatY,yOff:8, vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false,slopeWall:sw,x0:swx,xt:GRID_X+ROOF_COLS*CELL_W,lift0:swl});
      }
      SFX.shoot();
    }
  }else if(p.type==='snowpea'){
    // v1.5 S4 冰冻射手：数值与豌豆全同（1.6s/单发 20），弹体带 chill 减速标记（40%·2.0s·不叠加只刷新）
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=1.6;
      const flatY=GRID_Y+p.row*CELL_H+CELL_H/2;
      // v1.6 bug2：冰冻射手同为直射，斜坡列同规则撞壁消失（判别口径见上）；平台列 sw2=false 照常命中。
      const sw2=level.roof&&p.col<ROOF_COLS, swx2=pos.x+30, swl2=liftX(swx2);
      projectiles.push({x:pos.x+30,y:sw2?flatY-swl2-8:pos.y-8,flatY:flatY,yOff:8,vx:340,dmg:20,row:p.row,type:'snowpea',splash:0,chill:true,dead:false,slopeWall:sw2,x0:swx2,xt:GRID_X+ROOF_COLS*CELL_W,lift0:swl2});
      SFX.shoot();
    }
  }else if(p.type==='cabbage'){
    // v1.3 屋顶投手：抛物线单目标（v1.6 第4刀起调用公用抛物解算器 fireArcProjectile，等价迁移，几何逐帧不变）
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=2.0;
      if(fireArcProjectile(p,pos,{dmg:20,type:'cabbage',splash:30,splashRatio:0.40,splashGrid:true}))SFX.melonThrow();   // 投手抛掷复用西瓜"呼"声（零新 SFX 键，总线 56/56 维持）；不调 SFX.shoot
    }
  }else if(p.type==='melon'){
    // v1.6 第4刀：西瓜改为真抛物投掷（复用 cabbage 抛物解算器 fireArcProjectile，零新物理常量）
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=3.2;
      if(fireArcProjectile(p,pos,{dmg:65,type:'melon',splash:55,splashRatio:0.55}))SFX.melonThrow();   // B5：西瓜抛掷"呼"声（同 cabbage 制，不调 SFX.shoot）
    }
  }else if(p.type==='corn'){
    // v1.6 第4刀：玉米投手改为真抛物（单发 15 / 间隔 2.6s / 溅射 30px·40%=6）。
    // 27% 概率黄油弹在「发射时」掷定（命中完全定身 3.0s，见 applyFreeze；溅射不施加定身，仅黄油直中）。
    // 随机源 Math.random()：harness loadGame({seed}) 已用 mulberry32 覆盖 sandbox.Math.random ⇒ 测试下完全可复现（勿换随机源）。
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=2.6;
      const butter=Math.random()<0.27;
      if(fireArcProjectile(p,pos,{dmg:15,type:'corn',splash:30,splashRatio:0.40,butter,splashGrid:true}))SFX.melonThrow();
    }
  }else if(p.type==='icemelon'){
    // v1.6 第4刀：冰冻西瓜改为真抛物（单发 65 / 间隔 3.2s / 溅射 55px·55% + 全命中减速 40%·2.0s）
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=3.2;
      if(fireArcProjectile(p,pos,{dmg:65,type:'icemelon',splash:55,splashRatio:0.55,chill:true}))SFX.melonThrow();
    }
  }else if(p.type==='mine'){
    // 地瓜：埋雷期结束后武装，僵尸踩到即引爆
    if(p.armT>0){
      p.armT-=dt;
    }else{
      for(const z of zombies){
        if(z.dead||z.row!==p.row)continue;
        if(Math.abs(z.x-pos.x)<CELL_W*0.55){explodeMine(p,pos);break}
      }
    }
  }else if(p.type==='squash'){
    // v2.2 窝瓜：即种即生效（armT=0），检测同排前方最近僵尸 → 跳起碾压 → 秒杀消失
    // v2.2.5 消缺：触发距离从「前方任意距离」改为「距离一格内」（z.x-pos.x<CELL_W 且 z.x>pos.x）；
    //   发现僵尸瞬间播"嗯"声（squashSpot），砸落瞬间播"嘣"声（squashSlam，替代原 boom）
    if(!p.jumping){
      // 找同排前方最近僵尸（x 最小即最近）
      let target=null;
      for(const z of zombies){
        if(z.dead||z.row!==p.row||z.x<=pos.x)continue;
        if(z.x-pos.x>=CELL_W)continue;   // v2.2.5：距离一格内才触发
        if(!target||z.x<target.x)target=z;
      }
      if(target){
        p.jumping=true; p.jumpT=0;
        p.jumpTarget=target;
        p.jumpFromX=pos.x; p.jumpFromY=pos.y;
        SFX.squashSpot();   // v2.2.5 发现"嗯"声
      }
    }else{
      p.jumpT+=dt;
      const prog=Math.min(1,p.jumpT/0.6);   // 0.6s 跳跃时长
      if(prog>=1){
        if(!p.jumpTarget.dead)killZombie(p.jumpTarget);
        p._dying=true;
        // 落点尘土 + 震屏 + 砸落"嘣"声
        const tx=p.jumpTarget.x, ty=GRID_Y+p.row*CELL_H+CELL_H/2-liftX(tx);
        spawnBurst(tx,ty,'#8b6a3a',12);
        triggerShake(4,250);
        SFX.squashSlam();   // v2.2.5 砸落"嘣"声（替代原 boom）
      }
      // 跳跃期间不参与碰撞（不绘制在 drawPlantInner，由 drawSquashJump 接管）
    }
  }else if(p.type==='pepper'){
    // v2.2 航椒：即种即生效（armT=0），同排踩中触发全排秒杀
    // v2.2.5 消缺：种植后进入膨胀期（arming），膨胀完成（armT≥ONE_SHOT_ARM_TIME）才可被踩中触发
    if(p.arming){
      p.armT+=dt;
      if(p.armT>=ONE_SHOT_ARM_TIME){p.arming=false;p.armT=ONE_SHOT_ARM_TIME;}
    }else{
      for(const z of zombies){
        if(z.dead||z.row!==p.row)continue;
        if(Math.abs(z.x-pos.x)<CELL_W*0.55){explodePepper(p,pos);break}
      }
    }
  }else if(p.type==='cherry'){
    // v2.2 樱桃：即种即生效（armT=0），踩中触发 3×3 格跨行秒杀
    // v2.2.5 消缺：种植后进入膨胀期（arming），膨胀完成（armT≥ONE_SHOT_ARM_TIME）才可被踩中触发
    if(p.arming){
      p.armT+=dt;
      if(p.armT>=ONE_SHOT_ARM_TIME){p.arming=false;p.armT=ONE_SHOT_ARM_TIME;}
    }else{
      for(const z of zombies){
        if(z.dead||z.row!==p.row)continue;
        if(Math.abs(z.x-pos.x)<CELL_W*0.55){explodeCherry(p,pos);break}
      }
    }
  }
}

// 地瓜爆炸：无差别秒杀同排 ±54px 内的僵尸（v2.1.1 消缺：去掉 DMG=500 耐久结算）
// 范围说明（2026-09-16 校准，行为不变）：nearCell 分支保留但不产生额外命中——
//   dy 门槛 CELL_H*0.9=93.6 < 行高 CELL_H=104，相邻行恒不满足；同排时其 dx 门槛 CELL_W*0.5=45
//   又被 sameCell 的 CELL_W*0.6=54 完全包含。故实际命中范围 = 同排 ±54px。
// 跨行溅射已列为 v1.2 可选增强（会动平衡，v1.0.0 已发布行为保持不变）。
// ★ v2.1.1 消缺：原 `z.hp-=DMG(500); if(z.hp<=0)kill` 做耐久结算，导致铁桶(560)与高难度
//   （hard mult1.35 / expert mult1.80）下 HP 超 500 的僵尸炸不死。用户拍板：武装后僵尸碰到
//   就死、不存在耐久结算 ⇒ 命中即 killZombie（无差别秒杀，任何僵尸/任何难度一碰即死）。
function explodeMine(p,pos){
  p._dying=true;
  for(const z of zombies){
    if(z.dead)continue;
    const zy=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2 B3：随僵尸地面列抬升（与命中口径一致）
    const dx=Math.abs(z.x-pos.x), dy=Math.abs(zy-pos.y);
    const sameCell = z.row===p.row && dx<CELL_W*0.6;
    const nearCell = dx<CELL_W*0.5 && dy<CELL_H*0.9;   // 保留：当前不产生额外命中（见上注），勿改判定逻辑
    if(sameCell||nearCell){
      killZombie(z);   // 无差别秒杀：不参与耐久结算（用户拍板，v2.1.1 消缺）
    }
  }
  // F-03 爆炸冲击波五层时间轴（蓝图 §4）：
  // 层 2 · 冲击波环
  if (effects.length < 500)
    effects.push({kind:'shockwave',x:pos.x,y:pos.y,life:0.38,maxLife:0.38,rStart:8,rEnd:180,dead:false});
  // 层 3 · 火球（boom 扩为 450ms 三色段）
  effects.push({kind:'boom',x:pos.x,y:pos.y,life:0.45,dead:false});
  // 层 4 · 粒子（24+20+8，初速更猛）
  if (effects.length < 500){
    spawnBurst(pos.x,pos.y,'#ffb830',24);
    spawnBurst(pos.x,pos.y,'#ff6a00',20);
    for(let i=0;i<8;i++) effects.push({kind:'particle',x:pos.x,y:pos.y,vx:R(-180,180),vy:R(-260,-60),life:R(0.6,0.9),color:'#fff8a0',size:R(2,4),dead:false});
  }
  // 层 1 · 闪光 + 层 5 · 屏幕震动（与 SFX.boom 同行，视听同步）
  triggerFlash('#fff', 0.08);
  triggerShake(6, 300);
  SFX.boom();
}

// v2.2 航椒爆炸：同排全清秒杀（无差别，不限数量/列）
function explodePepper(p,pos){
  p._dying=true;
  let count=0;
  for(const z of zombies){
    if(z.dead||z.row!==p.row)continue;
    killZombie(z); count++;
  }
  // 全排火焰波——从引爆点向两侧扩散的火焰粒子喷涌
  if(effects.length<500){
    for(let i=0;i<30;i++){
      const dir=Math.random()<0.5?-1:1;
      effects.push({kind:'particle',x:pos.x,y:pos.y,vx:dir*R(200,500),vy:R(-120,60),life:R(0.4,0.8),color:Math.random()<0.5?'#ff6a00':'#ffb830',size:R(3,6),dead:false});
    }
  }
  // 爆炸核心冲击波 + 火球
  if(effects.length<500)
    effects.push({kind:'shockwave',x:pos.x,y:pos.y,life:0.5,maxLife:0.5,rStart:10,rEnd:200,dead:false});
  if(effects.length<500)
    effects.push({kind:'boom',x:pos.x,y:pos.y,life:0.5,dead:false});
  triggerFlash('#ff6a00',0.1);
  triggerShake(7,350);
  SFX.boom();
}

// v2.2 樱桃爆炸：3×3 格跨行秒杀（本作首个跨行秒杀）
function explodeCherry(p,pos){
  p._dying=true;
  const colOf=x=>Math.floor((x-GRID_X)/CELL_W);
  const pc=colOf(pos.x), pr=p.row;
  let count=0;
  for(const z of zombies){
    if(z.dead)continue;
    const dc=Math.abs(colOf(z.x)-pc);
    const dr=Math.abs(z.row-pr);
    if(dc<=1&&dr<=1){killZombie(z);count++}
  }
  // 3×3 圆形冲击波 + 粒子
  if(effects.length<500)
    effects.push({kind:'shockwave',x:pos.x,y:pos.y,life:0.45,maxLife:0.45,rStart:8,rEnd:135,dead:false});
  if(effects.length<500){
    spawnBurst(pos.x,pos.y,'#f44',24);
    spawnBurst(pos.x,pos.y,'#ff8c00',18);
    for(let i=0;i<12;i++) effects.push({kind:'particle',x:pos.x,y:pos.y,vx:R(-220,220),vy:R(-280,-60),life:R(0.5,0.9),color:i%3?'#ff6a00':'#fff8a0',size:R(2,5),dead:false});
  }
  triggerFlash('#f44',0.12);
  // V22-FIX-01 · BUG-02：旧请求值 8 会吃掉 triggerShake 里「失败进屋特写」的一次性 8px 名额
  //   （loseShakeUsed 永久置位）⇒ 首次爆炸 8px、之后所有樱桃与航椒(请求7)恒被 clamp 到 6px，手感不一致。
  //   主理人裁决：樱桃改为 6（与航椒一致），8px 名额保留给失败进屋特写；§G「单次 ≤6px」为全局手感红线。
  triggerShake(6,400);
  SFX.boom();
}

function hasZombieAhead(p){
  const pos=gridToPos(p.col,p.row);
  for(const z of zombies){
    if(z.dead||z.row!==p.row)continue;
    if(z.x>pos.x-10)return true;
  }
  return false;
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    // v1.6 第4刀：抛物重力分支改「字段存在性」判定（字段判定，非 type 白名单）——全部投掷类（cabbage/melon/corn/icemelon）
    // 由 fireArcProjectile 产出，一律带 vy/g ⇒ 进抛物积分；直线弹（pea/double/snowpea）与老注入式弹体无 vy/g ⇒ 天然回落原路径，逐帧等价。
    // ★ 红线：绝不可改回 type 白名单——测试注入弹（REG-PLANT-04/REG-CHILL-02/REG-FREEZE-01）无 vy 字段，
    //   白名单会让其进抛物分支 ⇒ pr.y += undefined*dt ⇒ NaN ⇒ 用例全崩（V13-S1 §④ Step3 红线①）。
    if(pr.vy!==undefined){
      pr.y+=pr.vy*dt;
      pr.vy+=pr.g*dt;
    }else if(pr.slopeWall){
      // v1.6 bug2：斜坡直射弹保持固定 y 飞行（不贴坡重算）——坡面上升追上固定 y 弹体即撞壁（判定见下）。
    }else if(pr.flatY!==undefined){
      // v1.3-M4 FIX-01 贴坡：直线弹每帧按当前 x 重算 y（=行 flat 基线 − liftX(x) − 发射偏移）。
      // 屋顶 level.roof ⇒ y 随坡连续抬升，跨坡命中窗口 |zy−pr.y| ≤ yOff+8 恒 ≤32；老关 liftX≡0 ⇒ 与原直线弹逐帧等价。
      pr.y=pr.flatY-liftX(pr.x)-pr.yOff;
    }
    pr.x+=pr.vx*dt;
    // v1.6 bug2 撞壁判定（两条路径，均有实体依托，不空中凭空消失）：
    //   前置（v1.6 补丁·用户拍板）：最小飞行距离 30px——飞行不足 30px 一律不撞壁，保证每颗弹至少飞 30px。
    //   路径① 坡面相交：坡面 y(x)=flatY−liftX(x) 上升，与固定 y=flatY−lift0−yOff 的弹体相交 ⇔ liftX(pr.x)−lift0 ≥ yOff。
    //   路径② 坡顶折角立面：pr.x ≥ xt（xt=GRID_X+ROOF_COLS*CELL_W=505，斜坡与平台交界的折角立面）。
    //     斜坡顶部列 col4 的坡面被平台封顶（lift≤60），余量 < yOff 时路径①永不触发 ⇒ 由折角立面兜住（叠加 30px 下限后 col4 撞点=30px，越折角 15px，用户已接受）。
    //   撞壁弹全程 continue 跳过下方僵尸命中判定 ⇒ 不命中任何僵尸（红线：多飞 15px 亦不得命中）。
    if(pr.slopeWall){
      if(pr.x-pr.x0>=30&&(liftX(pr.x)-pr.lift0>=pr.yOff||pr.x>=pr.xt)){
        if(effects.length<500)spawnBurst(pr.x,pr.y,'#b9a98a',6);   // 撞壁小粒子：砖瓦/尘土色（复用 effects，吃 500 守卫）
        pr.dead=true;
      }
      continue;
    }
    if(pr.x>canvas.width+40||(pr.vy!==undefined&&pr.y>canvas.height+40)){pr.dead=true;continue}   // 括号兜抛物下落越界（字段判定，同 D3 红线）；直线弹无 vy ⇒ 条件恒等价于原式
    for(const z of zombies){
      if(z.dead||z.row!==pr.row)continue;
      const zy=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2 B1/α：命中基线随僵尸地面列抬升（不改则平台列偏差 68>32 全 miss）
      if(Math.abs(zy-pr.y)<32&&Math.abs(z.x-pr.x)<42){
        z.hp-=pr.dmg;
        // v1.5 S4/S5：chill 施加（直中即命中）——40% 减速·2.0s·不叠加只刷新（决议1 slow 三铁律）
        if(pr.chill)applyChill(z);
        if(pr.butter)applyFreeze(z);   // v1.7 corn 黄油直中完全定身 3.0s（v1.6 引入；裁决：溅射不施加定身，仅黄油直中）
        SFX.hit();
        if(pr.splash>0){
          // v1.5：溅射伤害系数可配置（melon 沿用 0.55；corn 0.40 / icemelon 0.55 由弹体自带）
          const ratio=pr.splashRatio!==undefined?pr.splashRatio:0.55;
          for(const z2 of zombies){
            if(z2===z||z2.dead||z2.row!==pr.row)continue;
            // v1.8 同格锁：splashGrid 弹（cabbage/corn）溅射判定收窄为「落点同一格」（colOf 同款闭式，口径 = Math.floor((x-GRID_X)/CELL_W)，锚点 = pr.x 结算当刻）；melon/icemelon 不带此字段，维持旧 55px 跨格带。
            if(pr.splashGrid){ if(Math.floor((z2.x-GRID_X)/CELL_W)!==Math.floor((pr.x-GRID_X)/CELL_W))continue; }else if(Math.abs(z2.x-pr.x)>=pr.splash)continue;
            z2.hp-=pr.dmg*ratio;
            if(pr.chill)applyChill(z2);   // icemelon：溅及也减速（决议1「全命中减速」）
          }
          spawnBurst(pr.x,zy,'orange',14);
        }else{
          spawnBurst(pr.x,zy,pr.type==='snowpea'?'#aee8ff':'#aef06a',6);
        }
        if(z.hp<=0&&!z.dead)killZombie(z);
        pr.dead=true;break;
      }
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);
}

// v1.5 S4 chill 施加单点入口：slowT 刷新续时（40%·2.0s 铁律锁定在调用侧系数与这里 2.0）。
// 不叠加语义：已减速只把 slowT 拉回满 2.0s（续时），不产生第二层减速。
// 字段：z.slowT（s）；新僵尸无字段时 undefined>0 为 false，天然兼容，无需建檔初始化。
function applyChill(z){
  if(z.dead)return;
  z.slowT=2.0;
}

// v1.7 corn 黄油定身单点入口：freezeT 置满 3.0s（v1.6 引入；完全定身，移动+啃食双停）。
// 与 chill（slowT·40% 减速·2.0s）是两套并存独立状态：互不覆盖、互不叠乘（冻结优先，见 updateZombies 状态机）。
// 字段：z.freezeT（s）；新僵尸无字段时 undefined>0 为 false，天然兼容，无需建档初始化。
function applyFreeze(z){
  if(z.dead)return;
  z.freezeT=3.0;
}

function updateZombies(dt){
  for(const z of zombies){
    if(z.dead)continue;
    // v1.5 S4 chill 状态机：slowT>0 = 减速中。dt 帧驱动递减（禁定时器铁律）；
    // 减速系数 ×0.6 同时作用于移动与啃食（2026-09-21 17:0x 用户改拍板：减速影响啃食）。
    // 叠加语义已锁：不叠加、只刷新续时（applyChill 单点写 slowT，防止多处写打架）。
    // v1.6 corn 黄油定身状态机：freezeT>0 = 完全定身（移动 z.x 不变 / 啃食 dur 不减不发声 / walk 动画不增）。
    // dt 帧驱动递减（禁定时器铁律，与 slowT 同构）；与 chill 独立并存：冻结期【不与 slowK 叠乘】（冻结优先=全停）。
    if(z.freezeT>0){
      z.freezeT-=dt;
      if(z.freezeT<0)z.freezeT=0;
    }
    const frozen=z.freezeT>0;
    if(z.slowT>0){
      z.slowT-=dt;
      if(z.slowT<0)z.slowT=0;
    }
    const slowK=z.slowT>0?0.6:1;
    if(!frozen)z.walk+=dt*8*(z.slowT>0?0.6:1);   // walk 同步减速（走路/啃食动画随慢放）；冻结期完全不增（静止）
    let target=null;
    for(let i=plants.length-1;i>=0;i--){   // 倒序：同格多实体（垫+上覆）先啃后种的（甲案自上而下语义，陆地单实体格等价）
      const p=plants[i];
      if(p.row!==z.row)continue;
      // v2.2.5 消缺：膨胀期炸弹不可被啃食（用户：膨胀过程中就算被僵尸啃食，也不可能把炸弹吃掉）
      if(p.arming)continue;
      const pos=gridToPos(p.col,p.row);
      if(z.x-pos.x<CELL_W*0.4&&z.x-pos.x>0){target=p;break}
    }
    if(frozen){
      z.eating=false;   // 定身：移动+啃食双停（不推进 dur、不播 chomp、不增 eatAnim；eating 置假=停止啃食动作）
    }else if(target){
      z.eating=true;z.eatAnim+=dt;
      target.dur-=65*dt*slowK;   // v1.5 改拍板：啃食速度同步 ×0.6（原「不减速啃食」护栏已推翻）
      SFX.chomp();
      if(target.dur<=0){
        // 用标记法，避免在 for...of 中 splice
        target._dying=true;
      }
    }else{
      z.eating=false;
      z.x-=z.spd*dt*slowK;   // v1.5 S4：移动速度 ×0.6（L1520 应用点，决议1 slow 三铁律）
    }
    // v1.2 入水反馈（2026-09-18 真机反馈补齐）：水域关僵尸越过草坪右缘入水瞬间 → 水花粒子 + 水色环 + 溅水声；跋涉中偶发小涟漪
    if(level.water&&WATER_ROWS.includes(z.row)){
      const shoreX=GRID_X+COLS*CELL_W;
      if(!z.splashed){
        if(z.x<=shoreX+8){
          z.splashed=true;
          const wy=GRID_Y+z.row*CELL_H+CELL_H/2+22;
          for(let i=0;i<14;i++)effects.push({kind:'particle',x:z.x+R(-6,6),y:wy+R(-8,8),vx:R(-60,140),vy:R(-300,-120),life:R(0.35,0.7),color:i%3?'#bfe3f7':'#ffffff',size:R(2,5),dead:false});
          effects.push({kind:'shockwave',x:z.x,y:wy,life:0.45,maxLife:0.45,rStart:6,rEnd:64,water:true,dead:false});
          SFX.splash();
        }
      }else if(!z.eating&&R(0,1)<dt*1.2){   // 跋涉涟漪：游戏时间约 0.8s 一次小水纹（按 dt 概率，帧率无关），不发声（防密集糊音）
        effects.push({kind:'shockwave',x:z.x,y:GRID_Y+z.row*CELL_H+CELL_H/2+24,life:0.5,maxLife:0.5,rStart:4,rEnd:26,water:true,dead:false});
      }
    }
    if(z.x<GRID_X-40){settleRun(false);setState('end','僵尸进屋');won=false;SFX.lose();SFX.loseClimax()}   // B6：关键一击（§B6 · P1）；v1.4 T-06 失败部分结算（已收集入账，未收集作废）
    if(z.hp<=0&&!z.dead)killZombie(z);
  }
  zombies=zombies.filter(z=>!z.dead);
  // 植物死亡统一清理（标记法）
  for(let i=plants.length-1;i>=0;i--){
    if(plants[i]._dying)plants.splice(i,1);
  }
}

// F-02 死亡零件（蓝图 §3）：死亡 = 血雾（保留）+ 零件爆散，§G 粒子上限双保险
function spawnCorpseParts(z){
  if (effects.length > 500) return;              // §G 粒子上限保护
  const y = GRID_Y + z.row*CELL_H + CELL_H/2 - liftX(z.x);   // v1.3-M4 C2：死亡零件基准 y 随坡连续抬升
  const skin = z.type==='bucket' ? '#4a5a5a' : '#5a6a4a';
  const parts = [
    {shape:'head',   off:[0,-18],  size:[18],        color:'#c5d0a0', w:R(-3,3)},
    {shape:'body-l', off:[-8,10],  size:[12,20],     color:skin,     w:R(-2,2)},
    {shape:'body-r', off:[8,10],   size:[12,20],     color:skin,     w:R(-2,2)},
    {shape:'legs',   off:[0,25],   size:[20,14],     color:'#3a2a1a', w:R(-1.5,1.5)},
    {shape:'arm',    off:[-16,12], size:[8,18],      color:'#c5d0a0', w:R(-3,3)},
  ];
  if (z.type==='cone')   parts.push({shape:'cone',   off:[0,-30], size:[28,22],  color:'#d97b2a', w:R(-2.5,2.5)});
  if (z.type==='bucket') parts.push({shape:'bucket', off:[0,-40], size:[32,12],  color:'#b0b0b0', w:R(-2,2)});
  for (const p of parts){
    if (effects.length > 500) break;             // 双保险
    effects.push({
      kind:'corpse-part',
      x:z.x + p.off[0], y: y + p.off[1],
      vx:R(-120,120), vy:R(-260,-140),
      rot:0, omega:p.w,
      life:R(0.9,1.4), maxLife:R(0.9,1.4),
      shape:p.shape, color:p.color, size:p.size,
      dead:false,
    });
  }
}

function killZombie(z){
  z.dead=true;
  score+=z.type==='bucket'?150:z.type==='cone'?100:z.type==='fast'?80:50;
  const y=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2：爆点 y 随坡连续抬升
  // v1.4 T-04：积分掉落生成（按怪→阶映射；独立数组不受 effects 500 守卫丢弃——用户 Q7 拍板）
  const tier=POINT_CONFIG.ZOMBIE_TIER_MAP[z.type];
  if(tier)spawnPointDrop(z.x,y,tier);
  if(tier)spawnDeathCoinFx(z.x,y,tier);   // 2026-09-21 验收：死亡爆币特效（金光+装饰飞币）
  spawnBurst(z.x,y,'#c94',18);
  spawnCorpseParts(z);   // F-02：死亡零件，与 SFX.death 同函数相邻（蓝图 §3 音效对齐点）
  SFX.death(z.type);     // B4：按僵尸类型分层（路障纸板 / 铁桶金属），§B4 · P1
}

// ============ v1.4 积分掉落物（T-04 · 独立数组，绕开 effects 500 守卫）============
// 设计决策（impl-plan §2 T-04）：掉落物不进 effects——从根上不触发 5 处 500 守卫
// （L1047/1138/1143/1251/1264），大波群体死亡也不吞币（R-3 / 用户 Q7）。
// 2026-09-21 验收增强：死亡爆币特效（装饰层）——真币（pointDrops）数据契约不动，
// 视觉上「爆出一堆钱币 + 光」：真币堆叠成堆（铜1/银2/金3 枚）+ 脉动光晕 + 入场弹跳；
// 装饰飞币/金光走 effects（kind:'coin'/'coin-flash'），吃 500 守卫（大波群死时优雅降级）。
let pointDrops=[];
function spawnPointDrop(x,y,tier){
  const t=POINT_CONFIG.TIER[tier];
  if(!t)return;
  pointDrops.push({
    x:x+R(-POINT_CONFIG.DROP_OFFSET,POINT_CONFIG.DROP_OFFSET),
    y:y+R(-POINT_CONFIG.DROP_OFFSET,POINT_CONFIG.DROP_OFFSET),
    tier,value:t.value,color:t.color,t:0,dead:false,   // value=1/2/3 阶位分
    bounceT:0   // 入场弹跳计时（纯视觉；+bounceT 字段不影响既有断言）
  });
}
function updatePointDrops(dt){
  for(const d of pointDrops){
    d.t+=dt;
    d.bounceT=Math.min(1,d.bounceT+dt/0.45);   // 0.45s 入场弹跳（落地小跳两下）
    if(d.t>30)d.dead=true;   // 30s 无人捡自然消散（防长局无限堆积；胜利 sweep 兜底不亏）
  }
  pointDrops=pointDrops.filter(d=>!d.dead);
}
function drawPointDrops(){
  for(const d of pointDrops){
    const bob=Math.sin(d.t*4)*2;   // 轻微上下浮动（可捡提示）
    // 入场弹跳（纯视觉）：落地后两次衰减小跳，前 0.45s
    const bt=d.bounceT;
    const hop=bt<1?Math.abs(Math.sin(bt*Math.PI*2))*(1-bt)*10:0;
    const dy=bob-hop;
    // 脉动光晕（可捡提示+「有光」验收项）：阶色柔光，呼吸周期 1.6s
    const glowR=13+Math.sin(d.t*3.9)*2.5;
    const gg=ctx.createRadialGradient(d.x,d.y+dy,2,d.x,d.y+dy,glowR);
    gg.addColorStop(0,hexA(d.color,0.5));
    gg.addColorStop(1,hexA(d.color,0));
    ctx.fillStyle=gg;
    ctx.beginPath();ctx.arc(d.x,d.y+dy,glowR,0,Math.PI*2);ctx.fill();
    // 真币成堆：value=堆内币数（铜1/银2/金3），错位叠放
    const n=d.value;
    for(let i=0;i<n;i++){
      const ox=(i-(n-1)/2)*7,oy=(i%2)*3;
      drawCoin(d.x+ox,d.y+dy+oy,7,d.color,d.t+i*0.7);
    }
  }
}
// 单枚钱币绘制（真币与装饰币共用）：椭圆币身+描边+高光+币面「¤」+可选自转翻转（squash）
function drawCoin(x,y,r,color,t,spin){
  ctx.save();
  ctx.translate(x,y);
  // 自转翻转（装饰币飞行时用）：scaleX 余弦压扁模拟绕竖轴旋转
  if(spin!==undefined)ctx.scale(Math.max(0.18,Math.abs(Math.cos(spin))),1);
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1.5;
  ctx.stroke();
  // 内圈币缘
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,r-2.2,0,Math.PI*2);ctx.stroke();
  // 高光
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.beginPath();ctx.arc(-r*0.3,-r*0.35,r*0.3,0,Math.PI*2);ctx.fill();
  // 币面符号
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.font='bold '+Math.round(r*1.3)+'px Consolas,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('¤',0,1);
  ctx.restore();
}
// #rrggbb → rgba(r,g,b,a)（特效层透明度用；阶色均为 6 位 hex 字面量）
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
// 死亡爆币特效入口（killZombie 调用）：金光 + 装饰飞币（effects 层，吃 500 守卫优雅降级）
// 验收修正（2026-09-21 16:0x）：爆炸层统一金币视觉——所有怪死都爆一堆金币+金光，不随阶位变色；
// 阶位差异只保留在地面真币的面值/颜色上（铜1/银2/金3 积分语言），爆炸装饰恒金。
function spawnDeathCoinFx(x,y,tier){
  const FX=POINT_CONFIG.DEATH_COIN_FX;
  const color=POINT_CONFIG.TIER.gold.color;   // 恒金色（tier 参数仅作入口守卫保留）
  if(effects.length<500){
    // ① 爆点金光（径向渐变炸开消散）
    effects.push({
      kind:'coin-flash',x,y,r:FX.flashR,life:FX.flashLife,maxLife:FX.flashLife,
      color,dead:false
    });
    // ② 装饰飞币：随机方向抛射 + 重力 + 地面反弹一次 + 自转，末程淡出
    for(let i=0;i<FX.decorCount;i++){
      const a=R(0,Math.PI*2),sp=R(60,170);
      effects.push({
        kind:'coin',
        x,y,
        vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-R(90,180),   // 初始向上抛
        rot:R(0,Math.PI*2),omega:R(6,14)*(Math.random()<0.5?-1:1),
        life:FX.life*R(0.8,1.15),maxLife:FX.life,
        r:R(3.5,5.5),color,dead:false,
        bounced:false,
        groundY:y+R(14,30)   // 地面反弹线（爆点下方散布，模拟散落）
      });
    }
  }
}

function spawnBurst(x,y,color,n){
  for(let i=0;i<n;i++){
    effects.push({kind:'particle',x,y,vx:R(-80,80),vy:R(-160,-40),life:R(0.3,0.6),color,size:R(2,5),dead:false});
  }
}

function checkWave(dt){
  sunFallT-=dt;
  if(sunFallT<=0){
    sunFallT=R(7,11);
    effects.push({kind:'sun',x:R(GRID_X+40,GRID_X+COLS*CELL_W-20),y:0,targetY:R(GRID_Y+30,GRID_Y+ROWS*CELL_H-30),fall:26,value:25,t:0,dead:false});
    SFX.sunDrop();   // B3：自然掉落同样给提示音（§B3 · P0）
  }
  // ---------- 波次推进规则（2026-09-16 二次修正）----------
  // 硬门槛：上一波队列放完 + 场上僵尸清空，才允许开下一波（杜绝「上一波还有一堆就发下一波」）
  // 最小喘息：清场太快时也要等够 minGap（第一波 12s 布防，最后两波 20s，其余 16s）
  // 兜底：队列放完 25s 仍未清场（极端情况，如僵尸正在啃坚果）→ 放行，防止对局僵死
  const minGap=wave===0?12:(wave>=level.totalWaves-2?20:16);
  const timeUp=gt-lastWaveT>=minGap;                 // 最小喘息时间已到
  const warnTimeUp=gt-lastWaveT>=8;                  // 预警最早触发时间（防止开波瞬间就报警）
  const fieldClear=zombies.length===0;               // 场上彻底清空 → 才允许开新波
  const fieldNearClear=zombies.length<=2;            // 剩 ≤2 只 → 可提前报大波
  const stallGuard=gt-waveDrainedT>=25;              // 兜底放行
  const canAdvance=wave<level.totalWaves&&!waveActive;

  if(warn.pending){
    // 倒计时已结束（横幅已隐藏），只等刷怪时机：场上清空（或兜底放行）→ 正式放出大波
    if(fieldClear||stallGuard){
      warn.pending=false;
      lastWaveT=gt;wave++;
      newWave(wave);
      triggerShake(5,400);triggerFlash('rgba(255,30,30,0.2)',0.15);SFX.bigWaveImpact();   // 视听同步（audio B7）
    }
  }else if(warn.active){
    // 预警横幅显示中：倒计时归零 → 横幅立即消失（不再等场上清空，避免横幅长时间残留）
    warn.t-=dt;
    SirenLoop.tick(dt);   // audio §C：预警窗口内重复警报轮次，把 2 秒填满
    if(warn.t<=0){ warn.t=0; warn.active=false; warn.pending=true; SirenLoop.stop() }
  }else if(canAdvance){
    const next=wave+1;
    const nextCfg=level.waves[wave];   // 下一波的配置（下标 = 当前 wave）
    if(nextCfg&&nextCfg.big&&warn.last!==next&&warnTimeUp&&fieldNearClear){
      // 大波：上一波快清完（剩 ≤2 只）就先播预警，不立即生成
      warn.last=next;
      warn.active=true;
      warn.t=WARN_TOTAL;
      SirenLoop.start();   // audio §C：警报 loop 与横幅同起（WARN_TOTAL=2s ≈ 4 轮）
      toast('一大波僵尸正在逼近！',WARN_TOTAL);
      triggerShake(3,500);triggerFlash('rgba(255,30,30,0.35)',0.3);   // 视听同步
    }else if(fieldClear?timeUp:stallGuard){
      lastWaveT=gt;wave++;
      newWave(wave);
    }
  }

  // 通关判定：最后一波已放完 + 队列空 + 场上无僵尸
  if(state==='play'&&wave>=level.totalWaves&&!waveActive&&spawnQueue.length===0&&zombies.length===0){
    settleRun(true);   // v1.4 T-06：结算（sweep+奖励+落盘）先于 setState（end 态不再动积分）
    setState('end','通关');won=true;
    // v1.4 T-12：通关发卡（按 CARD_AWARD 序列；重复通关不重复加）。
    // T-105：CARD_AWARD 键位 'w-l' 真键直查（anchorNo 中介退役）；占位关发 PLACEHOLDER
    //   —— 显式短路（aw!=='PLACEHOLDER'）：PLACEHOLDER 非 CARDS 真卡，不过滤会入 ownedCards 且 toast 显示字面量。
    // v2.1 T-104：值域三态——number 金币已由 settleRun 结算管道发放（endStats.coin），此处显式跳过；
    //   仅 string 真卡走发卡路径。
    const aw=SLOT_CONFIG.CARD_AWARD[levelKey];
    if(typeof aw==='string'&&aw!=='PLACEHOLDER'&&!ownedCards.includes(aw)){
      ownedCards.push(aw);
      saveMeta();   // T-12：发卡即落盘（防结算后异常丢卡）
      const nm=CARDS.find(c=>c.type===aw);
      toast('解锁新卡：'+(nm?nm.name:aw)+'（下一关生效）',3);
      triggerGiftAnim(nm);   // v2.3 消缺：通关奖励礼盒动画（结算屏展示新植物）
    }else if(typeof aw==='number'&&endStats.coin>0){
      toast('通关奖励：'+endStats.coin+' 金币',3);   // v2.1 Q-2：金币关首通 toast（settleRun 已入账）
    }
    // v1.5 决议2：难度门槛重通发卡（DIFF_AWARD：'hard:1-6'→corn 等，Q-14 锚点键）——
    // DIFF 命中对应键且未拥有 → 发卡+登记 per-difficulty 记录（防重复领取）。
    // 存量玩家无历史记录 → 重通一次即可领取（v1.5 patch note 披露项）。
    // T-103 Q-14：dk 关号段=levelKey 真键（'hard:1-6'）；表键同形态（T-103 落）。
    const dk=DIFF+':'+levelKey;
    const dw=SLOT_CONFIG.DIFF_AWARD[dk];
    if(dw&&!ownedCards.includes(dw)){
      diffClears[dk]=true;
      ownedCards.push(dw);
      saveMeta();
      const nm2=CARDS.find(c=>c.type===dw);
      toast('难度挑战成功！解锁新卡：'+(nm2?nm2.name:dw)+'（下一关生效）',3);
      if(!giftAnim.active||!giftAnim.card)triggerGiftAnim(nm2);   // v2.3 消缺：难度发卡也触发礼盒动画（若 CARD_AWARD 已有一张则用那张的动画）
    }else if(dw&&!diffClears[dk]){
      diffClears[dk]=true;   // 卡已拥有（如先经其他难度获得）：只补登记，不重复发
      saveMeta();
    }
    // T-103 Q-16：解锁推进写 v2 键——cleared 集合入集 + unlocked 推到下一键（键序语义）；
    // 旧 pvz_unlocked 不再写（保留旧值供回滚；v2 键缺失时 boot 迁移路径仍可读它）。
    // testMode 纯沙盒铁律：内存态推进照常（probe 可断言），落盘零写。
    const _li=LEVEL_INDEX.indexOf(levelKey);
    if(_li>=0){
      if(!saveCleared.includes(levelKey))saveCleared.push(levelKey);
      if(_li<LEVEL_INDEX.length-1&&keyOrd(LEVEL_INDEX[_li+1])>keyOrd(unlocked))unlocked=LEVEL_INDEX[_li+1];
      if(!testMode){
        storageSet('pvz_progress_v2',JSON.stringify({v:2,cleared:saveCleared,unlocked:unlocked,cardSeen:[]}));
        saveDiffProgress();   // v2.3 消缺：unlocked 推进后同步落 v3 三难度独立进度
      }
    }
    SFX.win();   // 结束画面不做屏幕震动（用户偏好 2026-09-16）
  }
}

// ============ 屏幕震动（F-04 · B.4，feel-impl-skeleton §1） ============
let screenShake = { t: 0, dur: 0, intensity: 0, seed: 0 };
let flashT = 0, flashColor = '#fff';   // 闪光层，F-03/F-06 共用
let loseShakeUsed = false;             // 失败进屋 8px 特例：仅一次（蓝图 §1 注·方案 A：clamp 内放行）

function triggerShake(intensity, duration_ms){
  // §G 约束：单次幅度 ≤ 6px；失败进屋特例 intensity===8 仅放行一次
  screenShake.t = duration_ms / 1000;
  screenShake.dur = duration_ms / 1000;
  if (intensity === 8 && !loseShakeUsed){ loseShakeUsed = true; }
  else { intensity = Math.min(intensity, 6); }
  screenShake.intensity = intensity;
  screenShake.seed = Math.random() * 1000;
}

function triggerFlash(color, duration_s){
  flashColor = color; flashT = duration_s;
}

function getShakeOffset(){
  if (screenShake.t <= 0) return { x: 0, y: 0 };
  const k = 1 - screenShake.t / screenShake.dur;      // 0→1
  const decay = (1 - k) * (1 - k);                     // 二次衰减
  const t = performance.now() / 1000 + screenShake.seed;
  return {
    x: Math.sin(t * 55) * screenShake.intensity * decay,
    y: Math.cos(t * 47) * screenShake.intensity * decay * 0.7,
  };
}

// ============ 渲染 ============
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const off = getShakeOffset();
  ctx.save();
  ctx.translate(off.x, off.y);
  if(state==='menu'){drawMenu();ctx.restore();return}
  if(state==='deck'){drawSelectDeck();ctx.restore();return}   // v1.4 T-10：选卡界面
  if(state==='select'){drawSelect();ctx.restore();return}   // v2.0 M2：选关页（T-204 绘制/T-205 命中）
  drawGameWorld();
  drawPointDrops();   // v1.4 T-04：积分掉落物（世界层，随震动偏移；cardBar 之下不遮挡操作区）
  if(state==='end'){drawEnd();ctx.restore();return}
  drawCardBar();
  drawStatus();
  if(warn.active)drawWaveWarn();
  if(paused)drawPause();
  ctx.restore();   // 世界层结束
  // 闪光层（restore 之后画，不随震动偏移）
  if (flashT > 0){
    ctx.save();
    ctx.globalAlpha = 0.4 * Math.max(0, flashT / 0.08);
    ctx.fillStyle = flashColor;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
  }
}

// 「一大波僵尸即将来临」预警横幅
const WARN_TOTAL=2;   // 大波预警时长（秒）· 4s→3s→2s（用户 2026-09-16 两次要求缩短）
function drawWaveWarn(){
  const remaining = Math.max(0, warn.t);
  const inFinal1 = remaining < 1.0;                    // F-06 最后 1 秒视觉增强区（蓝图 §5）
  const pulseSpeed = inFinal1 ? 22 : 11;               // 最后 1 秒脉冲频率加倍
  const pulse=0.5+0.5*Math.sin(gt*pulseSpeed);       // 0..1 闪烁
  const y=306;
  ctx.save();
  // 全屏红色氛围压暗
  ctx.fillStyle='rgba(140,0,0,'+(0.10+0.10*pulse)+')';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 横幅底色
  const g=ctx.createLinearGradient(0,y-72,0,y+72);
  g.addColorStop(0,'rgba(120,0,0,0)');
  g.addColorStop(0.5,'rgba(150,10,0,'+(0.62+0.18*pulse)+')');
  g.addColorStop(1,'rgba(120,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,y-72,canvas.width,144);
  // 上下描边
  ctx.fillStyle='rgba(255,80,50,'+(0.5+0.5*pulse)+')';
  ctx.fillRect(0,y-60,canvas.width,3);
  ctx.fillRect(0,y+57,canvas.width,3);
  // 主标题
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 48px "Microsoft YaHei"';
  ctx.lineWidth=7;ctx.strokeStyle='#2a0000';
  ctx.strokeText('一大波僵尸即将来临！',canvas.width/2,y-8);
  const r=Math.round(200+55*pulse);
  ctx.fillStyle='rgb('+r+','+Math.round(60+80*pulse)+',40)';
  ctx.fillText('一大波僵尸即将来临！',canvas.width/2,y-8);
  // 副标题
  ctx.font='bold 15px "Microsoft YaHei"';
  ctx.fillStyle='#ffd54a';
  ctx.fillText('A HUGE WAVE OF ZOMBIES IS APPROACHING',canvas.width/2,y+28);
  ctx.font='bold 13px "Microsoft YaHei"';
  ctx.fillStyle='rgba(255,220,180,0.9)';
  ctx.fillText('立即布防 · 即将进攻 '+remaining.toFixed(1)+'s',canvas.width/2,y+50);
  // 倒计时进度条（D-11：圆角化）
  const bw=320,bx=(canvas.width-bw)/2,by=y+62;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  rr(bx,by,bw,5,2);ctx.fill();
  ctx.fillStyle='#ff6a3a';
  rr(bx,by,Math.max(bw*(remaining/WARN_TOTAL),5),5,2);ctx.fill();
  // F-06 最后 1 秒：边缘渐红 vignette（蓝图 §5）
  if (inFinal1){
    ctx.save();
    const v = ctx.createRadialGradient(canvas.width/2,canvas.height/2,300,
                                       canvas.width/2,canvas.height/2,700);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,`rgba(120,0,0,${0.4+0.2*pulse})`);
    ctx.fillStyle = v;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
    // 倒计时数字放大 + 等宽（D-14 同源字体栈）
    ctx.save();
    ctx.font = 'bold 32px Consolas, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = `rgb(255,${Math.round(100+50*pulse)},${Math.round(100+50*pulse)})`;
    ctx.fillText(remaining.toFixed(1), canvas.width/2, 380);
    ctx.restore();
  }
  ctx.restore();
  // F-06 周期性轻震：用 warn.t（游戏时钟）模运算，暂停不震、与游戏节奏一致（蓝图 §5 注）
  if (!inFinal1 && (warn.t*1000)%500 < 16) triggerShake(1.5, 150);
  if (inFinal1 && (warn.t*1000)%200 < 16)  triggerShake(2, 100);
}

function drawGameWorld(){
  // T-401 昼夜色板查表：按 level.time 索引 WORLD_THEMES[world]（非 level.lawn 字面量）
  const _theme=WORLD_THEMES[level.world]||WORLD_THEMES[1];
  const _isNight=level.time==='night'||level.time==='fog';
  const lawn=_isNight?_theme.nightLawn.slice():_theme.dayLawn.slice();
  // v1.3-M3 手段①：天空带（仅 roof 关；覆盖顶部裸露 CSS 绿底，棋盘随后覆盖 y∈[80,90] 形成地平线）
  if(level.roof){
    const SKY_H=90;
    const sg=ctx.createLinearGradient(0,0,0,SKY_H);
    sg.addColorStop(0,'#cfe8f2');        // 顶：亮
    sg.addColorStop(1,'#8fc0dd');        // 地平线：主蓝
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,canvas.width,SKY_H);
    // 扁平白云（静态；2 组，避开城垛带 68–80）
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.ellipse(150,32,34,16,0,0,Math.PI*2);
    ctx.ellipse(180,28,24,13,0,0,Math.PI*2);
    ctx.ellipse(120,30,22,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.78)';
    ctx.beginPath();
    ctx.ellipse(720,22,30,14,0,0,Math.PI*2);
    ctx.ellipse(748,25,20,11,0,0,Math.PI*2);
    ctx.fill();
    // HUD 可读性护罩（R1：右上角压暗，位于 drawStatus 文字之下）
    const sc=ctx.createLinearGradient(canvas.width*0.56,0,canvas.width,0);
    sc.addColorStop(0,'rgba(0,0,0,0)');
    sc.addColorStop(1,'rgba(0,0,0,0.52)');
    ctx.fillStyle=sc;
    ctx.fillRect(canvas.width*0.40,0,canvas.width*0.60,56);
    ctx.fillStyle='rgba(0,0,0,0.18)';                  // 统一底色，避免渐变左端文字发飘
    ctx.fillRect(canvas.width*0.40,0,canvas.width*0.16,56);
  }
  // 棋盘
  // v1.3 屋顶底衬（09-20 验收反馈：斜坡接壤处透绿底显得歪）：斜坡列平行四边形斜边经抗锯齿拼合
  // 只半透明覆盖，缝隙露出画布 CSS 绿底 → 先整块铺屋面剪影（屋脊轮廓→y=600）砖瓦底色，
  // 任何格缝/坡台交界/坡底檐板交界露出的都是砖瓦棕而非绿。仅 roof 关渲染，老关零触碰。
  if(level.roof){
    ctx.fillStyle='#7a6a50';
    ctx.beginPath();
    ctx.moveTo(GRID_X,GRID_Y-liftX(GRID_X));
    ctx.lineTo(GRID_X+ROOF_COLS*CELL_W,GRID_Y-liftX(GRID_X+ROOF_COLS*CELL_W));
    ctx.lineTo(GRID_X+COLS*CELL_W,GRID_Y-liftX(GRID_X+COLS*CELL_W));
    ctx.lineTo(GRID_X+COLS*CELL_W,GRID_Y+ROWS*CELL_H);
    ctx.lineTo(GRID_X,GRID_Y+ROWS*CELL_H);
    ctx.closePath();ctx.fill();
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=GRID_X+c*CELL_W,y=GRID_Y+r*CELL_H;
    ctx.fillStyle=((c+r)%2===0)?lawn[0]:lawn[1];
    if(level.roof&&c<ROOF_COLS){                       // v1.3-M4 C2：斜坡列 → 平行四边形（左右竖边 + 沿坡斜顶/底）
      const x1=x+CELL_W,yb=y+CELL_H;
      ctx.beginPath();
      ctx.moveTo(x,y-liftX(x));    ctx.lineTo(x1,y-liftX(x1));
      ctx.lineTo(x1,yb-liftX(x1)); ctx.lineTo(x,yb-liftX(x));
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillRect(x,y-liftX(x+CELL_W/2),CELL_W,CELL_H);   // 平台列=常数抬升；老关 liftX=0 → 逐字节等价今日
    }
  }
  // v1.2 泳池水面（仅水域关渲染；GDD M3：纹理/波纹为先、色相为辅；置于滤镜前使 dusk/night 不叠加水面）
  if(level.water){
    for(const r of WATER_ROWS){
      const y=GRID_Y+r*CELL_H;
      const wGrad=ctx.createLinearGradient(GRID_X,y,GRID_X,y+CELL_H);
      wGrad.addColorStop(0,'#3f7fae');wGrad.addColorStop(0.5,'#4a90c2');wGrad.addColorStop(1,'#3f7fae');
      ctx.fillStyle=wGrad;
      ctx.fillRect(GRID_X,y,COLS*CELL_W,CELL_H);
      // 相位波纹：读全局时钟 gt，暂停自动冻结（ADR-002 语义白送）；竖波纹线区分于陆地棋盘格
      ctx.strokeStyle='rgba(255,255,255,0.16)';
      ctx.lineWidth=2;
      for(let c=0;c<COLS;c++){
        const ph=Math.sin((gt||0)*1.6+c*0.9+r*2.1);
        const wx=GRID_X+c*CELL_W+CELL_W/2+ph*10;
        const wy=y+CELL_H/2;
        ctx.beginPath();
        ctx.moveTo(wx-22,wy+ph*6);
        ctx.quadraticCurveTo(wx,wy-8-ph*4,wx+22,wy+ph*6);
        ctx.stroke();
      }
      // 水陆交界亮边，强化行级可读性
      ctx.fillStyle='rgba(255,255,255,0.20)';
      ctx.fillRect(GRID_X,y,COLS*CELL_W,2);
      ctx.fillRect(GRID_X,y+CELL_H-2,COLS*CELL_W,2);
    }
  }
  // v1.3-M4 C2 屋顶皮肤（仅 roof 关渲染；shear 口径：每个「平面 y」替换为「平面 y − liftX(x)」）。
  // 与 M3「行带整体旋转」口径不同：本口径下砖缝严格贴平行四边形格边界（C2 关键红线：不许错位）。
  if(level.roof){
    const rt=GRID_Y-ROOF_LIFT_H;                             // 屋面顶边最高处（col4/平台顶 = GRID_Y−H = 20）
    const xSlope=GRID_X+ROOF_COLS*CELL_W;                    // 斜坡／平台分界 x = 55+450 = 505
    const xEnd=GRID_X+COLS*CELL_W, yB=GRID_Y+ROWS*CELL_H;    // 屋面右缘 865 / 底锚 600
    // 「平面 y=base」经 liftX 抬升后的折线轮廓（斜坡段随坡斜、平台段水平；liftX 分段线性，3 点足够）
    const profile=(base)=>{ctx.beginPath();ctx.moveTo(GRID_X,base-liftX(GRID_X));
      ctx.lineTo(xSlope,base-liftX(xSlope));ctx.lineTo(xEnd,base-liftX(xEnd));};
    // 「平面 y∈[y0,y0+h]」经 liftX 抬升后的 6 点闭合多边形（shear 矩形；供瓦带填充）
    const shearRect=(y0,h)=>{ctx.beginPath();
      ctx.moveTo(GRID_X,y0-liftX(GRID_X));      ctx.lineTo(xSlope,y0-liftX(xSlope));      ctx.lineTo(xEnd,y0-liftX(xEnd));
      ctx.lineTo(xEnd,y0+h-liftX(xEnd));        ctx.lineTo(xSlope,y0+h-liftX(xSlope));    ctx.lineTo(GRID_X,y0+h-liftX(GRID_X));
      ctx.closePath();};
    ctx.save();
    ctx.beginPath();profile(GRID_Y);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.clip();  // 裁到屋面；上沿抬到 GRID_Y−H（否则抬升部被裁）
    // 斜向瓦片行带（shear 主信号：平面横带经 liftX 斜切 → 沿坡爬升；平台段 liftX 恒值 = 水平带）
    const BAND=26;
    for(let k=0;k*BAND<ROWS*CELL_H+BAND;k++){
      const yL=GRID_Y+k*BAND;
      ctx.fillStyle=(k%2===0)?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)';
      shearRect(yL,BAND);ctx.fill();
      if(k>0){                                          // 行带间缝（沿坡斜线）
        ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=2;
        profile(yL);ctx.stroke();
      }
      // ▲补偿①：斜坡段每行内增补一条半缝（斜缝条数 ×2，用纹理密度补 7.6° 的偏缓读数）
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(GRID_X,yL+BAND/2);ctx.lineTo(xSlope,yL+BAND/2-ROOF_LIFT_H);ctx.stroke();
    }
    // 瓦列竖缝（C2：竖直贴列边界，每行错半格；由顶边 GY−lift 到坡底 BY−lift）
    ctx.strokeStyle='rgba(0,0,0,0.20)';ctx.lineWidth=2;
    for(let r=0;r<ROWS;r++){
      const off=(r%2)*(CELL_W/2);
      const yT=GRID_Y+r*CELL_H, yB2=GRID_Y+(r+1)*CELL_H;
      for(let c=0;c<COLS;c++){
        const xT=GRID_X+c*CELL_W+off;
        if(xT>=xEnd)break;
        ctx.beginPath();ctx.moveTo(xT,yT-liftX(xT));ctx.lineTo(xT,yB2-liftX(xT));ctx.stroke();
      }
    }
    ctx.restore();
    // 檐板补厚 #463b2b（v1.3-M4 新插）：斜底边 → 固定 y=600，补出屋面厚度；底边统一停 y=600（不露 CSS 绿底）
    ctx.fillStyle='#463b2b';
    profile(yB);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,235,190,0.22)';ctx.lineWidth=2;   // 檐板顶沿高光（沿轮廓）
    profile(yB);ctx.stroke();
    // 方向光渐变（v1.3-M4 ▲补偿②：沿坡明暗加强 —— 左上更亮 / 右下更暗，强化坡向读感；不染城垛）
    ctx.save();
    ctx.beginPath();profile(GRID_Y);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.clip();
    const lg=ctx.createLinearGradient(GRID_X,rt,xEnd,yB);
    lg.addColorStop(0,'rgba(255,240,210,0.13)');        // ▲补偿②：0.10 → 0.13（左上更亮）
    lg.addColorStop(1,'rgba(40,20,0,0.24)');            // ▲补偿②：0.18 → 0.24（右下更暗）
    ctx.fillStyle=lg;
    ctx.fillRect(GRID_X,rt,COLS*CELL_W,ROWS*CELL_H+ROOF_LIFT_H);
    ctx.restore();
    // 屋脊压条（女儿墙底座，连成整条；▲补偿③：斜坡段 8→10px 加粗、平台段维持 8px）
    ctx.strokeStyle='#5a4a36';ctx.lineJoin='round';
    ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(GRID_X,GRID_Y);ctx.lineTo(xSlope,rt);ctx.stroke();   // 斜坡段 10px
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(xSlope,rt);ctx.lineTo(xEnd,rt);ctx.stroke();          // 平台段 8px
    // 屋脊城垛（v1.3-M4 C2：底边贴屋脊轮廓 y=GRID_Y−liftX(x) → 5 列斜段 + 4 列水平段）
    const MERLON_W=CELL_W*0.5, MERLON_H=12;            // 45×12，每列 1 merlon（定稿 = 源码现值，美术草图 14 仅示意）
    ctx.fillStyle='#6a5a44';                            // 深灰棕：可辨于天空、暗于砖面
    for(let c=0;c<COLS;c++){
      const x0=GRID_X+c*CELL_W, x1=x0+MERLON_W;
      const yT0=GRID_Y-liftX(x0), yT1=GRID_Y-liftX(x1);
      ctx.beginPath();
      ctx.moveTo(x0,yT0);ctx.lineTo(x1,yT1);
      ctx.lineTo(x1,yT1-MERLON_H);ctx.lineTo(x0,yT0-MERLON_H);
      ctx.closePath();ctx.fill();
    }
  }
  // T-401 昼夜滤镜 time 驱动（dusk 退役 Q-11）：night/fog 冷蓝压暗，day 不叠滤镜
  if(_isNight){
    const g=ctx.createLinearGradient(GRID_X,GRID_Y,GRID_X,GRID_Y+ROWS*CELL_H);
    g.addColorStop(0,'rgba(40,60,140,0.30)');
    g.addColorStop(0.55,'rgba(20,40,110,0.14)');
    g.addColorStop(1,'rgba(10,20,60,0.32)');
    ctx.fillStyle=g;
    ctx.fillRect(GRID_X,GRID_Y,COLS*CELL_W,ROWS*CELL_H);
  }
  // 右侧道路（v1.3-M3 C8：屋顶关改灰棕檐沟色，消除「另一块平地」误读；roof-gate 不影响老关）
  // v1.3-M4 C2：屋顶关檐沟顶随平台抬升到 GRID_Y−ROOF_LIFT_H（与平台同高，避免平台右上露天空缝）；老关恒 GRID_Y ⇒ 逐字节等价
  const gutterTop=level.roof?GRID_Y-ROOF_LIFT_H:GRID_Y;
  ctx.fillStyle=level.roof?'#5a5248':'#5a3a22';
  ctx.fillRect(GRID_X+COLS*CELL_W,gutterTop,ROAD_W,GRID_Y+ROWS*CELL_H-gutterTop);
  if(!level.roof){
    ctx.fillStyle='#6a4228';
    for(let r=0;r<ROWS;r++){
      ctx.fillRect(GRID_X+COLS*CELL_W,GRID_Y+r*CELL_H,ROAD_W,2);
      ctx.fillRect(GRID_X+COLS*CELL_W,GRID_Y+r*CELL_H+CELL_H-2,ROAD_W,2);
    }
  }
  // 房子
  ctx.fillStyle='#3a2418';ctx.fillRect(0,GRID_Y,GRID_X,ROWS*CELL_H);
  ctx.fillStyle='#5a3a22';ctx.fillRect(4,GRID_Y+8,GRID_X-8,ROWS*CELL_H-16);
  ctx.fillStyle='#8b6f4a';
  for(let r=0;r<ROWS;r++){
    ctx.fillRect(10,GRID_Y+r*CELL_H+16,GRID_X-16,26);
  }
  ctx.fillStyle='#c9a34a';
  for(let r=0;r<ROWS;r++){
    ctx.fillRect(GRID_X-16,GRID_Y+r*CELL_H+22,3,14);
  }
  // 【檐口斜边剪影（M3 手段④b 左右楔形）已移除（09-20 用户二轮验收反馈）】：
  // 楔形 #7a6a4c 在「房子|屋面」「屋面|道路」接缝处形成第三方色窄条，读作「接壤处未填充」+ 楔形收窄感=歪；
  // 坡度读感已由 C2 斜瓦带/逐列抬升承载，楔形冗余。删除后 house|roof / roof|road 均为同高直角 crisp 接缝。
  // 种植/铲除预览
  if(selected&&lastMouseInGrid&&state==='play'&&!paused){
    const gx=lastMouseGrid.x,gy=lastMouseGrid.y;
    const x=GRID_X+gx*CELL_W,y=GRID_Y+gy*CELL_H;
    const lc=liftX(x+CELL_W/2);                        // 格心抬升（老关恒 0 ⇒ 逐字节等价今日）
    const strokeCell=(lw)=>{                           // v1.3-M4 C2：斜坡格 → 平行四边形预览（与落格形状一致）；平台/老关 → 矩形
      ctx.lineWidth=lw;
      if(level.roof&&gx<ROOF_COLS){
        const x1=x+CELL_W,yb=y+CELL_H;
        ctx.beginPath();
        ctx.moveTo(x+2,y+2-liftX(x));   ctx.lineTo(x1-2,y+2-liftX(x1));
        ctx.lineTo(x1-2,yb-2-liftX(x1));ctx.lineTo(x+2,yb-2-liftX(x));
        ctx.closePath();ctx.stroke();
      }else{
        ctx.strokeRect(x+2,y+2-lc,CELL_W-4,CELL_H-4);
      }
    };
    if(selected.shovel){
      const has=plants.some(p=>p.col===gx&&p.row===gy);
      ctx.strokeStyle=has?'rgba(255,90,90,0.95)':'rgba(255,255,255,0.35)';
      strokeCell(3);
      if(has)drawShovelIcon(x+CELL_W/2,y+CELL_H/2-lc,1.1);
    }else{
      ctx.strokeStyle='rgba(255,255,255,0.8)';
      strokeCell(2);
    }
  }
  // 植物
  for(const p of plants)drawPlant(p);
  // 僵尸
  for(const z of zombies)drawZombie(z);
  // 子弹
  for(const pr of projectiles)drawProjectile(pr);
  // 粒子 / 阳光 / 爆炸
  for(const e of effects){
    if(e.kind==='sun')drawSun(e);
    else if(e.kind==='particle')drawParticle(e);
    else if(e.kind==='corpse-part')drawCorpsePart(e);
    else if(e.kind==='shockwave')drawShockwave(e);
    else if(e.kind==='boom')drawBoom(e);
    else if(e.kind==='coin')drawCoinFx(e);
    else if(e.kind==='coin-flash')drawCoinFlash(e);
  }
  // T-402 浓雾遮罩（仅 time:'fog'；Q-6a 泳池 2-6~2-10）：白色浓雾带盖住棋盘中段，
  // 仅见最左列前半列（col0 左半）+ 最右列半列（col8 右半），雾区两端 30px 柔和过渡。
  // 纯视觉（Q-6），无命中/机制含义。绘制时序：位于实体之后 ⇒ 雾下植物/僵尸/弹体被遮蔽；
  // 卡栏/状态 HUD 在 draw() 中后绘制，不受遮。bench 零影响：分支仅 fog 关触发，锚点关零新增 draw call。
  if(level.time==='fog'){
    const FX0=GRID_X+CELL_W/2, FX1=GRID_X+COLS*CELL_W-CELL_W/2;   // 雾带实体边界 x=100/820（复用网格常量，禁第二处硬编码）
    const FADE=30;                                                 // 端部过渡带宽（<半列 45 ⇒ 可见半列全清无染）
    const bandW=FX1-FX0;
    const fg=ctx.createLinearGradient(FX0,0,FX1,0);
    fg.addColorStop(0,'rgba(235,240,245,0)');
    fg.addColorStop(FADE/bandW,'rgba(235,240,245,0.80)');
    fg.addColorStop(1-FADE/bandW,'rgba(235,240,245,0.80)');
    fg.addColorStop(1,'rgba(235,240,245,0)');
    ctx.fillStyle=fg;
    ctx.fillRect(GRID_X,0,COLS*CELL_W,canvas.height);
    // 雾团缓漂（读全局时钟 gt，暂停自动冻结 ADR-002）：低幅白椭圆叠主带，clip 束缚在带内不污染可见半列
    ctx.save();
    ctx.beginPath();ctx.rect(FX0,0,bandW,canvas.height);ctx.clip();
    ctx.fillStyle='rgba(245,248,252,0.12)';
    for(let i=0;i<4;i++){
      const t=((gt||0)*16+i*bandW/4)%bandW;
      const ex=FX1-t, ey=GRID_Y+CELL_H/2+CELL_H*((i*2)%ROWS);
      ctx.beginPath();ctx.ellipse(ex,ey,110,30,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  // T-403 主题装饰层（L4，plan §5）：世界 3 墓碑+雾气 / 世界 4 房屋立面+庭院——集中一个绘制块，
  // 纯视觉零机制（Q-7：墓碑机制字段已预留 level.graves，实装随世界 3 关卡开放）。
  // 绘制时序：植物之前 ⇒ 植物覆盖墓碑（同格叠加时植物在上，原版语义）；雾遮罩之后无碍（雾关仅世界 2）。
  function drawWorldDecor(){
    const th=WORLD_THEMES[level.world]||WORLD_THEMES[1];
    if(th.key==='grave'&&level.graves){
      // 墓碑：十字架/圆顶碑两型交替，色取夜板加深（与棋盘可辨）；点位=level.graves 确定性表
      for(let i=0;i<level.graves.length;i++){
        const [gc,gr]=level.graves[i];
        const x=GRID_X+gc*CELL_W+CELL_W/2, yb=GRID_Y+gr*CELL_H+CELL_H-14;
        ctx.fillStyle='#4a4a42';                                  // 碑基座
        ctx.fillRect(x-16,yb-8,32,8);
        ctx.fillStyle='#5c5c52';                                  // 碑身
        if(i%2===0){                                              // 十字架型
          ctx.fillRect(x-4,yb-34,8,28);
          ctx.fillRect(x-13,yb-27,26,7);
        }else{                                                    // 圆顶碑型
          ctx.beginPath();
          ctx.moveTo(x-12,yb-8);ctx.lineTo(x-12,yb-26);
          ctx.arc(x,yb-26,12,Math.PI,0);
          ctx.lineTo(x+12,yb-8);ctx.closePath();ctx.fill();
        }
        ctx.fillStyle='rgba(0,0,0,0.18)';                         // 草地阴影
        ctx.beginPath();ctx.ellipse(x,yb-4,20,5,0,0,Math.PI*2);ctx.fill();
      }
      // 雾气（贴地薄雾条，读 gt 缓漂；世界 3 氛围装饰，与 T-402 gameplay 浓雾遮罩无关）
      ctx.save();
      ctx.beginPath();ctx.rect(GRID_X,GRID_Y,COLS*CELL_W,ROWS*CELL_H);ctx.clip();
      ctx.fillStyle='rgba(200,210,205,0.10)';
      for(let i=0;i<3;i++){
        const gy=GRID_Y+CELL_H*(1.2+i*1.4), drift=((gt||0)*10+i*300)%(COLS*CELL_W+300)-150;
        ctx.beginPath();ctx.ellipse(GRID_X+drift,gy,130,14,0,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }else if(th.key==='house'){
      // 房屋换皮装饰：左侧房子立面砖纹强化 + 门/窗 + 右侧庭院栅栏（复用屋顶关恒在，装饰叠于其上）
      ctx.fillStyle='#2e1d12';                                    // 门（世界 4 房子立面中段）
      ctx.fillRect(14,GRID_Y+2*CELL_H+18,26,CELL_H-26);
      ctx.fillStyle='#c9a34a';                                    // 门把手
      ctx.fillRect(32,GRID_Y+2*CELL_H+CELL_H/2,4,4);
      ctx.fillStyle='#ffd97a';                                    // 暖窗光（两层）
      ctx.fillRect(16,GRID_Y+18,24,20);
      ctx.fillRect(16,GRID_Y+4*CELL_H+18,24,20);
      ctx.strokeStyle='#3a2418';ctx.lineWidth=2;                  // 窗棂
      ctx.beginPath();
      ctx.moveTo(28,GRID_Y+18);ctx.lineTo(28,GRID_Y+38);
      ctx.moveTo(28,GRID_Y+4*CELL_H+18);ctx.lineTo(28,GRID_Y+4*CELL_H+38);
      ctx.stroke();
      ctx.fillStyle='#6b5138';                                    // 庭院栅栏（右侧道路上缘，世界 4 专属）
      const fx=GRID_X+COLS*CELL_W+22;
      for(let r=0;r<ROWS;r++){
        const fy=GRID_Y+r*CELL_H+26;
        ctx.fillRect(fx,fy,ROAD_W-30,5);
        ctx.fillRect(fx+6,fy-8,7,22);ctx.fillRect(fx+34,fy-8,7,22);ctx.fillRect(fx+62,fy-8,7,22);
      }
    }
  }
  drawWorldDecor();
}

// F-02 死亡零件绘制（蓝图 §3）：head 带眼睛，其余为矩形；末 300ms 淡出
function drawCorpsePart(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot);
  ctx.globalAlpha = Math.max(0, Math.min(1, e.life / 0.3));   // 末 300ms 淡出
  ctx.fillStyle = e.color;
  if (e.shape === 'head'){
    ctx.beginPath(); ctx.arc(0,0,e.size[0],0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5,-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,2,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillRect(-e.size[0]/2, -e.size[1]/2, e.size[0], e.size[1]);
  }
  ctx.restore();
}

// 铲子图标（供铲子槽 / 光标预览复用）
function drawShovelIcon(x,y,s){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  // 木柄
  ctx.strokeStyle='#8b5a2a';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,4);ctx.stroke();
  // 握把
  ctx.strokeStyle='#6a4228';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-5,-17);ctx.lineTo(5,-17);ctx.stroke();
  // 铲头
  ctx.fillStyle='#b8bec4';
  ctx.beginPath();
  ctx.moveTo(-8,4);ctx.lineTo(8,4);ctx.lineTo(7,13);
  ctx.quadraticCurveTo(0,19,-7,13);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#8f959b';
  ctx.fillRect(-8,4,16,3);
  ctx.restore();
}

// v1.3 修复（用户反馈 2026-09-20「植物视觉上遮住了花盆」）：盆上植物整体上移 POT_LIFT px、
// 花盆自身下沉 POT_SINK px 落到格底——错位后盆口沿/盆身/盆底全部可见，植物底缘正好立在盆口，还原"种在盆里"的层次。
// 几何：豌豆底 y+30 == 盆口中心 y-10+16-22（lift-sink 后对齐）；非盆路径 lift=0 零感知。
// 纯渲染层偏移：不碰 gridToPos/种植/碰撞/子弹等任何逻辑坐标（onPot 每帧全量扫 plants，量级 ≤45 无需缓存）。
const POT_LIFT=16, POT_SINK=22;
const onPot=p=>p.type!=='planter'&&plants.some(q=>q.type==='planter'&&q.col===p.col&&q.row===p.row);

function drawPlant(p, dtRef){
  // F-01 种植动画（蓝图 §2）：620ms 三段时间轴（A 飞向格子 → C 缩放过冲 → E 落定微抖）
  // P2-A：plantT 推进已移入 updatePlant（吃 sdt，倍速加速/暂停冻结）；本函数纯读插值，不再变异状态。
  // dtRef 参数保留兼容 harness 帧步进（REG-PLANT-05 写法），纯读路径不使用。
  const lift=onPot(p)?POT_LIFT:0;   // 盆上植物：落点从格心改到盆口
  if (p.plantT === undefined){ p.plantT=620; p.plantDone=true; }   // 旧对象兜底：直接视为已落地
  if (!p.plantDone && p.plantT < 620){
    const t = Math.min(1, p.plantT / 620);
    const pos = gridToPos(p.col, p.row);
    pos.y -= lift;
    let x=pos.x, y=pos.y, s=1;
    if (t < 0.35){                              // A · 飞向格子
      const k = Easing.easeInOut(t / 0.35);
      x = p.plantFrom.x + (pos.x - p.plantFrom.x)*k;
      y = p.plantFrom.y + (pos.y - p.plantFrom.y)*k - Math.sin(k*Math.PI)*80;
      s = 0.6 + 0.4*k;
    } else if (t < 0.78){                        // C · 缩放过冲
      s = 1.0 + Math.sin((t-0.35)/0.43*Math.PI*2)*0.15*(1-(t-0.35)/0.43);
      y = pos.y - Math.max(0,(0.55-t)/0.2*8);
    } else if (t < 1){                            // E · 落定微抖
      s = 1.0;
      y = pos.y + Math.sin(t*20)*2*(1-t);
    }
    ctx.save();
    ctx.translate(x,y); ctx.scale(s,s); ctx.translate(-x,-y);
    drawPlantInner(p, x, y);
    ctx.restore();
    return;
  }
  const p2=gridToPos(p.col,p.row);
  // v2.2 窝瓜跳跃插值：从所在格抛物线跳到目标僵尸位置
  if(p.jumping){
    const t=Math.min(1,p.jumpT/0.6);
    const tx=p.jumpTarget?(p.jumpTarget.x):(p2.x+CELL_W*2);
    const ty=p.jumpTarget?(GRID_Y+p.row*CELL_H+CELL_H/2-liftX(p.jumpTarget.x)):p2.y;
    const k=Easing.easeOut(t);
    const jx=p.jumpFromX+(tx-p.jumpFromX)*k;
    const jy=p.jumpFromY+(ty-p.jumpFromY)*k-Math.sin(k*Math.PI)*120;
    // 压缩→起飞→砸落三阶段缩放
    let js=1;
    if(t<0.25)js=0.7+0.3*(t/0.25);
    else if(t<0.75)js=1.0;
    else js=1.0-0.2*((t-0.75)/0.25);
    ctx.save();
    ctx.translate(jx,jy);ctx.scale(js,js);ctx.translate(-jx,-jy);
    drawPlantInner(p,jx,jy);
    ctx.restore();
    return;
  }
  drawPlantInner(p, p2.x, p2.y-lift);
}

// 原 drawPlant 绘制主体（阴影/各类型/血条），签名改为 (p, x, y) 以支持种植动画缩放平移
function drawPlantInner(p, x, y){
  // 阴影：盆上植物阴影不随植物上移（否则浮在盆身上），而是画到盆底地面 y=POT_LIFT-POT_SINK 处，
  // 与花盆盆底对齐，形成"植物立在盆上、影子落在地面"的正确层次；行 5（最底行）盆底阴影与格底自然重叠，无出格问题。
  if(p.type!=='lilypad'&&p.type!=='planter'){
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(x,y+38+(onPot(p)?POT_LIFT-POT_SINK:0),26,7,0,0,Math.PI*2);ctx.fill();
  }

  if(p.type==='lilypad'){
    // v1.2 睡莲：扁平浮叶，水生植物无落地投影（上方已跳过阴影）
    ctx.fillStyle='#3f9a4e';
    ctx.beginPath();ctx.arc(x,y+8,26,0,Math.PI*2);ctx.fill();
    // 叶面高光（浅色月牙）
    ctx.fillStyle='#5cb86a';
    ctx.beginPath();ctx.ellipse(x-7,y+1,16,11,-0.5,0,Math.PI*2);ctx.fill();
    // 叶缘缺口（透出水面色）
    ctx.fillStyle='#4a90c2';
    ctx.beginPath();
    ctx.moveTo(x,y+8);
    ctx.arc(x,y+8,26,-Math.PI/2,-Math.PI/2+0.55);
    ctx.closePath();ctx.fill();
    // 叶脉
    ctx.strokeStyle='rgba(20,80,40,0.5)';ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5+0.4;
      ctx.beginPath();ctx.moveTo(x,y+8);
      ctx.lineTo(x+Math.cos(a)*20,y+8+Math.sin(a)*20);ctx.stroke();
    }
  }else if(p.type==='planter'){
    // v1.3 屋顶花盆：陶土圆台（占位载体，无攻击；盆口留空暗示"上面还能种"）
    // v1.3 修复：整体下移 POT_SINK px 落地，让出盆口上方给盆上植物（配合 drawPlant 的 POT_LIFT）
    y+=POT_SINK;
    ctx.fillStyle='#a05a34';                       // 盆身（梯形）
    ctx.beginPath();
    ctx.moveTo(x-22,y-10);ctx.lineTo(x+22,y-10);
    ctx.lineTo(x+16,y+22);ctx.lineTo(x-16,y+22);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#7a4022';                       // 盆底阴影
    ctx.fillRect(x-16,y+16,32,6);
    ctx.fillStyle='#c97a4a';                       // 盆口沿（椭圆）
    ctx.beginPath();ctx.ellipse(x,y-10,24,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a5a34';                       // 盆口内沿（土色凹陷）
    ctx.beginPath();ctx.ellipse(x,y-10,18,5.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a4526';                       // 盆土
    ctx.beginPath();ctx.ellipse(x,y-10,14,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.22)';        // 左侧高光
    ctx.beginPath();ctx.moveTo(x-18,y-6);ctx.lineTo(x-12,y-6);ctx.lineTo(x-8,y+16);ctx.lineTo(x-14,y+16);
    ctx.closePath();ctx.fill();
  }else if(p.type==='sunflower'){
    // v1.3 根茎：先画茎（位于花盘下层），花盘随后盖住茎顶，脸不被遮挡
    ctx.fillStyle='#3f7a26';                       // 茎身（深绿，与草地两色拉开对比）
    ctx.beginPath();
    ctx.moveTo(x-3,y+34);
    ctx.quadraticCurveTo(x-4.5,y+20,x-3,y+6);
    ctx.lineTo(x+3,y+6);
    ctx.quadraticCurveTo(x+4.5,y+20,x+3,y+34);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5d9a36';                       // 受光侧高光（窄条，扁平风格）
    ctx.beginPath();ctx.ellipse(x-1.5,y+21,1.5,13,0,0,Math.PI*2);ctx.fill();
    // 茎基泥痕：让茎"扎进土里"而不是浮在格上
    ctx.fillStyle='#6a4526';
    ctx.beginPath();ctx.ellipse(x,y+34,6,2.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffce3a';
    for(let i=0;i<10;i++){
      const a=i*Math.PI*2/10;
      ctx.beginPath();ctx.ellipse(x+Math.cos(a)*16,y+Math.sin(a)*16,10,5,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b5a2a';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-4,y-2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-4,y-2,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-2,1.5,0,Math.PI*2);ctx.fill();
  }else if(p.type==='nut'){
    const k=p.dur/p.maxDur;
    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(x,y+2,28,34,0,0,Math.PI*2);ctx.fill();
    if(k<0.7){ctx.fillStyle='#5a3a1a';ctx.fillRect(x-6,y-20,3,10);ctx.fillRect(x+3,y-8,3,8)}
    if(k<0.4){ctx.fillStyle='#3a1a0a';ctx.fillRect(x-10,y+6,4,8);ctx.fillRect(x+8,y-2,3,10)}
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-6,y-4,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+6,y-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-6,y-4,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+6,y-4,1.5,0,Math.PI*2);ctx.fill();
  }else if(p.type==='pea'||p.type==='double'){
    ctx.fillStyle='#4a8a2a';
    ctx.beginPath();ctx.ellipse(x,y+2,24,28,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6aa43a';
    ctx.beginPath();ctx.ellipse(x+10,y-8,18,18,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a7a1a';
    ctx.beginPath();ctx.ellipse(x-16,y+20,10,5,0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x-14,y+30,10,5,-0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x+8,y-10,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x+10,y-10,2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x+14,y-4,5,0.2,Math.PI-0.2);ctx.stroke();
    if(p.type==='double'){
      ctx.fillStyle='#6aa43a';
      ctx.beginPath();ctx.ellipse(x-6,y+4,14,14,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-8,y+2,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(x-8,y+2,1.5,0,Math.PI*2);ctx.fill();
    }
  }else if(p.type==='snowpea'){
    // v2.2.5 消缺：冰冻射手绘制分支（此前缺失，只画了阴影——用户反馈"看不到冰冻射手"）。
    // 与 pea 同构、冰蓝渐变（与冰豆弹 drawProjectile snowpea 视觉一致）：茎 + 冰蓝头 + 冰晶 + 冷光眼睛
    ctx.fillStyle='#3a7a8a';                       // 茎身（冷蓝绿，与草地两色拉开）
    ctx.beginPath();
    ctx.moveTo(x-3,y+34);
    ctx.quadraticCurveTo(x-4.5,y+20,x-3,y+6);
    ctx.lineTo(x+3,y+6);
    ctx.quadraticCurveTo(x+4.5,y+20,x+3,y+34);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5a9ab0';                       // 茎高光（窄条）

    ctx.fillStyle='#6a4526';                       // 茎基泥痕（扎进土里）
    ctx.beginPath();ctx.ellipse(x,y+34,6,2.5,0,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.ellipse(x+10,y-8,18,18,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#fff';                          // 眼睛（冷白 + 深蓝瞳）
    ctx.beginPath();ctx.arc(x+8,y-10,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a4a6a';
    ctx.beginPath();ctx.arc(x+10,y-10,2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a4a6a';ctx.lineWidth=2;     // 嘴（冷色）
    ctx.beginPath();ctx.arc(x+14,y-4,5,0.2,Math.PI-0.2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';        // 冷光晕（减速提示，同冰豆弹拖尾）
    ctx.beginPath();ctx.arc(x,y+2,30,0,Math.PI*2);ctx.fill();
  }else if(p.type==='melon'){
    // V13-07b 整体下移 12px 坐地（用户：西瓜没有落地；球底 y+38 直接压在阴影上）
    ctx.fillStyle='#3a8a1a';
    ctx.beginPath();ctx.arc(x,y+12,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a6a0a';
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath();ctx.ellipse(x+Math.cos(a)*14,y+12+Math.sin(a)*14,8,3,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.ellipse(x-8,y+4,6,4,0,0,Math.PI*2);ctx.fill();
  }else if(p.type==='corn'){
    // v1.5 S3 玉米投手：玉米棒 + 后置发射木碗（与 cabbage 投手同型剪影，粒粒分明黄色）
    ctx.fillStyle='#5a8a24';                       // 茎叶（左右两片）
    ctx.beginPath();ctx.ellipse(x-13,y+24,12,6,0.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+13,y+24,12,6,-0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8c53a';                       // 玉米棒主体
    ctx.beginPath();ctx.ellipse(x,y+8,15,21,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c79a22';                       // 玉米粒（错位点阵）
    for(let r=0;r<4;r++)for(let c2=0;c2<3;c2++){
      ctx.beginPath();ctx.arc(x-8+c2*8,y-6+r*8,2.2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#6aa83a';                       // 顶部垂叶
    ctx.beginPath();ctx.ellipse(x,y-16,5,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';         // 高光
    ctx.beginPath();ctx.ellipse(x-6,y-2,4,8,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3a1a';                       // 发射木碗（后倾，同 cabbage 型制）
    ctx.beginPath();ctx.moveTo(x-10,y+18);ctx.quadraticCurveTo(x-22,y+22,x-20,y+30);
    ctx.quadraticCurveTo(x-12,y+34,x-6,y+30);ctx.closePath();ctx.fill();
  }else if(p.type==='icemelon'){
    // v1.5 S5 冰冻西瓜：西瓜球体 + 冰晶覆盖 + 冷色高光（与 melon 同构、色系反转）
    ctx.fillStyle='#3a8a8a';
    ctx.beginPath();ctx.arc(x,y+12,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a6a8a';
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath();ctx.ellipse(x+Math.cos(a)*14,y+12+Math.sin(a)*14,8,3,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(210,245,255,0.85)';        // 冰晶（顶部三粒）
    ctx.beginPath();ctx.arc(x-8,y-2,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+2,y-8,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+9,y-1,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.beginPath();ctx.ellipse(x-8,y+2,7,4,0,0,Math.PI*2);ctx.fill();
  }else if(p.type==='cabbage'){
    // v1.3 投手：卷心菜球体 + 后倾发射碗（抛物投手剪影；GDD §3.2）；V13-07c 再下移 6px（用户：还是太高）
    ctx.fillStyle='#7aa84a';                       // 外叶（底部展开）
    ctx.beginPath();ctx.ellipse(x-14,y+26,12,7,0.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+14,y+26,12,7,-0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8bc45e';                       // 卷心菜球
    ctx.beginPath();ctx.arc(x,y+10,20,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5a8a34';ctx.lineWidth=2;     // 球体叶脉弧线
    ctx.beginPath();ctx.arc(x,y+10,13,0.6,2.5);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y+10,7,3.5,5.6);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';        // 高光
    ctx.beginPath();ctx.ellipse(x-7,y+3,6,4,0.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3a1a';                       // 发射木碗（前倾）
    ctx.beginPath();ctx.moveTo(x+10,y+18);ctx.quadraticCurveTo(x+22,y+22,x+20,y+30);
    ctx.quadraticCurveTo(x+12,y+34,x+6,y+30);ctx.closePath();ctx.fill();
  }else if(p.type==='mine'){
    const armed=p.armT<=0;
    // V13-07c 再下移 4px（用户：地瓜也再往下点）；土堆底 y+39 与阴影中心 y+38 对齐
    // 土堆
    ctx.fillStyle='#6a4a24';
    ctx.beginPath();ctx.ellipse(x,y+22,30,17,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(x,y+17,25,13,0,0,Math.PI*2);ctx.fill();
    if(armed){
      // 破土露头的地瓜
      ctx.fillStyle='#a0446a';
      ctx.beginPath();ctx.ellipse(x,y+4,19,15,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c25a86';
      ctx.beginPath();ctx.ellipse(x-5,y+1,10,6.5,0,0,Math.PI*2);ctx.fill();
      // 眼睛
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-5.5,y+3,3.6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+5.5,y+3,3.6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(x-5.5,y+3,1.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+5.5,y+3,1.8,0,Math.PI*2);ctx.fill();
      // 待爆提示
      ctx.fillStyle='rgba(255,90,0,0.35)';
      ctx.beginPath();ctx.arc(x,y+6,26,0,Math.PI*2);ctx.fill();
    }else{
      // 埋土中：几个土块 + 进度环
      ctx.fillStyle='#5a3a1a';
      ctx.beginPath();ctx.arc(x-9,y+15,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+7,y+19,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+2,y+13,2,0,Math.PI*2);ctx.fill();
      const prog=1-p.armT/level.armTime;
      ctx.strokeStyle='rgba(255,255,255,0.75)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(x,y+8,20,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
      ctx.stroke();
    }
  }else if(p.type==='squash'){   // v2.2 一次性秒杀三件套：armT=0，始终处于武装态
    // 窝瓜：深绿椭圆体 + 黄色底面 + 怒目
    ctx.fillStyle='#5a9a2a';
    ctx.beginPath();ctx.ellipse(x,y+4,22,30,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8c53a';                       // 黄色底面
    ctx.beginPath();ctx.ellipse(x,y+28,20,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a6a1a';                       // 暗纹纵线
    ctx.beginPath();ctx.moveTo(x-8,y-10);ctx.quadraticCurveTo(x,y+8,x+8,y-10);ctx.stroke();
    // 怒目
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(x-8,y-10,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+8,y-10,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-8,y-12,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+8,y-12,2.5,0,Math.PI*2);ctx.fill();
    // 待机微抖：若前方无僵尸则微微弹跳
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.beginPath();ctx.ellipse(x-6,y-22,4,3,0,0,Math.PI*2);ctx.fill();
  }else if(p.type==='pepper'){
    // 航椒：红色辣椒 + 绿色茎蒂 + 火焰高光
    // v2.2.5 消缺：膨胀期动画——scale 0.7→1.3 缓慢增大 + 抖动（随膨胀减弱），膨胀完成即武装
    const _armK=p.arming?Math.min(1,p.armT/ONE_SHOT_ARM_TIME):1;
    if(p.arming){
      const _s=0.7+0.6*_armK, _wob=Math.sin(p.armT*18)*2*(1-_armK);
      ctx.save();ctx.translate(x,y+2+_wob);ctx.scale(_s,_s);ctx.translate(-x,-(y+2+_wob));
    }
    ctx.fillStyle='#cc3322';                       // 辣椒主体
    ctx.beginPath();ctx.ellipse(x,y+2,15,26,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ee5533';                       // 亮面
    ctx.beginPath();ctx.ellipse(x-4,y-2,9,18,0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#228822';                       // 绿色茎蒂
    ctx.beginPath();ctx.ellipse(x,y-24,5,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,180,60,0.6)';          // 火焰高光环
    ctx.beginPath();ctx.arc(x,y+4,22,0,Math.PI*2);ctx.fill();
    // 小火焰纹理
    ctx.fillStyle='#ff8c30';
    ctx.beginPath();ctx.ellipse(x+8,y+12,5,8,0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x-8,y+10,4,7,-0.3,0,Math.PI*2);ctx.fill();
    if(p.arming)ctx.restore();
  }else if(p.type==='cherry'){
    // 樱桃：深红双球 + 绿色茎连接
    // v2.2.5 消缺：膨胀期动画——scale 0.7→1.3 缓慢增大 + 抖动（随膨胀减弱），膨胀完成即武装
    const _armK2=p.arming?Math.min(1,p.armT/ONE_SHOT_ARM_TIME):1;
    if(p.arming){
      const _s=0.7+0.6*_armK2, _wob2=Math.sin(p.armT*18)*2*(1-_armK2);
      ctx.save();ctx.translate(x,y+2+_wob2);ctx.scale(_s,_s);ctx.translate(-x,-(y+2+_wob2));
    }
    ctx.fillStyle='#cc2222';                       // 左球
    ctx.beginPath();ctx.arc(x-10,y+6,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#dd3333';                       // 右球
    ctx.beginPath();ctx.arc(x+10,y+6,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ee5544';                       // 高光
    ctx.beginPath();ctx.ellipse(x-13,y+0,6,8,0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+7,y+0,6,8,-0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#228822';                       // 茎
    ctx.beginPath();ctx.moveTo(x-10,y-10);ctx.quadraticCurveTo(x,y-26,x+10,y-10);
    ctx.lineWidth=3;ctx.strokeStyle='#228822';ctx.stroke();
    ctx.lineWidth=1;
    // 微晃动画
    ctx.fillStyle='rgba(255,150,100,0.4)';
    ctx.beginPath();ctx.arc(x,y-2,24,0,Math.PI*2);ctx.fill();
    if(p.arming)ctx.restore();
  }
  // 血条（坚果常显；一次性植物 mine/squash/pepper/cherry 不显示）
  if(p.type==='nut'){
    const k=p.dur/p.maxDur;
    ctx.fillStyle='#000';ctx.fillRect(x-24,y-42,48,4);
    ctx.fillStyle=k>0.5?'#3b3':'#f63';
    ctx.fillRect(x-24,y-42,48*k,4);
  }else if(p.type!=='mine'&&p.type!=='squash'&&p.type!=='pepper'&&p.type!=='cherry'){
    const k=p.dur/p.maxDur;
    if(k<0.95){
      ctx.fillStyle='#000';ctx.fillRect(x-24,y-42,48,4);
      ctx.fillStyle=k>0.5?'#3b3':'#f63';
      ctx.fillRect(x-24,y-42,48*k,4);
    }
  }
}

function drawZombie(z){
  const x=z.x,y=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2：沿坡连续（消灭 12px 电梯感）
  // v1.2.1 O3 腿部遮挡（方案甲 clip）：水行僵尸以腰线 y=16 为界裁切，水下（身体下半/手臂下半）整体不可见；
  // 水面渐变/波纹由 drawGameWorld 先画（在底层），僵尸裁切后水行像素自然露出，形成"泡在水里"的真实遮挡。
  // 生效条件 = 水域关 + 水行 + 身体中心已越过草坪右缘进入水面区（x≤GRID_X+COLS*CELL_W+8，
  // 与 updateZombies 入水水花触发同一边界）——水行僵尸走在右侧路面段时路面无水，不裁。
  // 陆地区/陆地行零感知（inWater=false 时路径与 v1.2.0 完全一致）。
  const inWater=level.water&&WATER_ROWS.includes(z.row)&&z.x<=GRID_X+COLS*CELL_W+8;
  ctx.save();
  ctx.translate(x,y);
  if(inWater){
    ctx.beginPath();ctx.rect(-60,-120,120,136);ctx.clip();   // 只露 y≤16（腰线）以上；136=16-(-120)
  }
  const wob=Math.sin(z.walk)*0.06;
  ctx.rotate(wob);
  if(!inWater){
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(0,42,26,6,0,0,Math.PI*2);ctx.fill();   // 落地投影（水中无投影）
  }
  // 身体
  ctx.fillStyle=z.type==='bucket'?'#4a5a5a':'#5a6a4a';
  ctx.fillRect(-16,-4,32,42);
  // 头
  ctx.fillStyle='#c5d0a0';
  ctx.beginPath();ctx.arc(0,-18,18,0,Math.PI*2);ctx.fill();
  // 眼睛
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-6,-20,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6,-20,3,0,Math.PI*2);ctx.fill();
  // 嘴（张嘴）
  const mouthOpen=z.eating?(Math.sin(z.walk*2)*2+3):1;
  ctx.fillStyle='#600';
  ctx.fillRect(-14,-14+mouthOpen,28,4+mouthOpen*2);
  // 帽子 / 特殊
  if(z.type==='cone'){
    ctx.fillStyle='#d97b2a';
    ctx.beginPath();ctx.moveTo(-14,-30);ctx.lineTo(14,-30);ctx.lineTo(0,-52);ctx.closePath();ctx.fill();
  }else if(z.type==='bucket'){
    ctx.fillStyle='#b0b0b0';
    ctx.fillRect(-16,-40,32,12);
    ctx.fillStyle='#808080';
    ctx.fillRect(-18,-38,36,3);
  }else if(z.type==='fast'){
    ctx.fillStyle='#c04040';
    ctx.fillRect(-18,-4,36,10);
  }
  // 手臂
  ctx.fillStyle='#c5d0a0';
  ctx.fillRect(-24,10,10,22);
  ctx.fillRect(14,10,10,22);
  // v1.5 S4：减速冷色 tint（slowT>0 = 冰豆/冰瓜命中；半透明冰蓝罩染全身剪影）
  if(z.slowT>0){
    ctx.fillStyle='rgba(120,200,255,0.42)';
    ctx.fillRect(-18,-40,36,76);   // 覆盖身躯范围（头 -36..0 / 身 -4..38 / 臂 10..32）
  }
  // v1.6 corn 黄油定身：头顶黄油渍残留（白/淡黄小色块；与 chill 冷色 tint 独立存在，可并存叠加显示）
  if(z.freezeT>0){
    ctx.fillStyle='#efe08a';
    ctx.beginPath();ctx.arc(-6,-38,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fffbe0';
    ctx.beginPath();ctx.arc(-5,-40,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(inWater){
    // 水线亮带：腰线处一道浅色横条压在裁切边界上，强化"水位线"可读性（v1.2 引入的元素保留）
    ctx.fillStyle='rgba(200,235,255,0.5)';
    ctx.fillRect(x-18,y+14,36,3);
  }
  // 血条
  const k=z.hp/z.maxHp;
  ctx.fillStyle='#000';ctx.fillRect(x-24,y-50,48,4);
  ctx.fillStyle=k>0.5?'#4a4':'#f63';
  ctx.fillRect(x-24,y-50,48*k,4);
}

function drawProjectile(pr){
  if(pr.type==='pea'){
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(pr.x,pr.y+14,8,3,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(pr.x,pr.y,2,pr.x,pr.y,10);
    g.addColorStop(0,'#aef06a');g.addColorStop(1,'#4a8a2a');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(pr.x,pr.y,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(pr.x-3,pr.y-3,2.5,0,Math.PI*2);ctx.fill();
  }else if(pr.type==='snowpea'){
    // v1.5 S4 冰豆弹：豌豆同构、冰蓝渐变 + 拖尾光晕（视觉提示减速）
    ctx.fillStyle='rgba(150,220,255,0.35)';
    ctx.beginPath();ctx.arc(pr.x-8,pr.y,11,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(pr.x,pr.y,2,pr.x,pr.y,10);
    g.addColorStop(0,'#d8f4ff');g.addColorStop(1,'#4a9ad8');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(pr.x,pr.y,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(pr.x-3,pr.y-3,2.5,0,Math.PI*2);ctx.fill();
  }else if(pr.type==='corn'){
    if(pr.butter){
      // v1.6 黄油弹：白色奶酪块（浅黄白渐变 + 方块质感 + 高光块；与普通玉米粒弹可肉眼区分）

      ctx.fillStyle='rgba(0,0,0,0.2)';

</head>

// ---- 波次模板（§3.2 层②）：每世界 1 套出怪骨架 = 该世界锚点关 waves 的引用式骨架。

// 注意：模板 waves 与锚点对象**共享引用**是有意的——materializeLevels 深拷贝后才下发实例。----
const WAVE_TEMPLATES={
  1:{spawnMult:1,intervalMult:1,waves:_ANCHORS['1-1'].waves},

// ---- boot 期确定性展开（§3.2 层③）：纯函数（无随机/无 Date/无外部态⇒同输入同输出）。
// 对无显式 waves 的键：world/time/name/lawn 按键位+昼夜结构推导，startSun/armTime 取所在世界
// 锚点默认值，waves 从 WAVE_TEMPLATES[world] **JSON 深拷贝**补齐（禁止模板/实例共享引用）。
// 未来 v2.x 补真实关卡时把手写 waves 填回对应键即可，展开自动让位（§3.2）。----
function materializeLevels(){
  const DAY_NIGHT_SHORT={day:'白天',night:'夜晚',fog:'浓雾'};
  const WORLD_SHORT={1:'草地',2:'泳池',3:'墓地',4:'房屋'};
  function deriveTime(w,l){
    if(w===2)return l<=2?'day':(l<=5?'night':'fog');   // Q-6a 泳池三段
    return l<=5?'day':'night';                          // Q-6a 草/墓/房：前 5 昼后 5 夜
  }
  function metaFor(k){
    const m=/^([1-4])-([1-9]|10)$/.exec(k); if(!m)return null;
    const w=+m[1],l=+m[2],time=deriveTime(w,l),anch=_ANCHORS[w+'-1']||_ANCHORS['1-1'];
    // T-403 机制字段就位：占位关补齐地形机制字段（与各世界锚点语义一致）——
    //   世界 2 water:true（WATER_ROWS 水轴）；世界 4 roof:true+water:false（花盆税，互斥显式声明）；
    //   世界 3 grave:true（Q-7 墓碑机制预留位，本期无机制消费，实装随世界 3 开放）。
    //   URL 直跳占位关即呈现正确地形机制；选关页占位拦截不受影响（Q-12）。
    const terrain=w===2?{water:true}:w===4?{roof:true,water:false}:w===3?{grave:true}:{};
    // 墓碑装饰点位（世界 3 专属）：LCG 确定性伪随机（键哈希播种，boot 纯函数可复现），
    // 6~9 座散布棋盘去重；渲染层 drawWorldDecor 按此绘制，验收脚本可直接断言。
    let graves=null;
    if(w===3){
      let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;
      graves=[];let s=h||1;const n=6+s%4;
      while(graves.length<n){
        s=(s*1103515245+12345)>>>0;
        const col=(s>>>8)%COLS,row=(s>>>16)%ROWS;
        if(!graves.some(g=>g[0]===col&&g[1]===row))graves.push([col,row]);
      }
    }
    return {
      name:w+'-'+l+' '+WORLD_SHORT[w]+' · '+DAY_NIGHT_SHORT[time],
      world:w,time:time,
      startSun:anch.startSun,armTime:anch.armTime,
      lawn:(time==='day')?WORLD_THEMES[w].dayLawn.slice():WORLD_THEMES[w].nightLawn.slice(),
      totalWaves:WAVE_TEMPLATES[w].waves.length,
      waves:JSON.parse(JSON.stringify(WAVE_TEMPLATES[w].waves)),  // 深拷贝，禁止共享引用
      ...terrain,                                                  // T-403 地形机制字段
      ...(graves?{graves}:{})                                      // T-403 墓碑点位（仅世界 3）
    };
  }
  const out={};
  for(let w=1;w<=4;w++)for(let l=1;l<=10;l++){
    const k=w+'-'+l;
    out[k]=_ANCHORS[k]||metaFor(k);   // 锚点关字面量让位原则：显式配置优先，展开只补空位
  }
  return out;
}

function keyOrd(k){ return LEVEL_INDEX.indexOf(k); }   // 键→序位（0 起）：解锁键序比较统一入口（T-103）
// 数字键兼容 shim（§3.5）：n∈1..5 → '1-'+n，否则 null；严格上界 5（旧 ?level=6 被拒语义不许放宽）。

function computeClearReward(worldKey){
  const c=POINT_CONFIG.CLEAR_REWARD;
  if(c.mode!=='worldClear')return 0;   // 防御：配置被改坏时静默 0（不再有旧读法分支）

let endStats={run:0,clear:0,coin:0,total:0};

    const aw=SLOT_CONFIG.CARD_AWARD[levelKey];

    if(!saveCleared.includes(levelKey))saveCleared.push(levelKey);
  }
  const total=settlePointsRaw(collected+sweep,clearReward+coinReward);

  LINE:[659,0,784,0, 880,0,784,0, 659,0,587,0, 523,0,0,0,

  if(!audioCtx||audioCtx.state!=='running')return;   // 上下文没好时先不启（menu→play 的 startGame 会 ac()）
  const want=(state==='play'&&!paused&&!muted);   // paused 也是停止条件（2026-09-20 用户反馈：暂停后 BGM 还在放）
  if(want&&!BGM.on){

function bgmTick(){

  while(BGM.nextT<c.currentTime+0.3){
    const i=BGM.step%32;
    const fm=BGM.LINE[i], fb=BGM.BASS[i];
    if(fm>0){
      // 旋律层：triangle 音色，音量 0.07（×env0.5=0.035 可闻且柔和）
      const o=c.createOscillator(),g=c.createGain();

      g.gain.linearRampToValueAtTime(0.07,BGM.nextT+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,BGM.nextT+BGM.STEP*0.92);
      o.connect(g);g.connect(routeBus(c,'env'));
      o.start(BGM.nextT);o.stop(BGM.nextT+BGM.STEP);
    }
    if(fb>0){
      // 低音层：sine 根音，每 4 步一发，时长跨 4 步（连音铺底），音量 0.11
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=fb;
      g.gain.setValueAtTime(0.0001,BGM.nextT);
      g.gain.linearRampToValueAtTime(0.11,BGM.nextT+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,BGM.nextT+BGM.STEP*3.6);
      o.connect(g);g.connect(routeBus(c,'env'));

    AudioBus.keepAlive=true;
  }catch(e){/* 无头测试/降级环境无振荡器，静默跳过 */}
  // noise 缓冲预生成（0.1/0.3/0.5s）：初始化一次填充，播放时复用段，
  // 避免每帧新建 AudioBuffer + O(N) 填充循环（perf-profile §4.5）
  for(const k of ['0.1','0.3','0.5']){
    const dur=+k,len=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,len,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    AudioBus.noiseBufs[k]=buf;
  }
}
// 单音：频率、时长、波形、音量、延迟、滑到目标频率
function tone(freq,dur,opt={}){
  if(muted)return;
  const c=ac();if(!c)return;
  scheduleOrDefer(()=>scheduleTone(c,freq,dur,opt));
}
function scheduleTone(c,freq,dur,{type='sine',vol=0.12,delay=0,to=null,group=null}={}){
  // 8ms 前瞻：避免把事件排到"刚好此刻"，规避音频线程未就绪时被丢帧（开局首个音效）
  const t0=c.currentTime+delay+0.008;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(routeBus(c,group));
  o.start(t0);o.stop(t0+dur+0.03);
}
// 噪声：用于爆炸/挖掘/啃食。按 dur 就近取预生成 buffer 段（0.1/0.3/0.5s）
function noise(dur,opt={}){
  if(muted)return;
  const c=ac();if(!c)return;
  scheduleOrDefer(()=>scheduleNoise(c,dur,opt));
}
function scheduleNoise(c,dur,{vol=0.2,delay=0,lp=1200,hp=0,group=null}={}){
  const t0=c.currentTime+delay+0.008;   // 8ms 前瞻，同 tone()（防开局首音被吞）
  // 选最近一档 buffer（0.1/0.3/0.5s），不足补长靠低通衰减自然收尾
  const keys=Object.keys(AudioBus.noiseBufs);
  let buf=null;
  if(keys.length){
    let best=keys[0],bd=Infinity;
    for(const k of keys){const dd=Math.abs(+k-dur);if(dd<bd){bd=dd;best=k}}
    buf=AudioBus.noiseBufs[best];
  }
  const src=c.createBufferSource();src.buffer=buf||c.createBuffer(1,1,c.sampleRate);
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;
  const g=c.createGain();g.gain.value=vol;
  let node=src;
  if(hp>0){
    const h=c.createBiquadFilter();h.type='highpass';h.frequency.value=hp;
    src.connect(h);node=h;
  }
  node.connect(f);f.connect(g);g.connect(routeBus(c,group));
  src.start(t0);
}
// 取输出总线：group 显式优先（SFX 调用点已标注所属分组）；缺省走 event。
// 总线未初始化（无头测试 / 降级）时直连 destination，保证静默可用。
function routeBus(c,group){
  const g=(group&&AudioBus.buses[group])?group:'event';
  return (AudioBus.ctx===c&&AudioBus.buses[g])?AudioBus.buses[g]:c.destination;
}

// ============ 公共依赖 · Easing 缓动库（F-01/F-03/F-04 引用，feel-impl-skeleton §8） ============
const Easing = {
  linear:      t => t,
  easeOut:     t => 1 - Math.pow(1 - t, 2),
  easeOutCubic:t => 1 - Math.pow(1 - t, 3),
  easeInOut:   t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  // 弹性过冲（art-handoff §B 共享缓动库）：礼盒弹入/盖子弹飞/植物生长/名称 pop 共用
  easeOutBack: t => 1 + 2.7 * Math.pow(t-1, 3) + 1.7 * Math.pow(t-1, 2),
  easeOutBounce:t => {
    const n1=7.5625, d1=2.75;
    if (t<1/d1) return n1*t*t;
    if (t<2/d1) return n1*(t-=1.5/d1)*t + 0.75;
    if (t<2.5/d1)return n1*(t-=2.25/d1)*t + 0.9375;
    return n1*(t-=2.625/d1)*t + 0.984375;
  },
};

//   · 暂停时 update 不执行 → 警报天然同步暂停（§C.1 的暂停要求零额外代码）
//   · 横幅结束当帧 stop() → 与紧随其后的 SFX.bigWaveImpact 收束衔接，不留拖尾
const SirenLoop={
  on:false, t:0, rounds:0,
  INTERVAL:0.62,          // ≈ 单轮 siren 时长，首尾相接不重叠
  MAXROUND:8,             // 防御上限：异常情况下不无限响（正常路径 2s 窗口约 4 轮）
  start(){this.on=true;this.t=this.INTERVAL;this.rounds=1;SFX.siren()},   // 首轮立即响，下一轮 +INTERVAL
  stop(){this.on=false},
  tick(dt){
    if(!this.on)return;
    this.t-=dt;
    if(this.t>0)return;
    this.t=this.INTERVAL;this.rounds++;

let lastT=performance.now();

let frameErr=null, frameErrT=0;
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;lastDt=dt;
  // 关键：整帧用 try/catch 包住。否则任意一帧抛异常会让 requestAnimationFrame 不再续订，
  // 游戏永久卡死（表现为“突然退出/黑屏不动”），而这是偶发且难复现的。
  try{
    flushAudioQueue();          // 补播挂起的音效（上下文就绪后逐帧冲洗）
    // BGM 兜底启动：startGame 时上下文可能尚未 running，running 后这里每帧重试
    if(state==='play'&&!BGM.on)updateBGM();
    if(exitArm>0)exitArm-=dt;
    if(toastT>0)toastT-=dt;
    if(frameErrT>0)frameErrT-=dt;
    // F-04 震动/闪光衰减：须在三态（menu/play/end）无条件推进，否则 end 态震动永不衰减（v1.6 bug1）。
    // 原置于 update()（仅 state==='play'&&!paused 时跑）⇒ 末只怪被地瓜炸死同帧 triggerShake(6,300)+setState('end')
    // 时结算屏永久抖动；失败进屋 8px 特写 / 震动中回菜单 / 暂停 同理冻结。放此处与 exitArm/toastT 等同寿命计时同段。
    if(screenShake.t>0)screenShake.t-=dt;
    if(flashT>0)flashT-=dt;
    if(giftAnim.active&&state==='end')giftAnim.t+=dt;   // v2.3 消缺：礼盒动画只在结算屏推进（点下一关/返回后随 state 切换自然停止）
    // 植物淡入完成提示音（v2.2.4：淡入到顶即响一声「叮」，复用 SFX.sun 零新键；giftAnim.sfx 防重）
    if(giftAnim.active&&state==='end'&&giftAnim.card){
      const _s=giftAnim.sfx||(giftAnim.sfx={});
      if(giftAnim.t>=1.0&&!_s.done){_s.done=true;SFX.sun();}
    }
    if(state==='play'&&!paused){
      const sdt=dt*gameSpeed;
      gt+=sdt;
      update(sdt);
    }
    render();
    drawToast();
    if(frameErrT>0)drawFrameErr();
  }catch(err){

    frameErr=err;frameErrT=5;
    console.error('[PvZ] 帧异常，已隔离：',err);
  }
  requestAnimationFrame(loop);
}

  const hasPad=()=>plants.some(p=>p.col===g.x&&p.row===g.y&&p.type==='lilypad');
  const hasPot=()=>plants.some(p=>p.col===g.x&&p.row===g.y&&p.type==='planter');
  const occupied=()=>plants.some(p=>p.col===g.x&&p.row===g.y&&!((p.type==='lilypad'||p.type==='planter')&&c.type!==p.type));
  const rules=[
    [occupied, '这格已经有植物了'],
    [k=>k.type==='lilypad'&&!(level.water&&WATER_ROWS.includes(g.y)), '睡莲只能种在水里'],
    [k=>level.water&&WATER_ROWS.includes(g.y)&&k.type!=='lilypad'&&!hasPad(), '水格需要先铺睡莲'],
    [k=>!level.roof&&k.type==='planter', '花盆只能放屋顶'],
    [k=>level.roof&&k.type!=='planter'&&!hasPot(), '先放花盆'],
    [k=>level.roof&&k.type==='planter'&&plants.some(p=>p.col===g.x&&p.row===g.y), '这格已经有植物了'],
  ];
  for(const [violated,msg] of rules) if(violated(c)) return {ok:false,msg};
  return {ok:true};
}

// P1-B · spawnPlant 工厂（code-review-todo 2026-09-20）：植物对象 schema 单点真相。
// 旧对象兜底（drawPlant L1748 区 plantT===undefined）保留不删——harness 注入的测试对象
// 仍是旧 schema（bench.js / pot-occlusion-verify.js / e5n4-runner.mjs 自带 plantT:620）。
// 约定：新字段一律只加在这里，禁止调用点内联补挂（F-01 三字段历史上就散在 push 里）。
function spawnPlant(type, col, row, cardSlotIdx){
  const c=CARDS.find(k=>k.type===type);
  const oneShot=(type==='squash'||type==='pepper'||type==='cherry');   // mine 地瓜保留 armT=level.armTime（8s 武装期）
  return {
    col, row, type, cd:0,
    sunT: type==='sunflower' ? 7 : 0,
    armT: oneShot?0:level.armTime, dur: c.dur, maxDur: c.dur,
    // v2.2.5 消缺：航椒/樱桃种植后进入膨胀期（arming=true），膨胀完成（armT≥ARM_TIME）才可被踩中触发爆炸。
    // 膨胀期内不可被啃食（updateZombies 目标判定跳过）、不可被踩中触发（updatePlant 分支守卫）。
    arming: (type==='pepper'||type==='cherry'),
    // F-01 种植动画三件套（plantT/plantDone/plantFrom）+ 尘土一次性标记
    plantT:0, plantDone:false, dirtDone:false,
    plantFrom:{ x: CARD_X0+cardSlotIdx*CARD_W, y: CARD_Y+CARD_H/2 },
  };
}

function onClick(e){
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*(canvas.width/r.width);
  const y=(e.clientY-r.top)*(canvas.height/r.height);
  canvas.focus();

  if(state==='menu'){onClickMenu(x,y);return}
  if(state==='deck'){onClickDeck(x,y);return}     // v1.4 T-10：选卡界面
  if(state==='select'){onClickSelect(x,y);return}   // v2.0 M2 T-205：选关页命中
  if(state==='end'){onClickEnd(x,y);return}
  if(state!=='play'||paused)return;

  // 卡片栏 / 铲子槽
  if(y>=CARD_Y){
    // 铲子
    if(x>=SHOVEL_X&&x<=SHOVEL_X+SHOVEL_W){
      const wasShovel=!!(selected&&selected.shovel);
      selected=wasShovel?null:{shovel:true};
      if(!wasShovel)SFX.shovelArm();   // B9：进入铲子模式的听觉确认（§B9 · P2）
      return;
    }
    for(let i=0;i<deck.length;i++){   // v1.4 T-14：卡源 CARDS→deck（≤slots 张；空槽不渲染不响应）
      const type=deck[i];
      if(!type)continue;
      const c=CARDS.find(k=>k.type===type);
      if(!c)continue;
      const cx=CARD_X0+i*CARD_W;
      if(x>=cx&&x<=cx+CARD_W&&y>=CARD_Y&&y<=CARD_Y+CARD_H){
        selected=(selected&&selected.i===i)?null:{i,type:c.type,name:c.name,cost:c.cost};
        return;
      }
    }
    return;
  }
  // 阳光
  for(let i=effects.length-1;i>=0;i--){
    const ef=effects[i];
    if(ef.kind==='sun'&&!ef.dead){
      const dx=x-ef.x,dy=y-ef.y;
      // 收集判定半径 40px（1600）：放大 30→40（v1.3 真机反馈「阳光不好点中」）
      // 取舍：drawSun 视觉最大半径 26px（光芒外缘），40px 外扩 14px 给手指余量；
      // 相邻阳光最小横向间距 = 格宽 90px > 40+40，两判定圆不重叠，不会点 A 收 B
      if(dx*dx+dy*dy<1600){sun+=ef.value;ef.dead=true;SFX.sun();return}
    }
  }
  // v1.4 T-05：积分掉落收集（阳光优先——走到这里说明本点无阳光；R-6 变体用户 11:0x 拍板）
  for(let i=pointDrops.length-1;i>=0;i--){
    const d=pointDrops[i];
    if(d.dead)continue;
    const dx=x-d.x,dy=y-d.y;
    if(dx*dx+dy*dy<900){   // 半径 30px（同阳光手感：v2 提案 §3）
      runPoints+=d.value;   // 阶位分 1/2/3（T-07 难度乘算在结算统一做，此处原值累计）
      d.dead=true;
      spawnBurst(d.x,d.y,d.color,6);   // 收集小爆点（颜色同阶位）
      SFX.cardReady('sunflower');      // 复用「叮」型就绪音（零新 SFX 键，总线 56 维持）
      return;
    }
  }
  // 格子：种植 / 铲除
  const g=posToGrid(x,y);
  if(inGrid(g)){
    // 铲子模式：移除该格植物
    if(selected&&selected.shovel){
      let dug=false;
      // v1.2 E4（A 案+返还修订 2026-09-18 真机反馈）：倒序取格内最上层实体——垫+植物 → 先移植物留垫；仅空垫 → 移垫；陆地格行为不变
      // 返还规则：按被铲实体卡价返还一半（向下取到 25 的倍数，最低 25）——铲豌豆返 50、铲垫返 25
      for(let i=plants.length-1;i>=0;i--){
        const p=plants[i];
        if(p.col===g.x&&p.row===g.y){
          const cp=gridToPos(p.col,p.row);
          plants.splice(i,1);
          const card=CARDS.find(c=>c.type===p.type);
          const refund=Math.max(25,Math.floor(card.cost/2/25)*25);
          sun+=refund;
          toast('+'+refund+' 阳光',1.2);
          spawnBurst(cp.x,cp.y,'#8b6528',10);
          SFX.shovel();
          dug=true;
          break;
        }
      }
      if(!dug)SFX.shovelEmpty();   // B10：铲空与挖到区分（§B10 · P2）
      selected=null;return;
    }
    if(selected){
      // v1.4 T-14：selected.i 是卡栏槽位（=deck 下标），卡片本体按 selected.type 解析——
      // CARDS[selected.i] 语义已死（deck≠CARDS 下标对齐，如 deck=[pea,...] 时 i=0 是豌豆）
      const c=CARDS.find(k=>k.type===selected.type);
      if(!c){selected=null;return}
      // P1-A：种植校验收拢为 canPlant 规则表（纯函数，见 onClick 前注释块）。
      // 契约不变：拒绝在扣款前、零副作用、保留选中方便改点空格；拒绝顺序=规则表顺序。
      const v=canPlant(c,g);
      if(!v.ok){SFX.deny();toast(v.msg,1.4);return}
      if(sun>=c.cost&&!(cardCD[c.type]>0)){
        sun-=c.cost;cardCD[c.type]=c.cd;
        // F-01：push 在 selected=null 之前，selected.i 仍可取卡片槽坐标（蓝图 §2 注）
        plants.push(spawnPlant(c.type, g.x, g.y, selected.i));   // P1-B：建档收拢工厂
        SFX.plant();
      }else{
        SFX.deny();
      }
      selected=null;return;
    }
  }
}

function buySlot(){
  if(slots>=SLOT_CONFIG.maxSlots){SFX.deny();return}
  const price=SLOT_CONFIG.SLOT_PRICE[slots+1];
  if(price==null){SFX.deny();return}

function onClickSelect(x,y){
  // v2.0 M2 T-205：选关页命中（几何全部与 drawSelect 共用 SELECT_GEOM，禁两处硬编码）。
  // 流程沿 Q-18：点关 → deck 选卡 → 开局；占位格 toast 拦截；返回钮回 menu。
  const G=SELECT_GEOM;
  // 页签切换（4 世界）
  for(let w=1;w<=4;w++){
    const T=G.TAB,bx=T.x0+(w-1)*(T.w+T.gap);
    if(x>=bx&&x<=bx+T.w&&y>=T.y&&y<=T.y+T.h){if(w!==selTab){selTab=w;SFX.uiClick()}return}
  }
  // 难度切换（Q-17）——v2.3 消缺：切换难度时交换独立关卡进度（saveCleared/unlocked）
  const names=Object.keys(DIFFS);
  for(let i=0;i<names.length;i++){
    const D=G.DIFF,bx=D.x0+i*(D.w+D.gap);
    if(x>=bx&&x<=bx+D.w&&y>=D.y&&y<=D.y+D.h){
      if(DIFF!==names[i]){
        // 先把当前难度进度写回 diffProgress，再切到目标难度接管其进度
        diffProgress[DIFF]={cleared:saveCleared,unlocked:unlocked};
        DIFF=names[i];
        saveCleared=diffProgress[DIFF].cleared;
        unlocked=diffProgress[DIFF].unlocked;
        SFX.uiClick();
      }
      return;
    }
  }
  // 关卡格命中（row0=1..5 / row1=6..10）
  const C=G.CELL;
  for(let row=0;row<2;row++)for(let col=0;col<5;col++){
    const bx=C.x0+col*(C.w+C.colGap),by=C.y+row*(C.h+C.rowGap);
    if(x>=bx&&x<=bx+C.w&&y>=by&&y<=by+C.h){
      const k=selTab+'-'+(row*5+col+1);
      const award=SLOT_CONFIG.CARD_AWARD[k];
      const placeholder=(award==null||award==='PLACEHOLDER');
      if(placeholder){toast('该关卡即将开放');SFX.deny();return}   // Q-3=A：占位点击 toast+轻音效
      if(!testMode&&keyOrd(k)>keyOrd(unlocked)){SFX.deny();return}            // 未解锁拒绝（Q-16 键序比较）；v2.0.1：test=1 解锁定闸（占位拦截在前仍恒生效）
      levelKey=k;level=LEVELS[k];
      SFX.uiClick();setState('deck','选关 '+k+' → 选卡');return;   // Q-18：点关先进 deck
    }
  }
  // 返回主菜单钮
  const B=G.BACK;
  if(x>=B.x&&x<=B.x+B.w&&y>=B.y&&y<=B.y+B.h){SFX.uiClick();setState('menu','选关返回');return}
}
function onClickDeck(x,y){
  // 上排待选命中 → 加入（超 slots 拒绝）
  for(let i=0;i<ownedCards.length;i++){
    const type=ownedCards[i];
    const col=i%DECK_GRID.cols,row=Math.floor(i/DECK_GRID.cols);
    const bx=DECK_GRID.x0+col*DECK_GRID.gw,by=DECK_GRID.y0+row*DECK_GRID.gh;
    if(x>=bx&&x<=bx+150&&y>=by&&y<=by+100){
      if(deck.includes(type))SFX.deny();   // 已选卡点上方=拒绝（移除走下方卡槽栏）
      else if(deck.length<slots){deck.push(type);SFX.uiClick()}
      else SFX.deny();   // 超出槽数拒绝
      saveMeta();
      return;
    }
  }
  // 下排卡槽栏命中 → 实卡点击移除
  for(let s=0;s<slots;s++){
    const bx=DECK_SLOTS.x0+s*DECK_SLOTS.cw,by=DECK_SLOTS.y0;
    if(x>=bx&&x<=bx+DECK_SLOTS.cw&&y>=by&&y<=by+120){
      if(deck[s]){deck.splice(s,1);SFX.uiClick()}
      else SFX.deny();
      saveMeta();
      return;
    }
  }
  if(x>=300&&x<=480&&y>=600&&y<=654&&deck.length>=1){startGame('选卡开始');return}
  if(x>=520&&x<=700&&y>=600&&y<=654)setState('select','选卡返回');   // v2.0 M2 T-205：返回钮回选关页（Q-18 流程 menu→select→deck）
}
function onClickEnd(x,y){
  // T-301：下一关=同世界 w-(l+1)（跨世界不通达，世界末关 l=10 无下一关钮，plan §2.5）。
  // 占位拦截同源选关页口径（CARD_AWARD 无真卡 → toast+deny，Q-3），且必须先于解锁检查——
  // 否则占位键（如通关 1-6 后的 1-7）已被解锁推进放行，会直接开出模板局，违反 Q-12 仅 1-1 可玩。
  const m=/^([1-4])-([1-9]|10)$/.exec(levelKey);
  const hasNext=won&&!!m&&+m[2]<10;
  const nk=hasNext?m[1]+'-'+(+m[2]+1):null;
  const B=END_BTN;   // 与 drawEnd 共用几何（v1.9.0 UI 修复：消除两处硬编码漂移）
  if(hasNext&&x>=B.x&&x<=B.x+B.w&&y>=B.nextY&&y<=B.nextY+B.h){
    const aw=SLOT_CONFIG.CARD_AWARD[nk];
    if(aw==null||aw==='PLACEHOLDER'){toast('该关卡即将开放');SFX.deny();return}   // Q-3 占位 toast
    if(!testMode&&keyOrd(nk)>keyOrd(unlocked))return;   // 未解锁：无 toast 无音效（同旧版按钮不存在语义）；v2.0.1：test=1 解锁定闸
    levelKey=nk;level=LEVELS[nk];
    setState('deck','结算 → 选卡下一关');return;   // v2.3 消缺：下一关先进选卡界面（Q-18 流程），而非直接开局
  }
  const backY=hasNext?B.nextY+B.backGap:B.nextY;
  if(x>=B.x&&x<=B.x+B.w&&y>=backY&&y<=backY+B.h){setState('select','结算返回')}   // T-301：menu→select（选关页为关卡中枢）
}

function onKey(e){
  // 输入框等可编辑元素不劫持
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  const k=(e.key||'').toLowerCase();
  if(!k)return;

  if(k>='1'&&k<='9'){   // v1.4 T-14：热键映射 deck[i]（i=卡栏槽位）；空槽/越位忽略
    e.preventDefault();
    if(state!=='play'||paused)return;
    const i=+k-1,type=deck[i];
    if(!type)return;
    const c=CARDS.find(k2=>k2.type===type);
    if(!c)return;
    selected=(selected&&selected.i===i)?null:{i,type:c.type,name:c.name,cost:c.cost};
    return;
  }
  if(k==='x'){
    e.preventDefault();
    if(state!=='play'||paused)return;
    const wasShovel=!!(selected&&selected.shovel);
    selected=wasShovel?null:{shovel:true};
    if(!wasShovel)SFX.shovelArm();   // B9：同点击铲子槽（§B9 · P2）
    return;
  }
  if(k===' '){
    e.preventDefault();   // 阻止 Space 触发当前聚焦按钮的默认点击
    if(state==='menu'){setState('select','空格')}   // v2.0 M2 T-203：空格=进入选关（对齐「进入游戏」钮；开局由选关页点关承接）
    else if(state==='end'){setState('select','空格')}   // T-301：结算空格回选关页（对齐返回钮 menu→select 语义）
    else if(state==='play')togglePause('空格');
    return;
  }
  if(k==='f'){
    e.preventDefault();
    document.getElementById('fast').click();
    return;
  }
  if(k==='m'){
    e.preventDefault();
    document.getElementById('mute').click();
    return;
  }
  if(k==='r'){
    e.preventDefault();
    requestExit('R 键');
    return;
  }
  if(k==='escape'){
    e.preventDefault();
    if(state==='play'&&selected){selected=null;return}
    if(state==='play')togglePause('Esc');
    return;
  }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>植物大战僵尸 · PvZ Lite</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1005}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;color:#fff}
#wrap{display:flex;flex-direction:column;gap:8px;max-width:100vw}
#canvas{display:block;background:#7fbf4a;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.6);cursor:pointer;max-width:100vw;height:auto}
#bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#c8b98a;background:#241810;padding:6px 12px;border-radius:6px}
#bar b{color:#ffd54a}
.ctrl button{margin-left:4px;background:#3a2a1a;color:#fff;border:1px solid #5a3a2a;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:12px}
.ctrl button:hover{background:#5a3a2a}
.ctrl button.on{background:#8b6f2a;border-color:#c9a34a;color:#fff}
</style>
</head>
<body>
<div id="wrap">
<canvas id="canvas" width="1000" height="680" tabindex="0"></canvas>
<div id="bar">
  <span id="stat"><b>🌞 50</b> · 波次 <b>1</b> · 分数 <b>0</b> · 速度 <b>1.0x</b></span>
  <span class="ctrl">
    <button type="button" id="pause">⏸ 暂停</button>
    <button type="button" id="fast">⏩ 加速</button>
    <button type="button" id="mute">🔊 音效</button>
    <button type="button" id="reset">🔄 重来</button>
  </span>
</div>
</div>

<script>
// ============ 基础配置 ============
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const COLS=9, ROWS=5, CELL_W=90, CELL_H=104, GRID_X=55, GRID_Y=80, ROAD_W=90;
const WATER_ROWS=[1,3];   // v1.2 泳池：水行（0-indexed），种植需先铺垫
const CARD_H=78, CARD_W=98, CARD_GAP=4, CARD_Y=680-CARD_H-2;
const SHOVEL_X=6, SHOVEL_W=62;      // 铲子槽
const CARD_X0=SHOVEL_X+SHOVEL_W+8;  // 卡片起始位置
const CABBAGE_VX=260, CABBAGE_G=500;   // v1.3 屋顶投手抛物物理常量（仅 type==='cabbage' 弹生效；V13-S1 §1.3）
// v1.3-M3 屋顶倾斜度：斜砖缝全局剪切斜率（正=砖缝"右倾"/上端点偏右；符号翻转即镜像左倾）·仅视觉 · Playtest 可调
const ROOF_SLOPE=0.18;   // 【v1.3-M4 C2 弃用】M3「行带整体旋转」口径已被 C2「逐 x 抬升（shear）」取代；本常量保留不引用（历史 M3 皮肤），决策见 ADR-005
// v1.3-M4 屋顶连续斜坡（C2）：仅 level.roof 生效；左 5 列抬升（col0..4）、右 4 列为水平平台
const ROOF_COLS=5;        // 斜坡占列数（col0..ROOF_COLS-1）；水平跨度 = 5*CELL_W = 450px
const ROOF_LIFT_H=60;     // 台面总抬升 px（平台相对 col0 的抬升量）。H=60 定稿；硬上限 66
// 版本号（KNOWN-ISSUES #6）：源码内嵌版本标识，便于仅凭文件本身判定版本
const VERSION='v1.2.1';

const DIFFS={
  normal:{name:'普通',mult:1.0,speed:1.0},
  hard  :{name:'困难',mult:1.35,speed:1.15},
  expert:{name:'地狱',mult:1.80,speed:1.30}
};
let DIFF='normal';

// 关卡配置
// L1 参考原版 PvZ 1-1：只有普通僵尸 + 少量路障
// L2 参考原版 1-2：解锁快速僵尸，波次更长
const LEVELS={
  1:{
    name:'第一关 · 白天草坪',
    startSun:150,
    armTime:8,          // 地瓜埋雷武装时长（秒）
    lawn:['#88c250','#77b042'],
    totalWaves:5,
    waves:[
      {spawns:[['normal',1]],                    interval:10},
      {spawns:[['normal',2]],                    interval:9},
      {spawns:[['normal',2],['cone',1]],         interval:8},
      {spawns:[['normal',3]],                    interval:7},
      {spawns:[['normal',3],['cone',1]],         interval:6, big:true}
    ]
  },
  2:{
    name:'第二关 · 黄昏草坪',
    startSun:150,       // 2026-09-16 削峰：100→150 对齐 L1，前期铺经济不再吃亏
    armTime:8,
    lawn:['#7fb04a','#6e9c3d'],
    dusk:true,          // 加一层暖色黄昏滤镜
    totalWaves:6,
    waves:[
      {spawns:[['normal',2]],                          interval:10},
      {spawns:[['normal',2],['fast',1]],               interval:9},
      {spawns:[['normal',3],['cone',1]],               interval:8},
      {spawns:[['fast',2],['normal',2]],               interval:7, big:true},
      {spawns:[['normal',3],['cone',1],['fast',1]],    interval:6},
      {spawns:[['normal',3],['cone',2],['fast',1]],    interval:5, big:true}
    ]
  },
  3:{
    name:'第三关 · 月夜草坪',
    startSun:100,       // 2026-09-17 V11-08：前两波刻意放软补偿（GDD level-3.md §5.2）
    armTime:8,
    lawn:['#6f9f5e','#628f52'],   // 偏暗夜绿两色
    night:true,         // 冷蓝月夜滤镜（drawGameWorld 渲染分支）
    totalWaves:7,
    waves:[
      {spawns:[['normal',2]],                                interval:10},
      {spawns:[['normal',2],['cone',1]],                     interval:9},
      {spawns:[['normal',2],['fast',2]],                     interval:8, big:true},
      {spawns:[['normal',3],['cone',1],['fast',1]],          interval:7},
      {spawns:[['cone',2],['fast',2]],                       interval:7, big:true},
      {spawns:[['normal',3],['cone',2],['fast',1],['bucket',1]], interval:6},
      {spawns:[['normal',3],['cone',2],['fast',2],['bucket',1]], interval:6, big:true}
    ]
  },
  4:{
    name:'第四关 · 泳池',
    startSun:150,                 // V12：刻意高于 L3 的 100——隔离水税新变量 + 水行机动资金（GDD §5.2，拍板项①）
    armTime:8,                    // 与 L1–L3 一致
    lawn:['#5a9e6b','#4f8f5f'],   // 陆地亮绿棋盘；水行底色/波纹由 WATER_ROWS 驱动单独渲染
    water:true,                   // V12 实现期补充：水域开关（架构文档 §3/§4 原案全局生效会误伤 L1-L3 陆地行，实测 SMOKE-010 当场拦截；波次表拍板值零改动）
    totalWaves:8,
    waves:[
      {spawns:[['normal',2]],                                      interval:10},          // W1 平软开局
      {spawns:[['normal',2],['cone',1]],                           interval:9},           // W2 教学复现
      {spawns:[['normal',2],['fast',2]],                           interval:8,  big:true},// W3 第1次大波·快袭（水行裸奔教学时刻）
      {spawns:[['normal',3],['cone',1],['fast',1]],                interval:7},           // W4 混编喘息
      {spawns:[['cone',2],['fast',2]],                             interval:7},           // W5 数量回落·末次喘息
      {spawns:[['normal',2],['cone',2],['bucket',1]],              interval:6,  big:true},// W6 第2次大波·二幕开场（铁桶回归）
      {spawns:[['normal',2],['cone',2],['fast',2],['bucket',1]],   interval:6},           // W7 全家福彩排（非大波）
      {spawns:[['normal',3],['cone',2],['fast',1],['bucket',2]],   interval:6,  big:true} // W8 终波·双铁桶压轴
    ]
  },
  5:{
    name:'第五关 · 屋顶',
    startSun:200,                 // V13：全场地盆税起步补偿（GDD level-5.md §5.2 专项推导；序列 150/150/100/150/200 非单调系刻意）
    armTime:8,                    // 与 L1–L4 一致
    lawn:['#8a7a5a','#6e5f45'],   // 屋顶砖瓦两色（要求与花盆/植物剪影可区分；GDD §4.1）
    roof:true,                    // V13 屋顶开关：全 5 行需先放花盆（与 water 互斥，SMOKE-027 T14 锁）
    water:false,                  // terrain 互斥显式声明：屋顶非水域（水轴 WATER_ROWS 逻辑对其零触发）
    totalWaves:9,
    waves:[
      {spawns:[['normal',2]],                                      interval:10},          // W1 盆税观察窗
      {spawns:[['normal',2],['cone',1]],                           interval:9},           // W2 教学复现
      {spawns:[['normal',2],['fast',2]],                           interval:8,  big:true},// W3 首大波·抛物教学
      {spawns:[['normal',3],['cone',1]],                           interval:7},           // W4 混编喘息
      {spawns:[['cone',2],['fast',2]],                             interval:7},           // W5 数量回落（轻甲快袭）
      {spawns:[['normal',2],['cone',1],['fast',1],['bucket',1]],   interval:6,  big:true},// W6 二幕·铁桶回归
      {spawns:[['normal',2],['cone',2],['fast',1],['bucket',1]],   interval:6},           // W7 全家福彩排（非大波）
      {spawns:[['normal',2],['cone',2],['fast',2]],                interval:6},           // W8 无桶喘息
      {spawns:[['normal',3],['cone',2],['fast',1],['bucket',2]],   interval:6,  big:true} // W9 终波·双铁桶压轴
    ]
  }
};
let level=LEVELS[1];
let levelNo=1;
// 解锁进度持久化（2026-09-16）：localStorage 记录，加 URL 参数 ?level=2 可跳过解锁直进第二关
let unlockedLevel=1;
try{
  const _sv=+localStorage.getItem('pvz_unlocked');
  if(_sv>=1&&_sv<=Object.keys(LEVELS).length)unlockedLevel=_sv;
}catch(e){/* 无痕模式等场景静默降级 */}
try{
  const _qp=new URLSearchParams(location.search).get('level');
  if(_qp&&+_qp>=1&&+_qp<=Object.keys(LEVELS).length){
    unlockedLevel=Math.max(unlockedLevel,+_qp);
    levelNo=+_qp;level=LEVELS[levelNo];
  }
}catch(e){}

// 测试模式（2026-09-20 用户需求）：URL 带 ?test=1 开启——阳光锁 9999 无限种植物，方便验收测试
// 仅本地娱乐/测试用，不入存档、不影响正常对局；HUD 右上角显示「测试模式」角标提示
let testMode=false;
try{
  testMode=new URLSearchParams(location.search).get('test')==='1';
}catch(e){/* 静默降级 */}

// 存档读写统一入口（2026-09-16 · KNOWN-ISSUES #9）：隐私模式 / file:// 受限环境下静默降级，绝不抛错中断游戏
function storageGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function storageSet(key,val){
  try{ localStorage.setItem(key,val); }catch(e){/* 静默降级：写失败不影响对局 */}
}

// 植物卡
const CARDS=[
  {type:'sunflower',name:'向日葵',cost:50, cd:5, dur:600},
  {type:'pea',      name:'豌豆',  cost:100,cd:5, dur:750},
  {type:'mine',     name:'地瓜',  cost:25, cd:20,dur:300},
  {type:'nut',      name:'坚果',  cost:50, cd:20,dur:3000},
  {type:'double',   name:'双发',  cost:200,cd:6, dur:750},
  {type:'melon',    name:'西瓜',  cost:175,cd:8, dur:900},
  {type:'lilypad',  name:'睡莲',  cost:25, cd:5, dur:300},   // v1.2 泳池：浮床载体，水行种植前置（无攻击）
  {type:'planter',  name:'花盆',  cost:25, cd:5, dur:300},   // v1.3 屋顶：陶盆载体，全格种植前置（无攻击；V13-S1 §1.4）
  {type:'cabbage',  name:'投手',  cost:100,cd:2.0,dur:750}    // v1.3 屋顶：卷心菜投手，抛物线单目标 20dmg（GDD §3.2）；cost 150→100；dmg 40→20 / cd 3.0→2.0（v1.3 真机验收：投手降级为基础款，单发对齐豌豆、射速慢于豌豆，dps 10.0 不支配；V13-04 设计裁决）
];

// 状态
let state='menu';        // menu | play | end
let sun,score,wave,lastWaveT,sunFallT,selected,paused,gameSpeed=1,won,gt;   // gameSpeed 声明处定基 1x：startGame 不再重置（2026-09-18 真机反馈：菜单设的 4x 进关被清零），档位只随按钮变
let highScore=Math.max(0,+storageGet('pvz_highscore')||0);   // 历史最高分持久化（#9）
let plants=[],zombies=[],projectiles=[],effects=[],cardCD={};

// 状态切换统一入口（带控制台留痕，方便排查“突然退出对局”这类偶现问题）
function setState(s,why){
  if(s===state)return;
  console.log('[PvZ] state '+state+' → '+s+(why?'  ('+why+')':'')+'  gt='+(gt||0).toFixed(1)+' wave='+wave);
  state=s;
  if(s==='end')updateBest();   // 结算即刷新历史最高分（#9）
  updateBGM();   // BGM 跟随游戏状态：play 播放，menu/end 停止
}
// 历史最高分落盘（仅当刷新纪录时写，减少 localStorage 写入，2026-09-16 #9）
function updateBest(){
  if(score>highScore){highScore=score;storageSet('pvz_highscore',highScore)}
}
// 屏幕提示条（临时消息）
let toastMsg='',toastT=0;
function toast(msg,sec){toastMsg=msg;toastT=sec||2.6}
function drawToast(){
  if(toastT<=0||!toastMsg)return;
  const a=Math.min(1,toastT/0.4);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.font='bold 15px "Microsoft YaHei"';
  const w=ctx.measureText(toastMsg).width+36;
  const x=(canvas.width-w)/2,y=52;
  ctx.fillStyle='rgba(20,12,4,0.9)';
  ctx.fillRect(x,y,w,34);
  ctx.strokeStyle='rgba(255,203,48,0.85)';ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,34);
  ctx.fillStyle='#ffd54a';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(toastMsg,canvas.width/2,y+18);
  ctx.restore();
}
// 对局中返回菜单需要二次确认，避免误触/误按丢掉进度
let exitArm=0;
function requestExit(byWhat){
  if(state!=='play'||gt<1.5){setState('menu','直接返回');exitArm=0;return}
  if(exitArm>0){exitArm=0;setState('menu','已确认：'+byWhat);return}
  exitArm=3;
  toast('对局进行中 · 再按/再点一次「'+byWhat+'」确认放弃并返回菜单',3);
}

// 工具
const R=(a,b)=>a+Math.random()*(b-a);
const C=(v,a,b)=>v<a?a:v>b?b:v;
// v1.3-M4 C2 屋顶抬升函数：返回该 x 处的抬升量（≥0 = 向上 = 屏幕 y 减小）。
// ★ 单点 gate：!level.roof 恒返回 0 ⇒ L1–L4 逐字节等价今日（gridToPos/posToGrid/弹道/实体 y 全校零）。
function liftX(x){
  if(!level.roof)return 0;
  return ROOF_LIFT_H*Math.max(0,Math.min(1,(x-GRID_X)/(ROOF_COLS*CELL_W)));
}
function gridToPos(col,row){
  const x=GRID_X+col*CELL_W+CELL_W/2;
  return{x,y:GRID_Y+row*CELL_H+CELL_H/2-liftX(x)};              // 用「格心 x」求抬升
}
function posToGrid(x,y){
  const col=Math.floor((x-GRID_X)/CELL_W);                      // ★ 先由「点击 x」定 col
  return{x:col,y:Math.floor((y-GRID_Y+liftX(x))/CELL_H)};       // ★ 再 +liftX 反解 row（符号：+；闭式互逆）
}
function inGrid(g){return g.x>=0&&g.x<COLS&&g.y>=0&&g.y<ROWS}

// ============ 音效（WebAudio 实时合成，无外部文件） ============
let audioCtx=null, muted=storageGet('pvz_muted')==='1';   // 静音偏好持久化（#9）：启动即恢复
let audioQueue=[];        // 上下文未就绪时挂起的音效补播队列（running 后由 loop 每帧冲洗）
function ac(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
    initAudioBus(audioCtx);   // 总线与 noise buffer 随上下文惰性建立一次（幂等）
    primeAudio(audioCtx);     // 预热音频管线（见下）
  }
  if(audioCtx.state==='suspended'){audioCtx.resume().catch(()=>{});}
  return audioCtx;
}
// 排程守卫：上下文未 running（suspended/interrupted）时，直接排程的事件可能被整段丢弃
//（用户反馈 2026-09-16：开局点阳光/种植无声）。改为入队，等 running 后由 loop 冲洗补播。
function scheduleOrDefer(fn){
  if(audioCtx&&audioCtx.state==='running'){fn();return}
  if(audioQueue.length<32)audioQueue.push(fn);   // 上限防堆积爆音
}
function flushAudioQueue(){
  if(!audioQueue.length)return;
  if(!audioCtx||audioCtx.state!=='running')return;
  const q=audioQueue;audioQueue=[];
  for(const f of q){try{f()}catch(e){}}
}
// 音频管线预热：上下文刚创建时音频线程尚未就绪，会话首个音效常被整段吞掉
//（用户反馈 2026-09-16：开局种植物没声音，之后的音效正常）。
// 播一个 1 帧静音 buffer 把管线顶热；纯静音、无听感影响，异常静默降级。
function primeAudio(c){
  try{
    const s=c.createBufferSource();
    s.buffer=c.createBuffer(1,1,c.sampleRate);
    s.connect(c.destination);
    s.start(0);
  }catch(e){/* 降级：预热失败不影响其它音效 */}
}
// 兜底：任意一次用户手势都尝试恢复音频上下文（部分浏览器创建后仍保持 suspended）
function armAudioUnlock(){
  const h=()=>{
    if(!audioCtx)ac();
    else if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    try{
      if(window.removeEventListener){
        window.removeEventListener('pointerdown',h);
        window.removeEventListener('keydown',h);
      }
    }catch(e){}
  };
  try{
    window.addEventListener('pointerdown',h);
    window.addEventListener('keydown',h);
  }catch(e){}
}
armAudioUnlock();
// ---- BGM（WebAudio 合成循环，零依赖）----
// 32 步循环（8 小节×4 拍）：旋律层（triangle，中高频小音箱也能重放）
// + 低音层（sine 根音），C 大调五声，C-G-Am-F 和声进行。
// 音量按「经 env 总线 0.5 衰减后仍清晰可闻」标定（初版 0.045×0.5 过轻 + 频段过低，用户听不到）。
// 时间轴自续：window.setInterval 校准，防止标签页休眠后错拍。
const BGM={
  on:false, timer:null, nextT:0, step:0,
  STEP:0.25,                      // 每步 0.25s（八分音符，≈120BPM）
  // 旋律线 32 步（0=休止）：E5 659 / G5 784 / A5 880 / C6 1047 / D5 587 / C5 523
  LINE:[659,0,784,0, 880,0,784,0, 659,0,587,0, 523,0,0,0,
        659,0,784,0, 880,0,1047,0, 880,0,784,0, 659,0,0,0],
  // 低音线 32 步（每 4 步一个根音）：C3-G3-A3-F3 和声进行 ×2
  BASS:[130.8,0,0,0, 196,0,0,0, 220,0,0,0, 174.6,0,0,0,
        130.8,0,0,0, 196,0,0,0, 220,0,0,0, 174.6,0,0,0],
};
function updateBGM(){
  if(!audioCtx||audioCtx.state!=='running')return;   // 上下文没好时先不启（menu→play 的 startGame 会 ac()）
  const want=(state==='play'&&!paused&&!muted);   // paused 也是停止条件（2026-09-20 用户反馈：暂停后 BGM 还在放）
  if(want&&!BGM.on){
    BGM.on=true;BGM.step=0;BGM.nextT=audioCtx.currentTime+0.1;
    BGM.timer=window.setInterval(bgmTick,120);
  }else if(!want&&BGM.on){

// 分组默认音量：battle=1.0 / event=0.9 / ui=0.6 / env=0.5
const AudioBus={
  ctx:null, master:null, buses:{}, noiseBufs:{}, keepAlive:false,
  levels:{battle:1.0,event:0.9,ui:0.6,env:0.5}
};
// SFX 分组映射（tone/noise 默认走 event；战斗/UI 音效按需显式传分组）。
// 本表是「规格侧」的权威映射，运行时由各 SFX 自带的 group 参数落地；
// verify-bus.js 逐键核对两者一致（新增音效必须同时补这里与 SFX 调用点）。
const AUDIO_ROUTES={
  plant:'ui',sun:'ui',sunDrop:'ui',cardReady:'ui',shovel:'ui',shovelArm:'ui',shovelEmpty:'ui',uiClick:'ui',deny:'ui',
  shoot:'battle',melonThrow:'battle',hit:'battle',death:'battle',boom:'battle',chomp:'battle',
  splash:'battle',   // v1.2 入水溅水（仅 water:true 关发声，但路由表全关静态登记）
  wave:'event',siren:'event',bigWaveImpact:'event',loseClimax:'event',win:'event',lose:'event'
};
function initAudioBus(c){
  if(AudioBus.ctx===c)return;        // 幂等：同一上下文只建一次
  AudioBus.ctx=c;
  AudioBus.master=c.createGain();
  AudioBus.master.gain.value=muted?0:1;     // 静音走主闸，不再业务层短路
  AudioBus.master.connect(c.destination);
  for(const k in AudioBus.levels){
    const g=c.createGain();
    g.gain.value=AudioBus.levels[k];
    g.connect(AudioBus.master);
    AudioBus.buses[k]=g;
  }

  // 唤醒过渡期会吞掉开头一段音频（诊断：可闻长音预热 K=5/5、静音保活 L=4/5、
  // 17.5kHz 超声保活 M=5/5 且不可闻）。非零样本常驻让设备保持活跃。
  // 直连 destination 不走 master——静音时主闸归零也不能切断保活样本流。
  try{
    const ko=c.createOscillator(),kg=c.createGain();
    ko.frequency.value=17500;kg.gain.value=0.005;
    ko.connect(kg);kg.connect(c.destination);ko.start();

  }catch(e){/* 无头测试/降级环境无振荡器，静默跳过 */}

  // 避免每帧新建 AudioBuffer + O(N) 填充循环（perf-profile §4.5）
  for(const k of ['0.1','0.3','0.5']){
    const dur=+k,len=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,len,c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    AudioBus.noiseBufs[k]=buf;
  }
}
// 单音：频率、时长、波形、音量、延迟、滑到目标频率
function tone(freq,dur,opt={}){
  if(muted)return;
  const c=ac();if(!c)return;
  scheduleOrDefer(()=>scheduleTone(c,freq,dur,opt));

function scheduleTone(c,freq,dur,{type='sine',vol=0.12,delay=0,to=null,group=null}={}){
  // 8ms 前瞻：避免把事件排到"刚好此刻"，规避音频线程未就绪时被丢帧（开局首个音效）
  const t0=c.currentTime+delay+0.008;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

// 噪声：用于爆炸/挖掘/啃食。按 dur 就近取预生成 buffer 段（0.1/0.3/0.5s）
function noise(dur,opt={}){
  if(muted)return;
  const c=ac();if(!c)return;
  scheduleOrDefer(()=>scheduleNoise(c,dur,opt));
}
function scheduleNoise(c,dur,{vol=0.2,delay=0,lp=1200,hp=0,group=null}={}){
  const t0=c.currentTime+delay+0.008;   // 8ms 前瞻，同 tone()（防开局首音被吞）
  // 选最近一档 buffer（0.1/0.3/0.5s），不足补长靠低通衰减自然收尾
  const keys=Object.keys(AudioBus.noiseBufs);
  let buf=null;
  if(keys.length){
    let best=keys[0],bd=Infinity;
    for(const k of keys){const dd=Math.abs(+k-dur);if(dd<bd){bd=dd;best=k}}
    buf=AudioBus.noiseBufs[best];
  }
  const src=c.createBufferSource();src.buffer=buf||c.createBuffer(1,1,c.sampleRate);
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;
  const g=c.createGain();g.gain.value=vol;
  let node=src;
  if(hp>0){
    const h=c.createBiquadFilter();h.type='highpass';h.frequency.value=hp;
    src.connect(h);node=h;
  }
  node.connect(f);f.connect(g);g.connect(routeBus(c,group));

// 取输出总线：group 显式优先（SFX 调用点已标注所属分组）；缺省走 event。
// 总线未初始化（无头测试 / 降级）时直连 destination，保证静默可用。
function routeBus(c,group){
  const g=(group&&AudioBus.buses[group])?group:'event';
  return (AudioBus.ctx===c&&AudioBus.buses[g])?AudioBus.buses[g]:c.destination;
}

const Easing = {
  linear:      t => t,
  easeOut:     t => 1 - Math.pow(1 - t, 2),
  easeOutCubic:t => 1 - Math.pow(1 - t, 3),
  easeInOut:   t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2,
  easeOutBounce:t => {
    const n1=7.5625, d1=2.75;
    if (t<1/d1) return n1*t*t;
    if (t<2/d1) return n1*(t-=1.5/d1)*t + 0.75;
    if (t<2.5/d1)return n1*(t-=2.25/d1)*t + 0.9375;
    return n1*(t-=2.625/d1)*t + 0.984375;
  },
};

function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;lastDt=dt;
  // 关键：整帧用 try/catch 包住。否则任意一帧抛异常会让 requestAnimationFrame 不再续订，
  // 游戏永久卡死（表现为“突然退出/黑屏不动”），而这是偶发且难复现的。

    if(state==='play'&&!BGM.on)updateBGM();
    if(exitArm>0)exitArm-=dt;
    if(toastT>0)toastT-=dt;
    if(frameErrT>0)frameErrT-=dt;

  if(AudioBus.ctx)AudioBus.master.gain.value=muted?0:1;
  storageSet('pvz_muted', muted?'1':'0');   // 持久化静音偏好（#9）
  applyMuteUI();
  if(!muted){ac();SFX.sun()}
  updateBGM();   // 静音时同步停 BGM（恢复时若在 play 中自动续上）
});
applyMuteUI();

function onClick(e){
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*(canvas.width/r.width);
  const y=(e.clientY-r.top)*(canvas.height/r.height);
  canvas.focus();

  if(state==='menu'){onClickMenu(x,y);return}
  if(state==='end'){onClickEnd(x,y);return}
  if(state!=='play'||paused)return;

  // 卡片栏 / 铲子槽
  if(y>=CARD_Y){
    // 铲子
    if(x>=SHOVEL_X&&x<=SHOVEL_X+SHOVEL_W){
      const wasShovel=!!(selected&&selected.shovel);
      selected=wasShovel?null:{shovel:true};
      if(!wasShovel)SFX.shovelArm();   // B9：进入铲子模式的听觉确认（§B9 · P2）
      return;
    }
    for(let i=0;i<CARDS.length;i++){
      const cx=CARD_X0+i*CARD_W;
      if(x>=cx&&x<=cx+CARD_W&&y>=CARD_Y&&y<=CARD_Y+CARD_H){
        const c=CARDS[i];
        selected=(selected&&selected.i===i)?null:{i,type:c.type,name:c.name,cost:c.cost};
        return;
      }
    }
    return;
  }
  // 阳光
  for(let i=effects.length-1;i>=0;i--){
    const ef=effects[i];
    if(ef.kind==='sun'&&!ef.dead){
      const dx=x-ef.x,dy=y-ef.y;
      // 收集判定半径 40px（1600）：放大 30→40（v1.3 真机反馈「阳光不好点中」）
      // 取舍：drawSun 视觉最大半径 26px（光芒外缘），40px 外扩 14px 给手指余量；
      // 相邻阳光最小横向间距 = 格宽 90px > 40+40，两判定圆不重叠，不会点 A 收 B
      if(dx*dx+dy*dy<1600){sun+=ef.value;ef.dead=true;SFX.sun();return}
    }
  }
  // 格子：种植 / 铲除
  const g=posToGrid(x,y);
  if(inGrid(g)){
    // 铲子模式：移除该格植物
    if(selected&&selected.shovel){
      let dug=false;
      // v1.2 E4（A 案+返还修订 2026-09-18 真机反馈）：倒序取格内最上层实体——垫+植物 → 先移植物留垫；仅空垫 → 移垫；陆地格行为不变
      // 返还规则：按被铲实体卡价返还一半（向下取到 25 的倍数，最低 25）——铲豌豆返 50、铲垫返 25
      for(let i=plants.length-1;i>=0;i--){
        const p=plants[i];
        if(p.col===g.x&&p.row===g.y){
          const cp=gridToPos(p.col,p.row);
          plants.splice(i,1);
          const card=CARDS.find(c=>c.type===p.type);
          const refund=Math.max(25,Math.floor(card.cost/2/25)*25);
          sun+=refund;
          toast('+'+refund+' 阳光',1.2);
          spawnBurst(cp.x,cp.y,'#8b6528',10);
          SFX.shovel();
          dug=true;
          break;
        }
      }
      if(!dug)SFX.shovelEmpty();   // B10：铲空与挖到区分（§B10 · P2）
      selected=null;return;
    }
    if(selected){
      const c=CARDS[selected.i];
      // 格子占用检查（保留选中，方便改点空格）：垫/盆不算占用（垫上可连种）；垫上再铺垫 / 普通格重复种植算占用
      if(plants.some(p=>p.col===g.x&&p.row===g.y&&!((p.type==='lilypad'||p.type==='planter')&&c.type!==p.type))){SFX.deny();toast('这格已经有植物了',1.4);return}
      // v1.2 水轴校验：位于扣款之前，拒绝路径零副作用（不扣阳光、不进 CD、不消耗选卡态）
      // v1.3 修复（用户反馈 2026-09-20「荷叶能种地上和盆上」）：旧写法两条都以 level.water 前置，
      // 非水域关（L1-L3/L5）整条短路 → 睡莲畅通；且 L5 行 1/3 命中全局 WATER_ROWS，配合花盆校验
      // 竟能把睡莲种到屋顶盆上。改为单条强约束「水域关 + 水行」双条件放行，任意其他组合一律拒绝。
      // 放行顺序在盆校验之前：睡莲属水轴（在 L5 永远非法），优先给出水轴拒绝语义而非「先放花盆」。
      if(c.type==='lilypad'&&!(level.water&&WATER_ROWS.includes(g.y))){SFX.deny();toast('睡莲只能种在水里',1.4);return}
      if(level.water&&WATER_ROWS.includes(g.y)&&c.type!=='lilypad'&&!plants.some(p=>p.col===g.x&&p.row===g.y&&p.type==='lilypad')){SFX.deny();toast('水格需要先铺睡莲',1.4);return}
      // v1.3 屋顶需盆校验（仅 roof 关生效；全 5 行需盆无行级分支）
      // v1.3 修复（用户反馈 2026-09-20「花盆只能放屋顶」）：补花盆的逆向约束——旧校验只管"屋顶关需要盆"，
      // 没管"非屋顶关不许放盆"，花盆在 L1-L4 畅通。镜像睡莲修法：单条强约束「仅 roof 关可放盆」。
      if(!level.roof&&c.type==='planter'){SFX.deny();toast('花盆只能放屋顶',1.4);return}
      if(level.roof&&c.type!=='planter'&&!plants.some(p=>p.col===g.x&&p.row===g.y&&p.type==='planter')){SFX.deny();toast('先放花盆',1.4);return}
      if(level.roof&&c.type==='planter'&&plants.some(p=>p.col===g.x&&p.row===g.y)){SFX.deny();toast('这格已经有植物了',1.4);return}
      if(sun>=c.cost&&!(cardCD[c.type]>0)){
        sun-=c.cost;cardCD[c.type]=c.cd;
        // F-01：push 在 selected=null 之前，selected.i 仍可取卡片槽坐标（蓝图 §2 注）
        plants.push({col:g.x,row:g.y,type:c.type,cd:0,sunT:c.type==='sunflower'?7:0,armT:level.armTime,dur:c.dur,maxDur:c.dur,
          plantT:0,
          plantFrom:{ x: CARD_X0+selected.i*CARD_W, y: CARD_Y+CARD_H/2 },
          plantDone:false});
        SFX.plant();
      }else{
        SFX.deny();
      }
      selected=null;return;
    }
  }
}

function onClickMenu(x,y){
  // 关卡选择（V11-08：上界 2→3 基准 350→270；V12：上界 3→4 基准 270→190；V13：上界 4→5 五钮，右缘 970<1000 不溢出）
  for(let i=1;i<=5;i++){
    const bx=190+(i-1)*160,by=254;
    if(x>=bx&&x<=bx+140&&y>=by&&y<=by+42){
      if(i<=unlockedLevel){levelNo=i;level=LEVELS[i];SFX.uiClick()}
      else SFX.deny();
      return;
    }
  }
  // 难度选择
  const names=Object.keys(DIFFS);
  for(let i=0;i<names.length;i++){
    const bx=250+i*160,by=348;
    if(x>=bx&&x<=bx+140&&y>=by&&y<=by+40){DIFF=names[i];SFX.uiClick();return}
  }
  if(x>=390&&x<=610&&y>=480&&y<=540){startGame('点开始');return}
}
function onClickEnd(x,y){
  const hasNext=won&&LEVELS[levelNo+1];
  if(hasNext&&x>=390&&x<=610&&y>=380&&y<=430){
    // 进入下一关
    levelNo++;
    level=LEVELS[levelNo];
    startGame();
    return;
  }
  const backY=hasNext?442:390;
  if(x>=390&&x<=610&&y>=backY&&y<=backY+50){setState('menu','结算返回')}
}

function onKey(e){
  // 输入框等可编辑元素不劫持
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  const k=(e.key||'').toLowerCase();
  if(!k)return;

  if(k>='1'&&k<='9'){   // v1.3：卡栏 7→9 张，热键扩到 9（花盆 8/投手 9；V13-S1 §2.2②）
    e.preventDefault();
    if(state!=='play'||paused)return;
    const i=+k-1,c=CARDS[i];
    if(!c)return;
    selected=(selected&&selected.i===i)?null:{i,type:c.type,name:c.name,cost:c.cost};
    return;
  }
  if(k==='x'){
    e.preventDefault();
    if(state!=='play'||paused)return;
    const wasShovel=!!(selected&&selected.shovel);
    selected=wasShovel?null:{shovel:true};
    if(!wasShovel)SFX.shovelArm();   // B9：同点击铲子槽（§B9 · P2）
    return;
  }
  if(k===' '){
    e.preventDefault();   // 阻止 Space 触发当前聚焦按钮的默认点击
    if(state==='menu'){startGame('空格')}
    else if(state==='end'){setState('menu','空格')}
    else if(state==='play')togglePause('空格');
    return;
  }
  if(k==='f'){
    e.preventDefault();
    document.getElementById('fast').click();
    return;
  }
  if(k==='m'){
    e.preventDefault();
    document.getElementById('mute').click();
    return;
  }
  if(k==='r'){
    e.preventDefault();
    requestExit('R 键');
    return;
  }
  if(k==='escape'){
    e.preventDefault();
    if(state==='play'&&selected){selected=null;return}
    if(state==='play')togglePause('Esc');
    return;
  }
}

// ============ 游戏控制 ============
function startGame(why){
  sun=level.startSun;
  if(testMode)sun=9999;   // 测试模式：阳光直接拉满（种植物消耗后下一帧会被锁回）
  score=0;wave=0;lastWaveT=0;sunFallT=0;
  selected=null;paused=false;won=false;gt=0;   // gameSpeed 不在此重置（2026-09-18 修复：菜单设 4x 后进关被静默清回 1x）
  plants=[];zombies=[];projectiles=[];effects=[];
  spawnQueue=[];spawnTimer=0;waveInterval=0;waveActive=false;
  spawnGateZ=null;spawnGateT=-1e9;   // FIX-01：出怪串行门随对局复位
  waveDrainedT=0;
  warn={active:false,t:0,last:0,pending:false};
  SirenLoop.stop();   // 大波警报 loop 随对局复位（防上一局遗留的 on 状态在新局继续响）
  audioQueue=[];   // 新对局丢弃上一局挂起的补播（防旧音效在新局开头一齐爆出来）
  exitArm=0;toastT=0;
  sfxGate={};
  for(let c of CARDS)cardCD[c.type]=0;
  setState('play','开始第'+levelNo+'关'+(why?' · '+why:''));
  ac();   // 用户点击启动，此时创建 AudioContext 符合浏览器自动播放策略
  updateBGM();   // 进 play 即起 BGM（上下文刚创建时此调用是 no-op，首帧 flush 后由下方兜底）
}

// ============ 波次 ============
// 波次生成：用队列逐个放出，不是一次性全刷
let spawnQueue=[];      // 待生成的僵尸队列
let spawnTimer=0;       // 生成倒计时
let waveInterval=0;     // 波次间隔倒计时
let waveActive=false;   // 当前是否在生成中
let waveDrainedT=0;     // 上一波最后一只放出的时刻（清场门槛/兜底计时的基准，2026-09-16）
// v1.3-M4 FIX-01 v2（口径修订 2026-09-19 20:52）：L1/L2（levelNo 1–2，1-based）全波次出怪串行门（用户裁决：
// 教学关降并发）。规则：上一只入场僵尸还活着且距其入场 <10s → 跳过本次放出（不耗队列、不算波进度）；
// 死了 → 立即放行；≥10s → 放行兜底防僵死。L3/L4/L5（levelNo≥3）不适用，节奏逐字节原样。
let spawnGateZ=null;    // 最近入场的僵尸引用（killZombie 会置 dead，引用仍可判活）
let spawnGateT=-1e9;    // 最近入场的 gt 时刻
// 大波预警：active=横幅显示中，t=剩余秒数，last=已预警过的波次号，
// pending=倒计时已结束但还在等场上清空（横幅此时已隐藏，只等刷怪时机，2026-09-16 拆分）
let warn={active:false,t:0,last:0,pending:false};

function newWave(n){
  const cfg=level.waves[n-1];
  if(!cfg)return;
  const mult=DIFFS[DIFF].mult, speed=DIFFS[DIFF].speed;
  const STATS={
    normal:[180,16],
    cone:[340,15],
    fast:[140,45],
    bucket:[560,12]
  };
  // 把关卡配置的 spawns 展开成待生成列表，再打乱顺序
  const list=[];
  for(const [type,cnt] of cfg.spawns){
    for(let i=0;i<cnt;i++)list.push(type);
  }
  for(let i=list.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [list[i],list[j]]=[list[j],list[i]];
  }
  spawnQueue=[];
  for(const type of list){
    const s=STATS[type];
    spawnQueue.push({
      type,row:Math.floor(Math.random()*ROWS),
      hp:s[0]*mult,maxHp:s[0]*mult,
      spd:s[1]*speed*R(0.92,1.08),
      eating:false,eatAnim:0,walk:R(0,10),dead:false
    });
  }
  spawnTimer=0;
  waveInterval=cfg.interval;
  waveActive=true;
  waveDrainedT=gt;      // 兜底计时基准：本波开始放怪的时刻
  SFX.wave();
}

// 从队列中逐个放出僵尸
function processSpawnQueue(dt){
  if(!waveActive||spawnQueue.length===0)return;
  // v1.3-M4 FIX-01 v2：L1/L2 全波次出怪串行门（gating=levelNo∈{1,2}，1-based；L3/L4/L5 走原路径逐字节原样）。
  // 门开条件：无前一只（spawnGateZ=null）/ 前一只已死（killZombie 置 dead，引用仍在）/ 距前一只入场 ≥10s（兜底防僵死）。
  // 门没开 → 本帧 return：队列不耗、不算波进度，下一帧重查（前一只死后下一帧即放行，符合「死了立即放行」）。
  // 门内不走 spawnTimer 节奏（10s 门距本身即节奏；避免旧倒计时把「死亡放行」拖过 10s）。
  if(levelNo===1||levelNo===2){
    if(spawnGateZ!==null&&!spawnGateZ.dead&&gt-spawnGateT<10)return;
    spawnGateZ=spawnQueue[0];spawnGateT=gt;   // 记本帧入场者，作为门内下一只的基准
  }else{
    spawnTimer-=dt;
    if(spawnTimer>0)return;
    // 间隔下限 2.5s（2026-09-16 放宽：原 1.5s 并发太密），队列剩得多时再 +0.5s/只 喘息
    spawnTimer=Math.max(2.5,waveInterval)+(spawnQueue.length>6?0.5:0);
  }
  // 并发数量
  const n=Math.min(spawnQueue.length, spawnQueue[0].concurrent||1);
  for(let i=0;i<n;i++){
    const z=spawnQueue.shift();
    z.x=canvas.width-40+R(0,60)+i*70;
    zombies.push(z);
  }
  if(spawnQueue.length===0){waveActive=false;waveDrainedT=gt}   // 队列放完 → 记时刻（供清场门槛/兜底用）
}

// ============ 更新 ============
function update(dt){
  // F-04：震动/闪光计时递减（放 update 避免帧率耦合，蓝图 §1 推荐）
  if (screenShake.t > 0) screenShake.t -= dt;
  if (flashT > 0) flashT -= dt;
  if(testMode&&state==='play')sun=9999;   // 测试模式阳光锁：种植物扣掉的下一帧立即回满
  // effects：阳光 + 粒子统一处理
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];
      if(e.kind==='sun'){
        if(e.y<e.targetY){
          e.y=Math.min(e.targetY,e.y+e.fall*dt*60);
          e.x+=Math.sin(e.t*3)*30*dt;
        }else{
          e.stayT=(e.stayT||0)+dt;
          if(e.stayT>8)e.dead=true;
        }
        e.t+=dt;
      }else if(e.kind==='particle'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=400*dt;e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='corpse-part'){   // F-02 死亡零件（蓝图 §3）：重力 900 比粒子重，体现厚重感
      e.vy+=900*dt;
      e.x+=e.vx*dt;
      e.y+=e.vy*dt;
      e.rot+=e.omega*dt;
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='shockwave'){   // F-03 冲击波环（蓝图 §4）
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }else if(e.kind==='boom'){
      e.life-=dt;
      if(e.life<=0)e.dead=true;
    }
  }
  effects=effects.filter(e=>!e.dead);

  // 卡片冷却递减（关键修复：之前漏了这一步，导致种过一次后卡片永久灰）
  // B2：冷却归零当帧报"就绪"（§B2 · P0）——卡片由灰转彩原本完全无声，玩家经常错过
  for(const c of CARDS){
    if(cardCD[c.type]>0){
      cardCD[c.type]=Math.max(0,cardCD[c.type]-dt);
      if(cardCD[c.type]===0)SFX.cardReady(c.type);
    }
  }

  for(const p of plants)updatePlant(p,dt);
  processSpawnQueue(dt);
  updateProjectiles(dt);
  updateZombies(dt);
  checkWave(dt);
}

function updatePlant(p,dt){
  if(p.cd>0)p.cd-=dt;
  const pos=gridToPos(p.col,p.row);
  if(p.type==='sunflower'){
    p.sunT-=dt;
    if(p.sunT<=0){
      p.sunT=20;
      effects.push({kind:'sun',x:pos.x+R(-10,10),y:pos.y-8,targetY:pos.y+CELL_H*0.35,fall:22,value:25,t:0,dead:false});
      SFX.sunDrop();   // B3：阳光生成提示音（§B3 · P0）
    }
  }else if(p.type==='pea'||p.type==='double'||p.type==='melon'){
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=p.type==='double'?1.5:p.type==='melon'?3.2:1.6;
      const dmg=p.type==='double'?18:p.type==='melon'?65:20;
      // v1.3-M4 FIX-01：直线弹发射时快照「行 flat 基线（不含 lift）+ 偏移」，贴坡重算交给 updateProjectiles 每帧做。
      // 老关 flatY==pos.y 且 liftX≡0 ⇒ 行为零变化；cabbage 抛物分支（下方）不经过此路径，不动（红线）。
      const flatY=GRID_Y+p.row*CELL_H+CELL_H/2;
      if(p.type==='double'){
        projectiles.push({x:pos.x+30,y:pos.y-14,flatY:flatY,yOff:14,vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false});
        projectiles.push({x:pos.x+30,y:pos.y-4, flatY:flatY,yOff:4, vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false});
      }else if(p.type==='melon'){
        projectiles.push({x:pos.x+30,y:pos.y-16,flatY:flatY,yOff:16,vx:220,dmg,row:p.row,type:'melon',splash:55,dead:false});
      }else{
        projectiles.push({x:pos.x+30,y:pos.y-8, flatY:flatY,yOff:8, vx:340,dmg,row:p.row,type:'pea',splash:0,dead:false});
      }
      if(p.type==='melon')SFX.melonThrow();   // B5：西瓜抛掷"呼"声，与下方 shoot 同帧叠层（§B5 · P1）
      SFX.shoot();
    }
  }else if(p.type==='cabbage'){
    // v1.3 屋顶投手：抛物线单目标，预测提前量解算 vy0（GDD level-5 §3.4 / 架构 §2.3 修订案，移动目标接近必中）
    if(p.cd<=0&&hasZombieAhead(p)){
      p.cd=2.0;
      // 目标选取：同行、在发射格右缘之前的最左僵尸（复用 hasZombieAhead 同界 z.x>pos.x-10）
      let target=null;
      for(const z of zombies){
        if(z.dead||z.row!==p.row||z.x<=pos.x-10)continue;
        if(!target||z.x<target.x)target=z;
      }
      if(target){
        const sx=pos.x+30, sy=pos.y;                       // 发射点 = 植物格右缘
        const zy=GRID_Y+p.row*CELL_H+CELL_H/2-liftX(target.x);   // 本行基线（v1.3-M4 C2 B2/α：随目标地面列抬升；发射 y 不动，见 ADR-005）
        const tSpd=target.eating?0:target.spd;             // 啃食中视为静止目标
        const t0=Math.max(50,target.x-sx)/CABBAGE_VX;      // 初估飞行时间
        const lead=target.x-tSpd*t0;                       // 预测僵尸飞行后位置（提前量修正）
        const d=Math.max(50,lead-sx), t=d/CABBAGE_VX;      // 修正后水平距离/飞行时间
        const vy0=(zy-sy-0.5*CABBAGE_G*t*t)/t;             // 抛物解算垂向初速
        projectiles.push({x:sx,y:sy,vx:CABBAGE_VX,vy:vy0,g:CABBAGE_G,dmg:20,row:p.row,type:'cabbage',splash:0,dead:false});
        SFX.melonThrow();   // 投手抛掷复用西瓜"呼"声（零新 SFX 键，总线 56/56 维持）；不调 SFX.shoot
      }
    }
  }else if(p.type==='mine'){
    // 地瓜：埋雷期结束后武装，僵尸踩到即引爆
    if(p.armT>0){
      p.armT-=dt;
    }else{
      for(const z of zombies){
        if(z.dead||z.row!==p.row)continue;
        if(Math.abs(z.x-pos.x)<CELL_W*0.55){explodeMine(p,pos);break}
      }
    }
  }
}

// 地瓜爆炸：秒杀同排 ±54px 内的僵尸（sameCell，伤害 500）
// 范围说明（2026-09-16 校准，行为不变）：nearCell 分支保留但不产生额外命中——
//   dy 门槛 CELL_H*0.9=93.6 < 行高 CELL_H=104，相邻行恒不满足；同排时其 dx 门槛 CELL_W*0.5=45
//   又被 sameCell 的 CELL_W*0.6=54 完全包含。故实际命中范围 = 同排 ±54px。
// 跨行溅射已列为 v1.2 可选增强（会动平衡，v1.0.0 已发布行为保持不变）。
function explodeMine(p,pos){
  p._dying=true;
  const DMG=500;
  for(const z of zombies){
    if(z.dead)continue;
    const zy=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2 B3：随僵尸地面列抬升（与命中口径一致）
    const dx=Math.abs(z.x-pos.x), dy=Math.abs(zy-pos.y);
    const sameCell = z.row===p.row && dx<CELL_W*0.6;
    const nearCell = dx<CELL_W*0.5 && dy<CELL_H*0.9;   // 保留：当前不产生额外命中（见上注），勿改判定逻辑
    if(sameCell||nearCell){
      z.hp-=DMG;
      if(z.hp<=0&&!z.dead)killZombie(z);
    }
  }
  // F-03 爆炸冲击波五层时间轴（蓝图 §4）：
  // 层 2 · 冲击波环
  if (effects.length < 500)
    effects.push({kind:'shockwave',x:pos.x,y:pos.y,life:0.38,maxLife:0.38,rStart:8,rEnd:180,dead:false});
  // 层 3 · 火球（boom 扩为 450ms 三色段）
  effects.push({kind:'boom',x:pos.x,y:pos.y,life:0.45,dead:false});
  // 层 4 · 粒子（24+20+8，初速更猛）
  if (effects.length < 500){
    spawnBurst(pos.x,pos.y,'#ffb830',24);
    spawnBurst(pos.x,pos.y,'#ff6a00',20);
    for(let i=0;i<8;i++) effects.push({kind:'particle',x:pos.x,y:pos.y,vx:R(-180,180),vy:R(-260,-60),life:R(0.6,0.9),color:'#fff8a0',size:R(2,4),dead:false});
  }
  // 层 1 · 闪光 + 层 5 · 屏幕震动（与 SFX.boom 同行，视听同步）
  triggerFlash('#fff', 0.08);
  triggerShake(6, 300);
  SFX.boom();
}

function hasZombieAhead(p){
  const pos=gridToPos(p.col,p.row);
  for(const z of zombies){
    if(z.dead||z.row!==p.row)continue;
    if(z.x>pos.x-10)return true;
  }
  return false;
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    // v1.3 抛物重力分支（第一生命线）：仅 cabbage 生效，必须前置——直线弹（pea/double/melon）
    // 无 vy/g 字段，无条件积分会让 pr.y 全变 NaN 崩盘（V13-S1 §④ Step3 红线①）
    if(pr.type==='cabbage'){
      pr.y+=pr.vy*dt;
      pr.vy+=pr.g*dt;
    }else if(pr.flatY!==undefined){
      // v1.3-M4 FIX-01 贴坡：直线弹每帧按当前 x 重算 y（=行 flat 基线 − liftX(x) − 发射偏移）。
      // 屋顶 level.roof ⇒ y 随坡连续抬升，跨坡命中窗口 |zy−pr.y| ≤ yOff+8 恒 ≤32；老关 liftX≡0 ⇒ 与原直线弹逐帧等价。
      pr.y=pr.flatY-liftX(pr.x)-pr.yOff;
    }
    pr.x+=pr.vx*dt;
    if(pr.x>canvas.width+40||(pr.type==='cabbage'&&pr.y>canvas.height+40)){pr.dead=true;continue}   // 括号兜抛物下落越界，直线弹条件恒等价于原式
    for(const z of zombies){
      if(z.dead||z.row!==pr.row)continue;
      const zy=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2 B1/α：命中基线随僵尸地面列抬升（不改则平台列偏差 68>32 全 miss）
      if(Math.abs(zy-pr.y)<32&&Math.abs(z.x-pr.x)<42){
        z.hp-=pr.dmg;
        SFX.hit();
        if(pr.splash>0){
          for(const z2 of zombies){
            if(z2===z||z2.dead||z2.row!==pr.row)continue;
            if(Math.abs(z2.x-pr.x)<pr.splash)z2.hp-=pr.dmg*0.55;
          }
          spawnBurst(pr.x,zy,'orange',14);
        }else{
          spawnBurst(pr.x,zy,'#aef06a',6);
        }
        if(z.hp<=0&&!z.dead)killZombie(z);
        pr.dead=true;break;
      }
    }
  }
  projectiles=projectiles.filter(p=>!p.dead);
}

function updateZombies(dt){
  for(const z of zombies){
    if(z.dead)continue;
    z.walk+=dt*8;
    let target=null;
    for(let i=plants.length-1;i>=0;i--){   // 倒序：同格多实体（垫+上覆）先啃后种的（甲案自上而下语义，陆地单实体格等价）
      const p=plants[i];
      if(p.row!==z.row)continue;
      const pos=gridToPos(p.col,p.row);
      if(z.x-pos.x<CELL_W*0.4&&z.x-pos.x>0){target=p;break}
    }
    if(target){
      z.eating=true;z.eatAnim+=dt;
      target.dur-=65*dt;
      SFX.chomp();
      if(target.dur<=0){
        // 用标记法，避免在 for...of 中 splice
        target._dying=true;
      }
    }else{
      z.eating=false;
      z.x-=z.spd*dt;
    }
    // v1.2 入水反馈（2026-09-18 真机反馈补齐）：水域关僵尸越过草坪右缘入水瞬间 → 水花粒子 + 水色环 + 溅水声；跋涉中偶发小涟漪
    if(level.water&&WATER_ROWS.includes(z.row)){
      const shoreX=GRID_X+COLS*CELL_W;
      if(!z.splashed){
        if(z.x<=shoreX+8){
          z.splashed=true;
          const wy=GRID_Y+z.row*CELL_H+CELL_H/2+22;
          for(let i=0;i<14;i++)effects.push({kind:'particle',x:z.x+R(-6,6),y:wy+R(-8,8),vx:R(-60,140),vy:R(-300,-120),life:R(0.35,0.7),color:i%3?'#bfe3f7':'#ffffff',size:R(2,5),dead:false});
          effects.push({kind:'shockwave',x:z.x,y:wy,life:0.45,maxLife:0.45,rStart:6,rEnd:64,water:true,dead:false});
          SFX.splash();
        }
      }else if(!z.eating&&R(0,1)<dt*1.2){   // 跋涉涟漪：游戏时间约 0.8s 一次小水纹（按 dt 概率，帧率无关），不发声（防密集糊音）
        effects.push({kind:'shockwave',x:z.x,y:GRID_Y+z.row*CELL_H+CELL_H/2+24,life:0.5,maxLife:0.5,rStart:4,rEnd:26,water:true,dead:false});
      }
    }
    if(z.x<GRID_X-40){setState('end','僵尸进屋');won=false;SFX.lose();SFX.loseClimax()}   // B6：关键一击（§B6 · P1）
    if(z.hp<=0&&!z.dead)killZombie(z);
  }
  zombies=zombies.filter(z=>!z.dead);
  // 植物死亡统一清理（标记法）
  for(let i=plants.length-1;i>=0;i--){
    if(plants[i]._dying)plants.splice(i,1);
  }
}

// F-02 死亡零件（蓝图 §3）：死亡 = 血雾（保留）+ 零件爆散，§G 粒子上限双保险
function spawnCorpseParts(z){
  if (effects.length > 500) return;              // §G 粒子上限保护
  const y = GRID_Y + z.row*CELL_H + CELL_H/2 - liftX(z.x);   // v1.3-M4 C2：死亡零件基准 y 随坡连续抬升
  const skin = z.type==='bucket' ? '#4a5a5a' : '#5a6a4a';
  const parts = [
    {shape:'head',   off:[0,-18],  size:[18],        color:'#c5d0a0', w:R(-3,3)},
    {shape:'body-l', off:[-8,10],  size:[12,20],     color:skin,     w:R(-2,2)},
    {shape:'body-r', off:[8,10],   size:[12,20],     color:skin,     w:R(-2,2)},
    {shape:'legs',   off:[0,25],   size:[20,14],     color:'#3a2a1a', w:R(-1.5,1.5)},
    {shape:'arm',    off:[-16,12], size:[8,18],      color:'#c5d0a0', w:R(-3,3)},
  ];
  if (z.type==='cone')   parts.push({shape:'cone',   off:[0,-30], size:[28,22],  color:'#d97b2a', w:R(-2.5,2.5)});
  if (z.type==='bucket') parts.push({shape:'bucket', off:[0,-40], size:[32,12],  color:'#b0b0b0', w:R(-2,2)});
  for (const p of parts){
    if (effects.length > 500) break;             // 双保险
    effects.push({
      kind:'corpse-part',
      x:z.x + p.off[0], y: y + p.off[1],
      vx:R(-120,120), vy:R(-260,-140),
      rot:0, omega:p.w,
      life:R(0.9,1.4), maxLife:R(0.9,1.4),
      shape:p.shape, color:p.color, size:p.size,
      dead:false,
    });
  }
}

function killZombie(z){
  z.dead=true;
  score+=z.type==='bucket'?150:z.type==='cone'?100:z.type==='fast'?80:50;
  const y=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2：爆点 y 随坡连续抬升
  spawnBurst(z.x,y,'#c94',18);
  spawnCorpseParts(z);   // F-02：死亡零件，与 SFX.death 同函数相邻（蓝图 §3 音效对齐点）
  SFX.death(z.type);     // B4：按僵尸类型分层（路障纸板 / 铁桶金属），§B4 · P1
}

function spawnBurst(x,y,color,n){
  for(let i=0;i<n;i++){
    effects.push({kind:'particle',x,y,vx:R(-80,80),vy:R(-160,-40),life:R(0.3,0.6),color,size:R(2,5),dead:false});
  }
}

function checkWave(dt){
  sunFallT-=dt;
  if(sunFallT<=0){
    sunFallT=R(7,11);
    effects.push({kind:'sun',x:R(GRID_X+40,GRID_X+COLS*CELL_W-20),y:0,targetY:R(GRID_Y+30,GRID_Y+ROWS*CELL_H-30),fall:26,value:25,t:0,dead:false});
    SFX.sunDrop();   // B3：自然掉落同样给提示音（§B3 · P0）
  }
  // ---------- 波次推进规则（2026-09-16 二次修正）----------
  // 硬门槛：上一波队列放完 + 场上僵尸清空，才允许开下一波（杜绝「上一波还有一堆就发下一波」）
  // 最小喘息：清场太快时也要等够 minGap（第一波 12s 布防，最后两波 20s，其余 16s）
  // 兜底：队列放完 25s 仍未清场（极端情况，如僵尸正在啃坚果）→ 放行，防止对局僵死
  const minGap=wave===0?12:(wave>=level.totalWaves-2?20:16);
  const timeUp=gt-lastWaveT>=minGap;                 // 最小喘息时间已到
  const warnTimeUp=gt-lastWaveT>=8;                  // 预警最早触发时间（防止开波瞬间就报警）
  const fieldClear=zombies.length===0;               // 场上彻底清空 → 才允许开新波
  const fieldNearClear=zombies.length<=2;            // 剩 ≤2 只 → 可提前报大波
  const stallGuard=gt-waveDrainedT>=25;              // 兜底放行
  const canAdvance=wave<level.totalWaves&&!waveActive;

  if(warn.pending){
    // 倒计时已结束（横幅已隐藏），只等刷怪时机：场上清空（或兜底放行）→ 正式放出大波
    if(fieldClear||stallGuard){
      warn.pending=false;
      lastWaveT=gt;wave++;
      newWave(wave);
      triggerShake(5,400);triggerFlash('rgba(255,30,30,0.2)',0.15);SFX.bigWaveImpact();   // 视听同步（audio B7）
    }
  }else if(warn.active){
    // 预警横幅显示中：倒计时归零 → 横幅立即消失（不再等场上清空，避免横幅长时间残留）
    warn.t-=dt;
    SirenLoop.tick(dt);   // audio §C：预警窗口内重复警报轮次，把 2 秒填满
    if(warn.t<=0){ warn.t=0; warn.active=false; warn.pending=true; SirenLoop.stop() }
  }else if(canAdvance){
    const next=wave+1;
    const nextCfg=level.waves[wave];   // 下一波的配置（下标 = 当前 wave）
    if(nextCfg&&nextCfg.big&&warn.last!==next&&warnTimeUp&&fieldNearClear){
      // 大波：上一波快清完（剩 ≤2 只）就先播预警，不立即生成
      warn.last=next;
      warn.active=true;
      warn.t=WARN_TOTAL;
      SirenLoop.start();   // audio §C：警报 loop 与横幅同起（WARN_TOTAL=2s ≈ 4 轮）
      toast('一大波僵尸正在逼近！',WARN_TOTAL);
      triggerShake(3,500);triggerFlash('rgba(255,30,30,0.35)',0.3);   // 视听同步
    }else if(fieldClear?timeUp:stallGuard){
      lastWaveT=gt;wave++;
      newWave(wave);
    }
  }

  // 通关判定：最后一波已放完 + 队列空 + 场上无僵尸
  if(state==='play'&&wave>=level.totalWaves&&!waveActive&&spawnQueue.length===0&&zombies.length===0){
    setState('end','通关');won=true;
    if(levelNo+1<=Object.keys(LEVELS).length){
      unlockedLevel=Math.max(unlockedLevel,levelNo+1);
      try{localStorage.setItem('pvz_unlocked',unlockedLevel)}catch(e){}
    }
    SFX.win();   // 结束画面不做屏幕震动（用户偏好 2026-09-16）
  }
}

// ============ 屏幕震动（F-04 · B.4，feel-impl-skeleton §1） ============
let screenShake = { t: 0, dur: 0, intensity: 0, seed: 0 };
let flashT = 0, flashColor = '#fff';   // 闪光层，F-03/F-06 共用
let loseShakeUsed = false;             // 失败进屋 8px 特例：仅一次（蓝图 §1 注·方案 A：clamp 内放行）

function triggerShake(intensity, duration_ms){
  // §G 约束：单次幅度 ≤ 6px；失败进屋特例 intensity===8 仅放行一次
  screenShake.t = duration_ms / 1000;
  screenShake.dur = duration_ms / 1000;
  if (intensity === 8 && !loseShakeUsed){ loseShakeUsed = true; }
  else { intensity = Math.min(intensity, 6); }
  screenShake.intensity = intensity;
  screenShake.seed = Math.random() * 1000;
}

function triggerFlash(color, duration_s){
  flashColor = color; flashT = duration_s;
}

function getShakeOffset(){
  if (screenShake.t <= 0) return { x: 0, y: 0 };
  const k = 1 - screenShake.t / screenShake.dur;      // 0→1
  const decay = (1 - k) * (1 - k);                     // 二次衰减
  const t = performance.now() / 1000 + screenShake.seed;
  return {
    x: Math.sin(t * 55) * screenShake.intensity * decay,
    y: Math.cos(t * 47) * screenShake.intensity * decay * 0.7,
  };
}

// ============ 渲染 ============
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const off = getShakeOffset();
  ctx.save();
  ctx.translate(off.x, off.y);
  if(state==='menu'){drawMenu();ctx.restore();return}
  drawGameWorld();
  if(state==='end'){drawEnd();ctx.restore();return}
  drawCardBar();
  drawStatus();
  if(warn.active)drawWaveWarn();
  if(paused)drawPause();
  ctx.restore();   // 世界层结束
  // 闪光层（restore 之后画，不随震动偏移）
  if (flashT > 0){
    ctx.save();
    ctx.globalAlpha = 0.4 * Math.max(0, flashT / 0.08);
    ctx.fillStyle = flashColor;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
  }
}

// 「一大波僵尸即将来临」预警横幅
const WARN_TOTAL=2;   // 大波预警时长（秒）· 4s→3s→2s（用户 2026-09-16 两次要求缩短）
function drawWaveWarn(){
  const remaining = Math.max(0, warn.t);
  const inFinal1 = remaining < 1.0;                    // F-06 最后 1 秒视觉增强区（蓝图 §5）
  const pulseSpeed = inFinal1 ? 22 : 11;               // 最后 1 秒脉冲频率加倍
  const pulse=0.5+0.5*Math.sin(gt*pulseSpeed);       // 0..1 闪烁
  const y=306;
  ctx.save();
  // 全屏红色氛围压暗
  ctx.fillStyle='rgba(140,0,0,'+(0.10+0.10*pulse)+')';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 横幅底色
  const g=ctx.createLinearGradient(0,y-72,0,y+72);
  g.addColorStop(0,'rgba(120,0,0,0)');
  g.addColorStop(0.5,'rgba(150,10,0,'+(0.62+0.18*pulse)+')');
  g.addColorStop(1,'rgba(120,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,y-72,canvas.width,144);
  // 上下描边
  ctx.fillStyle='rgba(255,80,50,'+(0.5+0.5*pulse)+')';
  ctx.fillRect(0,y-60,canvas.width,3);
  ctx.fillRect(0,y+57,canvas.width,3);
  // 主标题
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 48px "Microsoft YaHei"';
  ctx.lineWidth=7;ctx.strokeStyle='#2a0000';
  ctx.strokeText('一大波僵尸即将来临！',canvas.width/2,y-8);
  const r=Math.round(200+55*pulse);
  ctx.fillStyle='rgb('+r+','+Math.round(60+80*pulse)+',40)';
  ctx.fillText('一大波僵尸即将来临！',canvas.width/2,y-8);
  // 副标题
  ctx.font='bold 15px "Microsoft YaHei"';
  ctx.fillStyle='#ffd54a';
  ctx.fillText('A HUGE WAVE OF ZOMBIES IS APPROACHING',canvas.width/2,y+28);
  ctx.font='bold 13px "Microsoft YaHei"';
  ctx.fillStyle='rgba(255,220,180,0.9)';
  ctx.fillText('立即布防 · 即将进攻 '+remaining.toFixed(1)+'s',canvas.width/2,y+50);
  // 倒计时进度条（D-11：圆角化）
  const bw=320,bx=(canvas.width-bw)/2,by=y+62;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  rr(bx,by,bw,5,2);ctx.fill();
  ctx.fillStyle='#ff6a3a';
  rr(bx,by,Math.max(bw*(remaining/WARN_TOTAL),5),5,2);ctx.fill();
  // F-06 最后 1 秒：边缘渐红 vignette（蓝图 §5）
  if (inFinal1){
    ctx.save();
    const v = ctx.createRadialGradient(canvas.width/2,canvas.height/2,300,
                                       canvas.width/2,canvas.height/2,700);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,`rgba(120,0,0,${0.4+0.2*pulse})`);
    ctx.fillStyle = v;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
    // 倒计时数字放大 + 等宽（D-14 同源字体栈）
    ctx.save();
    ctx.font = 'bold 32px Consolas, monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = `rgb(255,${Math.round(100+50*pulse)},${Math.round(100+50*pulse)})`;
    ctx.fillText(remaining.toFixed(1), canvas.width/2, 380);
    ctx.restore();
  }
  ctx.restore();
  // F-06 周期性轻震：用 warn.t（游戏时钟）模运算，暂停不震、与游戏节奏一致（蓝图 §5 注）
  if (!inFinal1 && (warn.t*1000)%500 < 16) triggerShake(1.5, 150);
  if (inFinal1 && (warn.t*1000)%200 < 16)  triggerShake(2, 100);
}

function drawGameWorld(){
  const lawn=level.lawn||['#88c250','#77b042'];
  // v1.3-M3 手段①：天空带（仅 roof 关；覆盖顶部裸露 CSS 绿底，棋盘随后覆盖 y∈[80,90] 形成地平线）
  if(level.roof){
    const SKY_H=90;
    const sg=ctx.createLinearGradient(0,0,0,SKY_H);
    sg.addColorStop(0,'#cfe8f2');        // 顶：亮
    sg.addColorStop(1,'#8fc0dd');        // 地平线：主蓝
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,canvas.width,SKY_H);
    // 扁平白云（静态；2 组，避开城垛带 68–80）
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.ellipse(150,32,34,16,0,0,Math.PI*2);
    ctx.ellipse(180,28,24,13,0,0,Math.PI*2);
    ctx.ellipse(120,30,22,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.78)';
    ctx.beginPath();
    ctx.ellipse(720,22,30,14,0,0,Math.PI*2);
    ctx.ellipse(748,25,20,11,0,0,Math.PI*2);
    ctx.fill();
    // HUD 可读性护罩（R1：右上角压暗，位于 drawStatus 文字之下）
    const sc=ctx.createLinearGradient(canvas.width*0.56,0,canvas.width,0);
    sc.addColorStop(0,'rgba(0,0,0,0)');
    sc.addColorStop(1,'rgba(0,0,0,0.52)');
    ctx.fillStyle=sc;
    ctx.fillRect(canvas.width*0.40,0,canvas.width*0.60,56);
    ctx.fillStyle='rgba(0,0,0,0.18)';                  // 统一底色，避免渐变左端文字发飘
    ctx.fillRect(canvas.width*0.40,0,canvas.width*0.16,56);
  }
  // 棋盘
  // v1.3 屋顶底衬（09-20 验收反馈：斜坡接壤处透绿底显得歪）：斜坡列平行四边形斜边经抗锯齿拼合
  // 只半透明覆盖，缝隙露出画布 CSS 绿底 → 先整块铺屋面剪影（屋脊轮廓→y=600）砖瓦底色，
  // 任何格缝/坡台交界/坡底檐板交界露出的都是砖瓦棕而非绿。仅 roof 关渲染，老关零触碰。
  if(level.roof){
    ctx.fillStyle='#7a6a50';
    ctx.beginPath();
    ctx.moveTo(GRID_X,GRID_Y-liftX(GRID_X));
    ctx.lineTo(GRID_X+ROOF_COLS*CELL_W,GRID_Y-liftX(GRID_X+ROOF_COLS*CELL_W));
    ctx.lineTo(GRID_X+COLS*CELL_W,GRID_Y-liftX(GRID_X+COLS*CELL_W));
    ctx.lineTo(GRID_X+COLS*CELL_W,GRID_Y+ROWS*CELL_H);
    ctx.lineTo(GRID_X,GRID_Y+ROWS*CELL_H);
    ctx.closePath();ctx.fill();
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=GRID_X+c*CELL_W,y=GRID_Y+r*CELL_H;
    ctx.fillStyle=((c+r)%2===0)?lawn[0]:lawn[1];
    if(level.roof&&c<ROOF_COLS){                       // v1.3-M4 C2：斜坡列 → 平行四边形（左右竖边 + 沿坡斜顶/底）
      const x1=x+CELL_W,yb=y+CELL_H;
      ctx.beginPath();
      ctx.moveTo(x,y-liftX(x));    ctx.lineTo(x1,y-liftX(x1));
      ctx.lineTo(x1,yb-liftX(x1)); ctx.lineTo(x,yb-liftX(x));
      ctx.closePath();ctx.fill();
    }else{
      ctx.fillRect(x,y-liftX(x+CELL_W/2),CELL_W,CELL_H);   // 平台列=常数抬升；老关 liftX=0 → 逐字节等价今日
    }
  }
  // v1.2 泳池水面（仅水域关渲染；GDD M3：纹理/波纹为先、色相为辅；置于滤镜前使 dusk/night 不叠加水面）
  if(level.water){
    for(const r of WATER_ROWS){
      const y=GRID_Y+r*CELL_H;
      const wGrad=ctx.createLinearGradient(GRID_X,y,GRID_X,y+CELL_H);
      wGrad.addColorStop(0,'#3f7fae');wGrad.addColorStop(0.5,'#4a90c2');wGrad.addColorStop(1,'#3f7fae');
      ctx.fillStyle=wGrad;
      ctx.fillRect(GRID_X,y,COLS*CELL_W,CELL_H);
      // 相位波纹：读全局时钟 gt，暂停自动冻结（ADR-002 语义白送）；竖波纹线区分于陆地棋盘格
      ctx.strokeStyle='rgba(255,255,255,0.16)';
      ctx.lineWidth=2;
      for(let c=0;c<COLS;c++){
        const ph=Math.sin((gt||0)*1.6+c*0.9+r*2.1);
        const wx=GRID_X+c*CELL_W+CELL_W/2+ph*10;
        const wy=y+CELL_H/2;
        ctx.beginPath();
        ctx.moveTo(wx-22,wy+ph*6);
        ctx.quadraticCurveTo(wx,wy-8-ph*4,wx+22,wy+ph*6);
        ctx.stroke();
      }
      // 水陆交界亮边，强化行级可读性
      ctx.fillStyle='rgba(255,255,255,0.20)';
      ctx.fillRect(GRID_X,y,COLS*CELL_W,2);
      ctx.fillRect(GRID_X,y+CELL_H-2,COLS*CELL_W,2);
    }
  }
  // v1.3-M4 C2 屋顶皮肤（仅 roof 关渲染；shear 口径：每个「平面 y」替换为「平面 y − liftX(x)」）。
  // 与 M3「行带整体旋转」口径不同：本口径下砖缝严格贴平行四边形格边界（C2 关键红线：不许错位）。
  if(level.roof){
    const rt=GRID_Y-ROOF_LIFT_H;                             // 屋面顶边最高处（col4/平台顶 = GRID_Y−H = 20）
    const xSlope=GRID_X+ROOF_COLS*CELL_W;                    // 斜坡／平台分界 x = 55+450 = 505
    const xEnd=GRID_X+COLS*CELL_W, yB=GRID_Y+ROWS*CELL_H;    // 屋面右缘 865 / 底锚 600
    // 「平面 y=base」经 liftX 抬升后的折线轮廓（斜坡段随坡斜、平台段水平；liftX 分段线性，3 点足够）
    const profile=(base)=>{ctx.beginPath();ctx.moveTo(GRID_X,base-liftX(GRID_X));
      ctx.lineTo(xSlope,base-liftX(xSlope));ctx.lineTo(xEnd,base-liftX(xEnd));};
    // 「平面 y∈[y0,y0+h]」经 liftX 抬升后的 6 点闭合多边形（shear 矩形；供瓦带填充）
    const shearRect=(y0,h)=>{ctx.beginPath();
      ctx.moveTo(GRID_X,y0-liftX(GRID_X));      ctx.lineTo(xSlope,y0-liftX(xSlope));      ctx.lineTo(xEnd,y0-liftX(xEnd));
      ctx.lineTo(xEnd,y0+h-liftX(xEnd));        ctx.lineTo(xSlope,y0+h-liftX(xSlope));    ctx.lineTo(GRID_X,y0+h-liftX(GRID_X));
      ctx.closePath();};
    ctx.save();
    ctx.beginPath();profile(GRID_Y);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.clip();  // 裁到屋面；上沿抬到 GRID_Y−H（否则抬升部被裁）
    // 斜向瓦片行带（shear 主信号：平面横带经 liftX 斜切 → 沿坡爬升；平台段 liftX 恒值 = 水平带）
    const BAND=26;
    for(let k=0;k*BAND<ROWS*CELL_H+BAND;k++){
      const yL=GRID_Y+k*BAND;
      ctx.fillStyle=(k%2===0)?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)';
      shearRect(yL,BAND);ctx.fill();
      if(k>0){                                          // 行带间缝（沿坡斜线）
        ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=2;
        profile(yL);ctx.stroke();
      }
      // ▲补偿①：斜坡段每行内增补一条半缝（斜缝条数 ×2，用纹理密度补 7.6° 的偏缓读数）
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(GRID_X,yL+BAND/2);ctx.lineTo(xSlope,yL+BAND/2-ROOF_LIFT_H);ctx.stroke();
    }
    // 瓦列竖缝（C2：竖直贴列边界，每行错半格；由顶边 GY−lift 到坡底 BY−lift）
    ctx.strokeStyle='rgba(0,0,0,0.20)';ctx.lineWidth=2;
    for(let r=0;r<ROWS;r++){
      const off=(r%2)*(CELL_W/2);
      const yT=GRID_Y+r*CELL_H, yB2=GRID_Y+(r+1)*CELL_H;
      for(let c=0;c<COLS;c++){
        const xT=GRID_X+c*CELL_W+off;
        if(xT>=xEnd)break;
        ctx.beginPath();ctx.moveTo(xT,yT-liftX(xT));ctx.lineTo(xT,yB2-liftX(xT));ctx.stroke();
      }
    }
    ctx.restore();
    // 檐板补厚 #463b2b（v1.3-M4 新插）：斜底边 → 固定 y=600，补出屋面厚度；底边统一停 y=600（不露 CSS 绿底）
    ctx.fillStyle='#463b2b';
    profile(yB);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,235,190,0.22)';ctx.lineWidth=2;   // 檐板顶沿高光（沿轮廓）
    profile(yB);ctx.stroke();
    // 方向光渐变（v1.3-M4 ▲补偿②：沿坡明暗加强 —— 左上更亮 / 右下更暗，强化坡向读感；不染城垛）
    ctx.save();
    ctx.beginPath();profile(GRID_Y);ctx.lineTo(xEnd,yB);ctx.lineTo(GRID_X,yB);ctx.closePath();ctx.clip();
    const lg=ctx.createLinearGradient(GRID_X,rt,xEnd,yB);
    lg.addColorStop(0,'rgba(255,240,210,0.13)');        // ▲补偿②：0.10 → 0.13（左上更亮）
    lg.addColorStop(1,'rgba(40,20,0,0.24)');            // ▲补偿②：0.18 → 0.24（右下更暗）
    ctx.fillStyle=lg;
    ctx.fillRect(GRID_X,rt,COLS*CELL_W,ROWS*CELL_H+ROOF_LIFT_H);
    ctx.restore();
    // 屋脊压条（女儿墙底座，连成整条；▲补偿③：斜坡段 8→10px 加粗、平台段维持 8px）
    ctx.strokeStyle='#5a4a36';ctx.lineJoin='round';
    ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(GRID_X,GRID_Y);ctx.lineTo(xSlope,rt);ctx.stroke();   // 斜坡段 10px
    ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(xSlope,rt);ctx.lineTo(xEnd,rt);ctx.stroke();          // 平台段 8px
    // 屋脊城垛（v1.3-M4 C2：底边贴屋脊轮廓 y=GRID_Y−liftX(x) → 5 列斜段 + 4 列水平段）
    const MERLON_W=CELL_W*0.5, MERLON_H=12;            // 45×12，每列 1 merlon（定稿 = 源码现值，美术草图 14 仅示意）
    ctx.fillStyle='#6a5a44';                            // 深灰棕：可辨于天空、暗于砖面
    for(let c=0;c<COLS;c++){
      const x0=GRID_X+c*CELL_W, x1=x0+MERLON_W;
      const yT0=GRID_Y-liftX(x0), yT1=GRID_Y-liftX(x1);
      ctx.beginPath();
      ctx.moveTo(x0,yT0);ctx.lineTo(x1,yT1);
      ctx.lineTo(x1,yT1-MERLON_H);ctx.lineTo(x0,yT0-MERLON_H);
      ctx.closePath();ctx.fill();
    }
  }
  // 黄昏滤镜（第二关）
  if(level.dusk){
    const g=ctx.createLinearGradient(GRID_X,GRID_Y,GRID_X,GRID_Y+ROWS*CELL_H);
    g.addColorStop(0,'rgba(255,150,60,0.28)');
    g.addColorStop(0.55,'rgba(255,110,40,0.16)');
    g.addColorStop(1,'rgba(120,60,120,0.24)');
    ctx.fillStyle=g;
    ctx.fillRect(GRID_X,GRID_Y,COLS*CELL_W,ROWS*CELL_H);
  }
  // 月夜滤镜（第三关，V11-08）：冷蓝压暗，与 dusk 互斥开关，保证僵尸/植物剪影清晰
  if(level.night){
    const g=ctx.createLinearGradient(GRID_X,GRID_Y,GRID_X,GRID_Y+ROWS*CELL_H);
    g.addColorStop(0,'rgba(40,60,140,0.30)');
    g.addColorStop(0.55,'rgba(20,40,110,0.14)');
    g.addColorStop(1,'rgba(10,20,60,0.32)');
    ctx.fillStyle=g;
    ctx.fillRect(GRID_X,GRID_Y,COLS*CELL_W,ROWS*CELL_H);
  }
  // 右侧道路（v1.3-M3 C8：屋顶关改灰棕檐沟色，消除「另一块平地」误读；roof-gate 不影响老关）
  // v1.3-M4 C2：屋顶关檐沟顶随平台抬升到 GRID_Y−ROOF_LIFT_H（与平台同高，避免平台右上露天空缝）；老关恒 GRID_Y ⇒ 逐字节等价
  const gutterTop=level.roof?GRID_Y-ROOF_LIFT_H:GRID_Y;
  ctx.fillStyle=level.roof?'#5a5248':'#5a3a22';
  ctx.fillRect(GRID_X+COLS*CELL_W,gutterTop,ROAD_W,GRID_Y+ROWS*CELL_H-gutterTop);
  if(!level.roof){
    ctx.fillStyle='#6a4228';
    for(let r=0;r<ROWS;r++){
      ctx.fillRect(GRID_X+COLS*CELL_W,GRID_Y+r*CELL_H,ROAD_W,2);
      ctx.fillRect(GRID_X+COLS*CELL_W,GRID_Y+r*CELL_H+CELL_H-2,ROAD_W,2);
    }
  }
  // 房子
  ctx.fillStyle='#3a2418';ctx.fillRect(0,GRID_Y,GRID_X,ROWS*CELL_H);
  ctx.fillStyle='#5a3a22';ctx.fillRect(4,GRID_Y+8,GRID_X-8,ROWS*CELL_H-16);
  ctx.fillStyle='#8b6f4a';
  for(let r=0;r<ROWS;r++){
    ctx.fillRect(10,GRID_Y+r*CELL_H+16,GRID_X-16,26);
  }
  ctx.fillStyle='#c9a34a';
  for(let r=0;r<ROWS;r++){
    ctx.fillRect(GRID_X-16,GRID_Y+r*CELL_H+22,3,14);
  }
  // 【檐口斜边剪影（M3 手段④b 左右楔形）已移除（09-20 用户二轮验收反馈）】：
  // 楔形 #7a6a4c 在「房子|屋面」「屋面|道路」接缝处形成第三方色窄条，读作「接壤处未填充」+ 楔形收窄感=歪；
  // 坡度读感已由 C2 斜瓦带/逐列抬升承载，楔形冗余。删除后 house|roof / roof|road 均为同高直角 crisp 接缝。
  // 种植/铲除预览
  if(selected&&lastMouseInGrid&&state==='play'&&!paused){
    const gx=lastMouseGrid.x,gy=lastMouseGrid.y;
    const x=GRID_X+gx*CELL_W,y=GRID_Y+gy*CELL_H;
    const lc=liftX(x+CELL_W/2);                        // 格心抬升（老关恒 0 ⇒ 逐字节等价今日）
    const strokeCell=(lw)=>{                           // v1.3-M4 C2：斜坡格 → 平行四边形预览（与落格形状一致）；平台/老关 → 矩形
      ctx.lineWidth=lw;
      if(level.roof&&gx<ROOF_COLS){
        const x1=x+CELL_W,yb=y+CELL_H;
        ctx.beginPath();
        ctx.moveTo(x+2,y+2-liftX(x));   ctx.lineTo(x1-2,y+2-liftX(x1));
        ctx.lineTo(x1-2,yb-2-liftX(x1));ctx.lineTo(x+2,yb-2-liftX(x));
        ctx.closePath();ctx.stroke();
      }else{
        ctx.strokeRect(x+2,y+2-lc,CELL_W-4,CELL_H-4);
      }
    };
    if(selected.shovel){
      const has=plants.some(p=>p.col===gx&&p.row===gy);
      ctx.strokeStyle=has?'rgba(255,90,90,0.95)':'rgba(255,255,255,0.35)';
      strokeCell(3);
      if(has)drawShovelIcon(x+CELL_W/2,y+CELL_H/2-lc,1.1);
    }else{
      ctx.strokeStyle='rgba(255,255,255,0.8)';
      strokeCell(2);
    }
  }
  // 植物
  for(const p of plants)drawPlant(p);
  // 僵尸
  for(const z of zombies)drawZombie(z);
  // 子弹
  for(const pr of projectiles)drawProjectile(pr);
  // 粒子 / 阳光 / 爆炸
  for(const e of effects){
    if(e.kind==='sun')drawSun(e);
    else if(e.kind==='particle')drawParticle(e);
    else if(e.kind==='corpse-part')drawCorpsePart(e);
    else if(e.kind==='shockwave')drawShockwave(e);
    else if(e.kind==='boom')drawBoom(e);
  }
}

// F-02 死亡零件绘制（蓝图 §3）：head 带眼睛，其余为矩形；末 300ms 淡出
function drawCorpsePart(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot);
  ctx.globalAlpha = Math.max(0, Math.min(1, e.life / 0.3));   // 末 300ms 淡出
  ctx.fillStyle = e.color;
  if (e.shape === 'head'){
    ctx.beginPath(); ctx.arc(0,0,e.size[0],0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5,-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,-2,2,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillRect(-e.size[0]/2, -e.size[1]/2, e.size[0], e.size[1]);
  }
  ctx.restore();
}

// 铲子图标（供铲子槽 / 光标预览复用）
function drawShovelIcon(x,y,s){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  // 木柄
  ctx.strokeStyle='#8b5a2a';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,4);ctx.stroke();
  // 握把
  ctx.strokeStyle='#6a4228';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-5,-17);ctx.lineTo(5,-17);ctx.stroke();
  // 铲头
  ctx.fillStyle='#b8bec4';
  ctx.beginPath();
  ctx.moveTo(-8,4);ctx.lineTo(8,4);ctx.lineTo(7,13);
  ctx.quadraticCurveTo(0,19,-7,13);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#8f959b';
  ctx.fillRect(-8,4,16,3);
  ctx.restore();
}

// v1.3 修复（用户反馈 2026-09-20「植物视觉上遮住了花盆」）：盆上植物整体上移 POT_LIFT px、
// 花盆自身下沉 POT_SINK px 落到格底——错位后盆口沿/盆身/盆底全部可见，植物底缘正好立在盆口，还原"种在盆里"的层次。
// 几何：豌豆底 y+30 == 盆口中心 y-10+16-22（lift-sink 后对齐）；非盆路径 lift=0 零感知。
// 纯渲染层偏移：不碰 gridToPos/种植/碰撞/子弹等任何逻辑坐标（onPot 每帧全量扫 plants，量级 ≤45 无需缓存）。
const POT_LIFT=16, POT_SINK=22;
const onPot=p=>p.type!=='planter'&&plants.some(q=>q.type==='planter'&&q.col===p.col&&q.row===p.row);

function drawPlant(p, dtRef){
  // F-01 种植动画（蓝图 §2）：620ms 三段时间轴（A 飞向格子 → C 缩放过冲 → E 落定微抖）
  const lift=onPot(p)?POT_LIFT:0;   // 盆上植物：落点从格心改到盆口
  if (p.plantT === undefined){ p.plantT=620; p.plantDone=true; }   // 旧对象兜底：直接视为已落地
  if (!p.plantDone && p.plantT < 620){
    p.plantT += (dtRef !== undefined ? dtRef : lastDt) * 1000;
    const t = Math.min(1, p.plantT / 620);
    const pos = gridToPos(p.col, p.row);
    pos.y -= lift;
    let x=pos.x, y=pos.y, s=1;
    if (t < 0.35){                              // A · 飞向格子
      const k = Easing.easeInOut(t / 0.35);
      x = p.plantFrom.x + (pos.x - p.plantFrom.x)*k;
      y = p.plantFrom.y + (pos.y - p.plantFrom.y)*k - Math.sin(k*Math.PI)*80;
      s = 0.6 + 0.4*k;
    } else if (t < 0.78){                        // C · 缩放过冲
      s = 1.0 + Math.sin((t-0.35)/0.43*Math.PI*2)*0.15*(1-(t-0.35)/0.43);
      y = pos.y - Math.max(0,(0.55-t)/0.2*8);
    } else if (t < 1){                            // E · 落定微抖
      s = 1.0;
      y = pos.y + Math.sin(t*20)*2*(1-t);
    }
    ctx.save();
    ctx.translate(x,y); ctx.scale(s,s); ctx.translate(-x,-y);
    drawPlantInner(p, x, y);
    ctx.restore();
    if (p.plantT >= 620) p.plantDone = true;
    return;
  }
  // 落地尘土（一次性，A→B 交界处 220-280ms 喷 8 粒 #8b6528，§G 粒子上限守卫）
  if (p.plantT >= 220 && !p.dirtDone && p.plantT < 280){
    p.dirtDone = true;
    if (effects.length < 500){
      const pos = gridToPos(p.col,p.row);
      for(let i=0;i<8;i++) effects.push({kind:'particle',x:pos.x,y:pos.y+18,
        vx:R(-30,30),vy:R(-80,-40),life:R(0.3,0.5),color:'#8b6528',size:R(2,4),dead:false});
    }
  }
  const p2=gridToPos(p.col,p.row);
  drawPlantInner(p, p2.x, p2.y-lift);
}

// 原 drawPlant 绘制主体（阴影/各类型/血条），签名改为 (p, x, y) 以支持种植动画缩放平移
function drawPlantInner(p, x, y){
  // 阴影：盆上植物阴影不随植物上移（否则浮在盆身上），而是画到盆底地面 y=POT_LIFT-POT_SINK 处，
  // 与花盆盆底对齐，形成"植物立在盆上、影子落在地面"的正确层次；行 5（最底行）盆底阴影与格底自然重叠，无出格问题。
  if(p.type!=='lilypad'&&p.type!=='planter'){
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(x,y+38+(onPot(p)?POT_LIFT-POT_SINK:0),26,7,0,0,Math.PI*2);ctx.fill();
  }

  if(p.type==='lilypad'){
    // v1.2 睡莲：扁平浮叶，水生植物无落地投影（上方已跳过阴影）
    ctx.fillStyle='#3f9a4e';
    ctx.beginPath();ctx.arc(x,y+8,26,0,Math.PI*2);ctx.fill();
    // 叶面高光（浅色月牙）
    ctx.fillStyle='#5cb86a';
    ctx.beginPath();ctx.ellipse(x-7,y+1,16,11,-0.5,0,Math.PI*2);ctx.fill();
    // 叶缘缺口（透出水面色）
    ctx.fillStyle='#4a90c2';
    ctx.beginPath();
    ctx.moveTo(x,y+8);
    ctx.arc(x,y+8,26,-Math.PI/2,-Math.PI/2+0.55);
    ctx.closePath();ctx.fill();
    // 叶脉
    ctx.strokeStyle='rgba(20,80,40,0.5)';ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5+0.4;
      ctx.beginPath();ctx.moveTo(x,y+8);
      ctx.lineTo(x+Math.cos(a)*20,y+8+Math.sin(a)*20);ctx.stroke();
    }
  }else if(p.type==='planter'){
    // v1.3 屋顶花盆：陶土圆台（占位载体，无攻击；盆口留空暗示"上面还能种"）
    // v1.3 修复：整体下移 POT_SINK px 落地，让出盆口上方给盆上植物（配合 drawPlant 的 POT_LIFT）
    y+=POT_SINK;
    ctx.fillStyle='#a05a34';                       // 盆身（梯形）
    ctx.beginPath();
    ctx.moveTo(x-22,y-10);ctx.lineTo(x+22,y-10);
    ctx.lineTo(x+16,y+22);ctx.lineTo(x-16,y+22);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#7a4022';                       // 盆底阴影
    ctx.fillRect(x-16,y+16,32,6);
    ctx.fillStyle='#c97a4a';                       // 盆口沿（椭圆）
    ctx.beginPath();ctx.ellipse(x,y-10,24,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a5a34';                       // 盆口内沿（土色凹陷）
    ctx.beginPath();ctx.ellipse(x,y-10,18,5.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a4526';                       // 盆土
    ctx.beginPath();ctx.ellipse(x,y-10,14,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.22)';        // 左侧高光
    ctx.beginPath();ctx.moveTo(x-18,y-6);ctx.lineTo(x-12,y-6);ctx.lineTo(x-8,y+16);ctx.lineTo(x-14,y+16);
    ctx.closePath();ctx.fill();
  }else if(p.type==='sunflower'){
    // v1.3 根茎：先画茎（位于花盘下层），花盘随后盖住茎顶，脸不被遮挡
    ctx.fillStyle='#3f7a26';                       // 茎身（深绿，与草地两色拉开对比）
    ctx.beginPath();
    ctx.moveTo(x-3,y+34);
    ctx.quadraticCurveTo(x-4.5,y+20,x-3,y+6);
    ctx.lineTo(x+3,y+6);
    ctx.quadraticCurveTo(x+4.5,y+20,x+3,y+34);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5d9a36';                       // 受光侧高光（窄条，扁平风格）
    ctx.beginPath();ctx.ellipse(x-1.5,y+21,1.5,13,0,0,Math.PI*2);ctx.fill();
    // 茎基泥痕：让茎"扎进土里"而不是浮在格上
    ctx.fillStyle='#6a4526';
    ctx.beginPath();ctx.ellipse(x,y+34,6,2.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffce3a';
    for(let i=0;i<10;i++){
      const a=i*Math.PI*2/10;
      ctx.beginPath();ctx.ellipse(x+Math.cos(a)*16,y+Math.sin(a)*16,10,5,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#5a3a1a';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b5a2a';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-4,y-2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-2,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-4,y-2,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-2,1.5,0,Math.PI*2);ctx.fill();
  }else if(p.type==='nut'){
    const k=p.dur/p.maxDur;
    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(x,y+2,28,34,0,0,Math.PI*2);ctx.fill();
    if(k<0.7){ctx.fillStyle='#5a3a1a';ctx.fillRect(x-6,y-20,3,10);ctx.fillRect(x+3,y-8,3,8)}
    if(k<0.4){ctx.fillStyle='#3a1a0a';ctx.fillRect(x-10,y+6,4,8);ctx.fillRect(x+8,y-2,3,10)}
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-6,y-4,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+6,y-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x-6,y-4,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+6,y-4,1.5,0,Math.PI*2);ctx.fill();
  }else if(p.type==='pea'||p.type==='double'){
    ctx.fillStyle='#4a8a2a';
    ctx.beginPath();ctx.ellipse(x,y+2,24,28,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6aa43a';
    ctx.beginPath();ctx.ellipse(x+10,y-8,18,18,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3a7a1a';
    ctx.beginPath();ctx.ellipse(x-16,y+20,10,5,0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x-14,y+30,10,5,-0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x+8,y-10,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(x+10,y-10,2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x+14,y-4,5,0.2,Math.PI-0.2);ctx.stroke();
    if(p.type==='double'){
      ctx.fillStyle='#6aa43a';
      ctx.beginPath();ctx.ellipse(x-6,y+4,14,14,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-8,y+2,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(x-8,y+2,1.5,0,Math.PI*2);ctx.fill();
    }
  }else if(p.type==='melon'){
    // V13-07b 整体下移 12px 坐地（用户：西瓜没有落地；球底 y+38 直接压在阴影上）
    ctx.fillStyle='#3a8a1a';
    ctx.beginPath();ctx.arc(x,y+12,26,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2a6a0a';
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath();ctx.ellipse(x+Math.cos(a)*14,y+12+Math.sin(a)*14,8,3,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.ellipse(x-8,y+4,6,4,0,0,Math.PI*2);ctx.fill();
  }else if(p.type==='cabbage'){
    // v1.3 投手：卷心菜球体 + 后倾发射碗（抛物投手剪影；GDD §3.2）；V13-07c 再下移 6px（用户：还是太高）
    ctx.fillStyle='#7aa84a';                       // 外叶（底部展开）
    ctx.beginPath();ctx.ellipse(x-14,y+26,12,7,0.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+14,y+26,12,7,-0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8bc45e';                       // 卷心菜球
    ctx.beginPath();ctx.arc(x,y+10,20,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5a8a34';ctx.lineWidth=2;     // 球体叶脉弧线
    ctx.beginPath();ctx.arc(x,y+10,13,0.6,2.5);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y+10,7,3.5,5.6);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';        // 高光
    ctx.beginPath();ctx.ellipse(x-7,y+3,6,4,0.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5a3a1a';                       // 发射木碗（前倾）
    ctx.beginPath();ctx.moveTo(x+10,y+18);ctx.quadraticCurveTo(x+22,y+22,x+20,y+30);
    ctx.quadraticCurveTo(x+12,y+34,x+6,y+30);ctx.closePath();ctx.fill();
  }else if(p.type==='mine'){
    const armed=p.armT<=0;
    // V13-07c 再下移 4px（用户：地瓜也再往下点）；土堆底 y+39 与阴影中心 y+38 对齐
    // 土堆
    ctx.fillStyle='#6a4a24';
    ctx.beginPath();ctx.ellipse(x,y+22,30,17,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(x,y+17,25,13,0,0,Math.PI*2);ctx.fill();
    if(armed){
      // 破土露头的地瓜
      ctx.fillStyle='#a0446a';
      ctx.beginPath();ctx.ellipse(x,y+4,19,15,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c25a86';
      ctx.beginPath();ctx.ellipse(x-5,y+1,10,6.5,0,0,Math.PI*2);ctx.fill();
      // 眼睛
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(x-5.5,y+3,3.6,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+5.5,y+3,3.6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(x-5.5,y+3,1.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+5.5,y+3,1.8,0,Math.PI*2);ctx.fill();
      // 待爆提示
      ctx.fillStyle='rgba(255,90,0,0.35)';
      ctx.beginPath();ctx.arc(x,y+6,26,0,Math.PI*2);ctx.fill();
    }else{
      // 埋土中：几个土块 + 进度环
      ctx.fillStyle='#5a3a1a';
      ctx.beginPath();ctx.arc(x-9,y+15,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+7,y+19,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+2,y+13,2,0,Math.PI*2);ctx.fill();
      const prog=1-p.armT/level.armTime;
      ctx.strokeStyle='rgba(255,255,255,0.75)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(x,y+8,20,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
      ctx.stroke();
    }
  }
  // 血条（坚果常显；地瓜不显示）
  if(p.type==='nut'){
    const k=p.dur/p.maxDur;
    ctx.fillStyle='#000';ctx.fillRect(x-24,y-42,48,4);
    ctx.fillStyle=k>0.5?'#3b3':'#f63';
    ctx.fillRect(x-24,y-42,48*k,4);
  }else if(p.type!=='mine'){
    const k=p.dur/p.maxDur;
    if(k<0.95){
      ctx.fillStyle='#000';ctx.fillRect(x-24,y-42,48,4);
      ctx.fillStyle=k>0.5?'#3b3':'#f63';
      ctx.fillRect(x-24,y-42,48*k,4);
    }
  }
}

function drawZombie(z){
  const x=z.x,y=GRID_Y+z.row*CELL_H+CELL_H/2-liftX(z.x);   // v1.3-M4 C2：沿坡连续（消灭 12px 电梯感）
  // v1.2.1 O3 腿部遮挡（方案甲 clip）：水行僵尸以腰线 y=16 为界裁切，水下（身体下半/手臂下半）整体不可见；
  // 水面渐变/波纹由 drawGameWorld 先画（在底层），僵尸裁切后水行像素自然露出，形成"泡在水里"的真实遮挡。
  // 生效条件 = 水域关 + 水行 + 身体中心已越过草坪右缘进入水面区（x≤GRID_X+COLS*CELL_W+8，
  // 与 updateZombies 入水水花触发同一边界）——水行僵尸走在右侧路面段时路面无水，不裁。
  // 陆地区/陆地行零感知（inWater=false 时路径与 v1.2.0 完全一致）。
  const inWater=level.water&&WATER_ROWS.includes(z.row)&&z.x<=GRID_X+COLS*CELL_W+8;
  ctx.save();
  ctx.translate(x,y);
  if(inWater){
    ctx.beginPath();ctx.rect(-60,-120,120,136);ctx.clip();   // 只露 y≤16（腰线）以上；136=16-(-120)
  }
  const wob=Math.sin(z.walk)*0.06;
  ctx.rotate(wob);
  if(!inWater){
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(0,42,26,6,0,0,Math.PI*2);ctx.fill();   // 落地投影（水中无投影）
  }
  // 身体
  ctx.fillStyle=z.type==='bucket'?'#4a5a5a':'#5a6a4a';
  ctx.fillRect(-16,-4,32,42);
  // 头
  ctx.fillStyle='#c5d0a0';
  ctx.beginPath();ctx.arc(0,-18,18,0,Math.PI*2);ctx.fill();
  // 眼睛
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(-6,-20,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6,-20,3,0,Math.PI*2);ctx.fill();
  // 嘴（张嘴）
  const mouthOpen=z.eating?(Math.sin(z.walk*2)*2+3):1;
  ctx.fillStyle='#600';
  ctx.fillRect(-14,-14+mouthOpen,28,4+mouthOpen*2);
  // 帽子 / 特殊
  if(z.type==='cone'){
    ctx.fillStyle='#d97b2a';
    ctx.beginPath();ctx.moveTo(-14,-30);ctx.lineTo(14,-30);ctx.lineTo(0,-52);ctx.closePath();ctx.fill();
  }else if(z.type==='bucket'){
    ctx.fillStyle='#b0b0b0';
    ctx.fillRect(-16,-40,32,12);
    ctx.fillStyle='#808080';
    ctx.fillRect(-18,-38,36,3);
  }else if(z.type==='fast'){
    ctx.fillStyle='#c04040';
    ctx.fillRect(-18,-4,36,10);
  }
  // 手臂
  ctx.fillStyle='#c5d0a0';
  ctx.fillRect(-24,10,10,22);
  ctx.fillRect(14,10,10,22);
  ctx.restore();
  if(inWater){
    // 水线亮带：腰线处一道浅色横条压在裁切边界上，强化"水位线"可读性（v1.2 引入的元素保留）
    ctx.fillStyle='rgba(200,235,255,0.5)';
    ctx.fillRect(x-18,y+14,36,3);
  }
  // 血条
  const k=z.hp/z.maxHp;
  ctx.fillStyle='#000';ctx.fillRect(x-24,y-50,48,4);
  ctx.fillStyle=k>0.5?'#4a4':'#f63';
  ctx.fillRect(x-24,y-50,48*k,4);
}

function drawProjectile(pr){
  if(pr.type==='pea'){
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(pr.x,pr.y+14,8,3,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(pr.x,pr.y,2,pr.x,pr.y,10);
    g.addColorStop(0,'#aef06a');g.addColorStop(1,'#4a8a2a');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(pr.x,pr.y,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath();ctx.arc(pr.x-3,pr.y-3,2.5,0,Math.PI*2);ctx.fill();
  }else if(pr.type==='melon'){
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(pr.x,pr.y+20,12,4,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(pr.x,pr.y,4,pr.x,pr.y,15);
    g.addColorStop(0,'#5bc030');g.addColorStop(1,'#1e5a10');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(pr.x,pr.y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a4a08';
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5;
      ctx.beginPath();ctx.arc(pr.x+Math.cos(a)*7,pr.y+Math.sin(a)*7,1.8,0,Math.PI*2);ctx.fill();
    }
  }else if(pr.type==='cabbage'){
    // v1.3 投手弹：卷心菜小球 + 速度方向倾斜（抛物弧线观感；vy 存在故可按 vx/vy 求倾角）
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();ctx.ellipse(pr.x,pr.y+14,9,3,0,0,Math.PI*2);ctx.fill();
    ctx.save();
    ctx.translate(pr.x,pr.y);
    ctx.rotate(Math.atan2(pr.vy||0,pr.vx||1));
    const cg=ctx.createRadialGradient(-2,-2,2,0,0,11);
    cg.addColorStop(0,'#a8d86a');cg.addColorStop(1,'#4a7a24');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3a6a1a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,6,0.4,2.6);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath();ctx.arc(-3,-3,2.5,0,Math.PI*2);ctx.fill();

}

function drawSun(e){
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(255,220,60,0.3)';
  ctx.beginPath();ctx.arc(0,0,26,0,Math.PI*2);ctx.fill();
  const g=ctx.createRadialGradient(0,0,2,0,0,18);
  g.addColorStop(0,'#fff8a0');g.addColorStop(1,'#ffb830');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffcb30';ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+e.t*0.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*20,Math.sin(a)*20);
    ctx.lineTo(Math.cos(a)*26,Math.sin(a)*26);
    ctx.stroke();
  }
  ctx.fillStyle='#fff';
  ctx.font='bold 14px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(e.value,0,0);
  ctx.restore();

function drawParticle(e){
  ctx.save();
  ctx.globalAlpha=Math.max(0,e.life/0.6);
  ctx.fillStyle=e.color;
  ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// F-03 冲击波环（蓝图 §4）：easeOutCubic 扩散 8→180px，alpha 0.9→0，线宽 3→1.5
// e.water（v1.2 入水涟漪）：水色环，复用同一 life/r 驱动逻辑
function drawShockwave(e){
  const k = 1 - e.life / e.maxLife;                 // 0→1
  const r = e.rStart + (e.rEnd - e.rStart) * Easing.easeOutCubic(k);
  const alpha = 0.9 * (1 - k);
  ctx.save();
  if(e.water){
    ctx.strokeStyle = `rgba(190,230,252,${alpha})`;
    ctx.lineWidth = 2.5 * (1 - k * 0.5);
  }else{
    ctx.strokeStyle = `rgba(255,220,180,${alpha})`;
    ctx.lineWidth = 3 * (1 - k * 0.5);
  }
  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

// F-03 火球扩为 450ms 三色段（蓝图 §4）：白心→橙→红橙→透明，前 30% 涨后回缩
function drawBoom(e){
  const k = Math.max(0, e.life / 0.45);
  const tn = 1 - k;
  const r = tn < 0.3 ? 40*Easing.easeOutCubic(tn/0.3) : 40*(1 - 0.35*(tn-0.3));
  ctx.save();
  ctx.globalAlpha = Math.min(1, k * 2);
  const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, r);
  g.addColorStop(0,   '#fffde0');
  g.addColorStop(0.3, '#ffb830');
  g.addColorStop(0.7, '#ff6a00');
  g.addColorStop(1,   'rgba(255,80,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ============ D-11 圆角化（蓝图 §6） ============
// 统一圆角矩形：现代浏览器 ctx.roundRect 原生支持，退化 arcTo 兼容旧内核。
// rr 内不碰 alpha；调用方需半透明时自行 save/set globalAlpha/fill/restore。
const RADIUS = { sm:4, md:8, lg:12 };
function rr(x, y, w, h, r=RADIUS.md){
  ctx.beginPath();
  if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }
}

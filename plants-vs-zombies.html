function drawCardFace(c,x,y,w,h){
  const cx=x+w/2,cy=y+h/2;
  ctx.fillStyle='#8ab44a';
  ctx.beginPath();ctx.ellipse(cx,y+h-4,w*0.4,4,0,0,Math.PI*2);ctx.fill();
  if(c.type==='sunflower'){
    // v1.3 根茎（卡面版）：与世界版同形等比缩小，保证卡面/世界观感一致
    ctx.fillStyle='#3f7a26';
    ctx.beginPath();
    ctx.moveTo(cx-2,cy+24);
    ctx.quadraticCurveTo(cx-3,cy+14,cx-2,cy+4);
    ctx.lineTo(cx+2,cy+4);
    ctx.quadraticCurveTo(cx+3,cy+14,cx+2,cy+24);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5d9a36';
    ctx.beginPath();ctx.ellipse(cx-1,cy+15,1,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a4526';
    ctx.beginPath();ctx.ellipse(cx,cy+24,4,1.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffce3a';
    for(let i=0;i<10;i++){
      const a=i*Math.PI*2/10;
      ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*14,cy+Math.sin(a)*14,8,4,a,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#5a3a1a';
    ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
  }else if(c.type==='nut'){
    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(cx,cy+4,20,24,0,0,Math.PI*2);ctx.fill();
  }else if(c.type==='pea'||c.type==='double'){
    ctx.fillStyle='#4a8a2a';
    ctx.beginPath();ctx.ellipse(cx,cy+2,20,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6aa43a';
    ctx.beginPath();ctx.ellipse(cx+8,cy-6,14,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx+6,cy-8,3,0,Math.PI*2);ctx.fill();
    if(c.type==='double'){
      ctx.fillStyle='#6aa43a';
      ctx.beginPath();ctx.ellipse(cx-6,cy+6,10,10,0,0,Math.PI*2);ctx.fill();
    }
  }else if(c.type==='melon'){
    ctx.fillStyle='#3a8a1a';
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1e5a10';
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5;
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*8,cy+Math.sin(a)*8,2,0,Math.PI*2);ctx.fill();
    }
  }else if(c.type==='mine'){
    // 土堆
    ctx.fillStyle='#6a4a24';
    ctx.beginPath();ctx.ellipse(cx,cy+14,24,10,0,0,Math.PI*2);ctx.fill();
    // 露头地瓜
    ctx.fillStyle='#a0446a';
    ctx.beginPath();ctx.ellipse(cx,cy+1,15,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c25a86';
    ctx.beginPath();ctx.ellipse(cx-4,cy-3,8,5,0,0,Math.PI*2);ctx.fill();
    // 眼睛
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(cx-4.5,cy-1,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+4.5,cy-1,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(cx-4.5,cy-1,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+4.5,cy-1,1.5,0,Math.PI*2);ctx.fill();
  }else if(c.type==='lilypad'){
    // v1.2 睡莲卡面：浮水椭圆 + 圆叶
    ctx.fillStyle='#4a90c2';   // 水面
    ctx.beginPath();ctx.ellipse(cx,cy+8,w*0.38,h*0.24,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3f9a4e';   // 圆叶
    ctx.beginPath();ctx.arc(cx,cy-2,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#5cb86a';   // 高光
    ctx.beginPath();ctx.ellipse(cx-5,cy-6,9,6,-0.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a90c2';   // 叶缘缺口
    ctx.beginPath();
    ctx.moveTo(cx,cy-2);
    ctx.arc(cx,cy-2,16,-Math.PI/2,-Math.PI/2+0.55);
    ctx.closePath();ctx.fill();
  }else if(c.type==='planter'){
    // v1.3 花盆卡面：陶土圆台 + 盆口
    ctx.fillStyle='#a05a34';
    ctx.beginPath();
    ctx.moveTo(cx-15,cy-6);ctx.lineTo(cx+15,cy-6);
    ctx.lineTo(cx+11,cy+16);ctx.lineTo(cx-11,cy+16);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#c97a4a';
    ctx.beginPath();ctx.ellipse(cx,cy-6,17,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8a5a34';
    ctx.beginPath();ctx.ellipse(cx,cy-6,12,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a4526';
    ctx.beginPath();ctx.ellipse(cx,cy-6,9,2.8,0,0,Math.PI*2);ctx.fill();
  }else if(c.type==='cabbage'){
    // v1.3 投手卡面：卷心菜球 + 叶脉
    ctx.fillStyle='#8bc45e';
    ctx.beginPath();ctx.arc(cx,cy+2,17,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5a8a34';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy+2,11,0.6,2.5);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy+2,6,3.5,5.6);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();ctx.ellipse(cx-6,cy-4,5,3.5,0.6,0,Math.PI*2);ctx.fill();
  }
}

    ctx.strokeRect(390,380,220,50);
    ctx.fillStyle='#3a1a0a';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText(`进入第${levelNo+1}关 →`,500,405);
  }
  const backY=hasNext?442:390;
  ctx.fillStyle='#8b6f2a';
  ctx.fillRect(390,backY,220,50);
  ctx.strokeStyle='#3a1a0a';ctx.lineWidth=2;
  ctx.strokeRect(390,backY,220,50);
  ctx.fillStyle='#fff';
  ctx.font='bold 20px "Microsoft YaHei"';
  ctx.fillText('返回菜单',500,backY+25);

  if(won&&!hasNext){
    ctx.fillStyle='#ffce3a';
    ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('🎉 已通关全部关卡！',canvas.width/2,480);
  }
}

// 启动
console.log('[PvZ] PvZ Lite '+VERSION+' 已启动');   // 版本号输出（#6）：控制台一眼可判版本
requestAnimationFrame(loop);
canvas.focus();
</script>

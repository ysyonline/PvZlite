// F-03 冲击波环（蓝图 §4）：easeOutCubic 扩散 8→180px，alpha 0.9→0，线宽 3→1.5
// e.water（v1.2 入水涟漪）：水色环，复用同一 life/r 驱动逻辑
function drawShockwave(e){
  const k = 1 - e.life / e.maxLife;                 // 0→1
  const r = e.rStart + (e.rEnd - e.rStart) * Easing.easeOutCubic(k);
  const alpha = 0.9 * (1 - k);
  ctx.save();
  if(e.water){
    ctx.strokeStyle = `rgba(190,230,252,${alpha})`;
    ctx.lineWidth = 2.5 * (1 - k * 0.5);
  }else{
    ctx.strokeStyle = `rgba(255,220,180,${alpha})`;
    ctx.lineWidth = 3 * (1 - k * 0.5);
  }
  ctx.beginPath();
  ctx.arc(e.x, e.y, r, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

// F-03 火球扩为 450ms 三色段（蓝图 §4）：白心→橙→红橙→透明，前 30% 涨后回缩
function drawBoom(e){
  // V22-FIX-01 · BUG-03：k 必须双侧夹到 [0,1]。旧式 k=max(0,life/0.45) 只夹下界，
  //   当 life>0.45（航椒 boom life=0.5 ⇒ k=1.111 ⇒ tn=-0.111）时 easeOutCubic 返回负值
  //   ⇒ 半径 r<0 ⇒ createRadialGradient 抛 IndexSizeError（帧渲染中断 + 屏幕底部红条）。
  //   夹紧后 tn∈[0,1] ⇒ r∈[0,40]；末尾 max(0,·) 为二次兜底（任何 life 取值都不抛异常）。
  const k = Math.max(0, Math.min(1, e.life / 0.45));
  const tn = 1 - k;
  const r = Math.max(0, tn < 0.3 ? 40*Easing.easeOutCubic(tn/0.3) : 40*(1 - 0.35*(tn-0.3)));
  ctx.save();
  ctx.globalAlpha = Math.min(1, k * 2);
  const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, r);
  g.addColorStop(0,   '#fffde0');
  g.addColorStop(0.3, '#ffb830');
  g.addColorStop(0.7, '#ff6a00');
  g.addColorStop(1,   'rgba(255,80,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// 死亡爆币·装饰飞币（2026-09-21 验收）：自转翻转 + 末 0.3s 淡出（alpha 须在绘制前设）
function drawCoinFx(e){
  ctx.save();
  ctx.globalAlpha=Math.max(0,Math.min(1,e.life/0.3));
  drawCoin(e.x,e.y,e.r,e.color,e.rot,e.rot);
  ctx.restore();
}
// 死亡爆币·爆点金光：径向渐变（白心→阶色→透明）炸开，easeOut 半径扩张
function drawCoinFlash(e){
  const k=1-e.life/e.maxLife;                        // 0→1
  const r=8+(e.r-8)*Easing.easeOutCubic(k);
  const a=0.75*(1-k);
  ctx.save();
  const g=ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,r);
  g.addColorStop(0,'rgba(255,253,224,'+(0.9*(1-k))+')');
  g.addColorStop(0.45,hexA(e.color,a));
  g.addColorStop(1,hexA(e.color,0));
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();
  // 外圈细光弧（金色描边随扩散变淡）
  ctx.strokeStyle=hexA(e.color,a*0.9);
  ctx.lineWidth=2*(1-k*0.6);
  ctx.beginPath();ctx.arc(e.x,e.y,r*1.08,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

// ============ D-11 圆角化（蓝图 §6） ============
// 统一圆角矩形：现代浏览器 ctx.roundRect 原生支持，退化 arcTo 兼容旧内核。
// rr 内不碰 alpha；调用方需半透明时自行 save/set globalAlpha/fill/restore。
const RADIUS = { sm:4, md:8, lg:12 };
function rr(x, y, w, h, r=RADIUS.md){
  ctx.beginPath();
  if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); }
  else {
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }
}

function drawCardBar(){
  ctx.fillStyle='#3a2410';
  ctx.fillRect(0,CARD_Y-4,canvas.width,CARD_H+8);
  ctx.fillStyle='#5a3a1a';
  ctx.fillRect(0,CARD_Y-4,canvas.width,3);

  // 铲子槽（D-11：圆角化）
  const sSel=selected&&selected.shovel;
  ctx.fillStyle=sSel?'#6a4a20':'#2a1a0a';
  ctx.strokeStyle=sSel?'#ffd54a':'#1a0f08';
  ctx.lineWidth=sSel?3:2;
  rr(SHOVEL_X,CARD_Y,SHOVEL_W,CARD_H,RADIUS.md);
  ctx.fill();ctx.stroke();
  drawShovelIcon(SHOVEL_X+SHOVEL_W/2,CARD_Y+CARD_H/2-6,1.15);
  ctx.fillStyle=sSel?'#ffd54a':'#e8dcc0';
  ctx.font='bold 11px "Microsoft YaHei"';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText('铲子 X',SHOVEL_X+SHOVEL_W/2,CARD_Y+CARD_H-6);

  for(let i=0;i<deck.length;i++){   // v1.4 T-14：渲染 deck（≤slots 张）；deck 内 type 经 CARDS 解析
    const type=deck[i];
    if(!type)continue;
    const c=CARDS.find(k=>k.type===type);
    if(!c)continue;
    const cx=CARD_X0+i*CARD_W;
    const ready=sun>=c.cost&&!(cardCD[c.type]>0);
    const sel=selected&&selected.i===i;
    ctx.fillStyle=sel?'#6a4a20':'#2a1a0a';
    ctx.strokeStyle=sel?'#ffd54a':'#1a0f08';
    ctx.lineWidth=sel?3:2;
    rr(cx,CARD_Y,CARD_W,CARD_H,RADIUS.md);
    ctx.fill();ctx.stroke();
    ctx.save();
    if(!ready)ctx.globalAlpha=0.35;
    drawCardFace(c,cx+4,CARD_Y+6,80,50);
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font='12px "Microsoft YaHei"';
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(c.name,cx+CARD_W/2,CARD_Y+CARD_H-20);
    ctx.fillStyle='#ffcb30';
    ctx.font='bold 14px Consolas,monospace';
    ctx.fillText(c.cost,cx+CARD_W/2,CARD_Y+CARD_H-4);
    if(cardCD[c.type]>0){
      ctx.fillStyle='rgba(0,0,0,0.55)';
      rr(cx,CARD_Y,CARD_W,CARD_H,RADIUS.md);   // 冷却遮罩随卡片圆角，避免直角外溢
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 20px Consolas,monospace';
      ctx.fillText(Math.ceil(cardCD[c.type]),cx+CARD_W/2,CARD_Y+CARD_H/2);
    }
  }
}

function drawCardFace(c,x,y,w,h){

  ctx.beginPath();ctx.ellipse(cx,y+h-4,w*0.4,4,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#3f7a26';
    ctx.beginPath();
    ctx.moveTo(cx-2,cy+24);
    ctx.quadraticCurveTo(cx-3,cy+14,cx-2,cy+4);
    ctx.lineTo(cx+2,cy+4);
    ctx.quadraticCurveTo(cx+3,cy+14,cx+2,cy+24);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#5d9a36';
    ctx.beginPath();ctx.ellipse(cx-1,cy+15,1,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6a4526';
    ctx.beginPath();ctx.ellipse(cx,cy+24,4,1.8,0,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#8b6528';
    ctx.beginPath();ctx.ellipse(cx,cy+4,20,24,0,0,Math.PI*2);ctx.fill();

// ---- v2.0 M2 T-204：选关页（state='select'）----
// 页签需运行态（当前页 + 每世界页签文案差异），非纯常量：selTab 全局、页签时间标注按 Q-6a 分世界写死。
let selTab=1;   // 当前页签（世界号 1..4）；T-205 命中切换，进页缺省=levelKey 所在世界（onClickMenu 入口处设）
const SEL_TAB_TIME={1:'昼1-5 · 夜6-10',2:'昼1-2 · 夜3-5 · 雾6-10',3:'昼1-5 · 夜6-10',4:'昼1-5 · 夜6-10'};   // Q-6a：泳池特殊三段
function drawSelect(){
  const G=SELECT_GEOM;
  const th=WORLD_THEMES[selTab];
  // 背景：世界主题昼板色调渐变（随页签换色，视觉区分四个世界）
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,th.dayLawn[0]);g.addColorStop(1,th.dayLawn[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  // 页签行（4 世界；当前页金底，其余绿底）
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let w=1;w<=4;w++){
    const T=G.TAB,bx=T.x0+(w-1)*(T.w+T.gap);
    ctx.fillStyle=(w===selTab)?'#c9a34a':'#2a5a1a';
    ctx.fillRect(bx,T.y,T.w,T.h);
    ctx.strokeStyle='#3a1a0a';ctx.lineWidth=2;ctx.strokeRect(bx,T.y,T.w,T.h);
    ctx.fillStyle=(w===selTab)?'#3a1a0a':'#fff';
    ctx.font='bold 17px "Microsoft YaHei"';
    ctx.fillText(WORLD_THEMES[w].name,bx+T.w/2,T.y+15);
    ctx.font='11px "Microsoft YaHei"';
    ctx.fillStyle=(w===selTab)?'#5a4a1a':'#e8dcc0';
    ctx.fillText(SEL_TAB_TIME[w],bx+T.w/2,T.y+32);
  }
  // 难度行（Q-17：页签下方三态钮；当前难度金底）
  const names=Object.keys(DIFFS),labels=['普通','困难','地狱'];
  ctx.font='14px "Microsoft YaHei"';
  ctx.fillStyle='#f0e8c8';
  ctx.textAlign='right';
  ctx.fillText('难度',G.DIFF.x0-14,G.DIFF.y+G.DIFF.h/2);
  ctx.textAlign='center';
  for(let i=0;i<3;i++){
    const D=G.DIFF,bx=D.x0+i*(D.w+D.gap);
    ctx.fillStyle=(DIFF===names[i])?'#c9a34a':'#2a5a1a';
    ctx.fillRect(bx,D.y,D.w,D.h);
    ctx.strokeStyle='#3a1a0a';ctx.lineWidth=2;ctx.strokeRect(bx,D.y,D.w,D.h);
    ctx.fillStyle=(DIFF===names[i])?'#3a1a0a':'#fff';
    ctx.font='bold 15px "Microsoft YaHei"';
    ctx.fillText(labels[i],bx+D.w/2,D.y+D.h/2);
  }
  // 关卡格 2 行×5 列 = 本世界 10 关（Q-10：40 格全可见；三态=可玩亮色/已通关金框角标/占位灰调+敬请期待）
  for(let row=0;row<2;row++)for(let col=0;col<5;col++){
    const C=G.CELL,l=row*5+col+1,k=selTab+'-'+l;
    const bx=C.x0+col*(C.w+C.colGap),by=C.y+row*(C.h+C.rowGap);
    const locked=!testMode&&keyOrd(k)>keyOrd(unlocked),cleared=saveCleared.indexOf(k)>-1,cur=levelKey===k;   // v2.0.1：test=1 解锁定闸（锁定格按可玩亮色渲染；占位灰调在前置 fillStyle 恒呈现与 testMode 无关）
    const award=SLOT_CONFIG.CARD_AWARD[k];
    const placeholder=(award==null||award==='PLACEHOLDER');   // Q-4 占位=无真卡发放（与可玩性判定解耦：可玩格走锁定/当前态覆盖，占位灰恒呈现敬请期待）
    ctx.fillStyle=placeholder?'#4a4a42':(locked?'#3a3a2a':(cleared?'#8a6f2a':'#2a5a1a'));
    ctx.fillRect(bx,by,C.w,C.h);
    ctx.strokeStyle=(cleared&&!placeholder)?'#ffd54a':'#3a1a0a';   // 已通关金框强调
    ctx.lineWidth=cur?3:2;
    ctx.strokeRect(bx,by,C.w,C.h);
    ctx.fillStyle=placeholder?'#8a8a7a':(locked?'#7a7a6a':(cleared?'#ffe9a0':'#fff'));
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText(k,bx+C.w/2,by+22);   // 主标=关号 'w-l'
    ctx.font='12px "Microsoft YaHei"';
    const timeShort={day:'☀ 白天',night:'☾ 夜晚',fog:'🌫 浓雾'}[LEVELS[k]?LEVELS[k].time:'day'];
    ctx.fillText(placeholder?'敬请期待':(locked?'通关前一关解锁':timeShort+' · '+LEVELS[k].totalWaves+' 波'),bx+C.w/2,by+46);
    // T-302a（Q-3=B）：第三行奖励预览——真卡=卡名 / 金币=「n 金币」/ 占位=不显示（与可玩性解耦，走 CARD_AWARD 三态；
    //   位置走共享常量 SELECT_GEOM.CELL_REWARD_DY，禁硬编码）。金币用文字+项目金色（免 emoji 字体回退风险）。
    if(!placeholder){
      let rew='';
      if(typeof award==='number') rew=award+' 金币';
      else if(typeof award==='string'){ const rc=CARDS.find((x)=>x.type===award); rew=rc?rc.name:award; }
      if(rew){
        ctx.fillStyle='#ffd54a';   // 奖励金色（与「✓ 已通关」角标/积分/金币同一强调色）
        ctx.font='12px "Microsoft YaHei"';
        ctx.fillText(rew,bx+C.w/2,by+G.CELL_REWARD_DY);
      }
    }
    if(cur){   // 当前选中关：左上角小角标
      ctx.fillStyle='#ffd54a';
      ctx.font='bold 11px "Microsoft YaHei"';
      ctx.fillText('▶ 当前',bx+30,by+12);
    }
    if(cleared){   // 已通关角标（右上）
      ctx.fillStyle='#ffd54a';
      ctx.font='bold 11px "Microsoft YaHei"';
      ctx.fillText('✓ 已通关',bx+C.w-34,by+12);
    }
  }
  // 底部提示与统计（承接旧菜单删去的规则文案；世界通关奖励提示沿 §4 CLEAR_REWARD=300 金币/世界）
  ctx.fillStyle='#f0e8c8';
  ctx.font='14px "Microsoft YaHei"';
  ctx.fillText('1-9 选卡 · X 铲子 · 空格 暂停 · F 加速 · M 静音 · Esc 取消',canvas.width/2,396);
  ctx.fillText('通关每关解锁新植物 · 集齐一世界 10 关通关领 300 金币',canvas.width/2,418);
  // 返回主菜单钮（几何 = SELECT_GEOM.BACK，与 T-205 onClickSelect 命中共用）
  const B=G.BACK;
  ctx.fillStyle='#8b6f2a';ctx.fillRect(B.x,B.y,B.w,B.h);
  ctx.strokeStyle='#3a1a0a';ctx.lineWidth=3;ctx.strokeRect(B.x,B.y,B.w,B.h);
  ctx.fillStyle='#fff';
  ctx.font='bold 22px "Microsoft YaHei"';
  ctx.fillText('返回主菜单',B.x+B.w/2,B.y+B.h/2);
  // 页脚：积分 + 历史最高分 + 版本角标
  ctx.fillStyle='#ffd54a';
  ctx.font='bold 14px Consolas,monospace';
  ctx.fillText('积分 '+points,canvas.width/2,500);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='13px "Microsoft YaHei"';
  ctx.fillText('历史最高分 '+highScore,canvas.width/2,522);
  ctx.textAlign='right';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,0.42)';
  ctx.font='11px Consolas,monospace';
  ctx.fillText(VERSION,canvas.width-10,canvas.height-10);
}

function drawEnd(){
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const cx=canvas.width/2;
  if(won){
    ctx.fillStyle='#7ee06a';
    ctx.font='bold 72px "Impact","Microsoft YaHei"';
    ctx.fillText('通关！',cx,180);
    ctx.fillStyle='#fff';
    ctx.font='18px "Microsoft YaHei"';
    ctx.fillText(`${level.name} · 已击退全部 ${level.totalWaves} 波僵尸`,cx,236);

    // 通关奖励：植物淡入展示（v2.2.4 简化——去掉礼盒动画，奖励植物淡淡的出现；动画区 y=290~460）
    if(giftAnim.active&&giftAnim.card){
      const t=giftAnim.t;
      const card=giftAnim.card;
      const fx=cx,fy=355;
      // 植物淡入：alpha 0→0.85（约 1.0s），轻微上浮 10px（"淡淡出现"）
      const fadeIn=Math.min(1,t/1.0);
      const a=0.85*fadeIn;
      const riseY=10*(1-fadeIn);
      const scale=0.92+0.08*Easing.easeOut(fadeIn);   // 轻微放大落定
      ctx.save();
      ctx.globalAlpha=a;
      ctx.translate(fx,fy+riseY);
      ctx.scale(scale,scale);
      drawCardFace(card,-60,-40,120,80);  // 奖励植物卡片面（原礼盒内同款，中心对齐 fy）
      ctx.restore();
      // 植物名称（与植物同步淡入，略低位置）
      if(t>0.4){
        const nA=0.9*Math.min(1,(t-0.4)/0.6);
        ctx.fillStyle='rgba(255,213,74,'+nA+')';
        ctx.font='bold 22px "Microsoft YaHei"';
        ctx.fillText(card.name,fx,fy+72);
        const sA=0.7*Math.min(1,(t-0.55)/0.6);   // 副标题略延迟
        ctx.fillStyle='rgba(255,255,255,'+sA+')';
        ctx.font='14px "Microsoft YaHei"';
        ctx.fillText('新植物解锁！',fx,fy+94);
      }
    }else if(!giftAnim.active){
      // 无奖励卡时占位提示（保留动画区空白，视觉不突兀）
      ctx.fillStyle='rgba(255,255,255,0.35)';
      ctx.font='14px "Microsoft YaHei"';
      ctx.fillText('✧ 恭喜通关！✧',cx,330);
    }
  }else{
    ctx.fillStyle='#f87171';
    ctx.font='bold 68px "Impact","Microsoft YaHei"';
    ctx.fillText('游戏结束',cx,200);
    ctx.fillStyle='#fff';
    ctx.font='18px "Microsoft YaHei"';
    ctx.fillText(`僵尸闯进了屋子……`,cx,252);
  }

  // 分数与积分行（精简到一行，v2.3 消缺）
  ctx.fillStyle='#ffd54a';
  ctx.font='bold 15px "Microsoft YaHei"';
  ctx.fillText(`分数 ${score}  ·  积分 ${points}`,cx,486);

  // 通关且同世界还有下一关 → 「下一关」钮（T-301：w-(l+1) 同世界口径，世界末关隐藏）
  const _m=/^([1-4])-([1-9]|10)$/.exec(levelKey);
  const hasNext=won&&!!_m&&+_m[2]<10;
  const _nk=hasNext?_m[1]+'-'+(+_m[2]+1):null;
  const B=END_BTN;
  if(hasNext){
    ctx.fillStyle='#c9a34a';
    ctx.fillRect(B.x,B.nextY,B.w,B.h);
    ctx.strokeStyle='#3a1a0a';ctx.lineWidth=2;
    ctx.strokeRect(B.x,B.nextY,B.w,B.h);
    ctx.fillStyle='#3a1a0a';
    ctx.font='bold 20px "Microsoft YaHei"';
    ctx.fillText(`进入第${_nk}关 →`,B.x+B.w/2,B.nextY+B.h/2);
  }
  const backY=hasNext?B.nextY+B.backGap:B.nextY;
  ctx.fillStyle='#8b6f2a';
  ctx.fillRect(B.x,backY,B.w,B.h);
  ctx.strokeStyle='#3a1a0a';ctx.lineWidth=2;
  ctx.strokeRect(B.x,backY,B.w,B.h);
  ctx.fillStyle='#fff';
  ctx.font='bold 20px "Microsoft YaHei"';
  ctx.fillText('返回选关',B.x+B.w/2,backY+B.h/2);

  if(won&&!hasNext){
    ctx.fillStyle='#ffce3a';
    ctx.font='14px "Microsoft YaHei"';
    ctx.fillText('已通关全部关卡！',cx,520);
  }
}

// 启动
console.log('[PvZ] PvZ Lite '+VERSION+' 已启动');   // 版本号输出（#6）：控制台一眼可判版本
requestAnimationFrame(loop);
canvas.focus();
</script>
